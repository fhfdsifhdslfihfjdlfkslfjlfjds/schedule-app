  const [todos, setTodos] = useState({});
  // officeEvents: { [dateStr]: [{id,text}] } — 日付ごとの社内行事（チェックなしのメモ一覧）
  const [officeEvents, setOfficeEvents] = useState({});
  const [loaded, setLoaded] = useState(false);
  const [saving, setSaving] = useState(false);

  const [anchor, setAnchor] = useState(() => startOfWeek(new Date()));
  const [selectedDate, setSelectedDate] = useState(() => ymd(new Date()));
  // 時間軸の表示開始日（既定=今日, 日曜なら翌稼働日）。3稼働日ウィンドウの先頭。
  const [timelineStart, setTimelineStart] = useState(() =>
    firstWorkday(parseYmd(ymd(new Date())))
  );
  // 開始日を常に稼働日へ正規化してセット
  const goTimeline = (d) => setTimelineStart(firstWorkday(d));
  // 週の表示モード: timed(時間軸) | ampm(午前/午後表)。起動時は午前/午後を既定表示。
  const [slotMode, setSlotMode] = useState("ampm");

  // 編集モーダル
  const [editor, setEditor] = useState(null);
  // 受注メンバー設定モーダル
  const [showOrderConfig, setShowOrderConfig] = useState(false);
  // メンバー管理モーダル
  const [showMemberMgr, setShowMemberMgr] = useState(false);
  // 日詳細サイドパネル（既定は閉じる。日付ヘッダークリックで開く）
  const [showDayPanel, setShowDayPanel] = useState(false);
  // ヘッダーの便利機能メニュー（ドロップダウン）
  const [showMenu, setShowMenu] = useState(false);
  // シフト取込モーダル
  const [showShiftImport, setShowShiftImport] = useState(false);
  // 一括入力モーダル（複数メンバー×複数日に同じ予定を登録）
  const [showBulkAdd, setShowBulkAdd] = useState(false);
  // パート設定モーダル / パート設定 { [name]: {start,end,breakStart,breakEnd} }
  const [showPartConfig, setShowPartConfig] = useState(false);
  const [partConfig, setPartConfig] = useState({});
  // AI(ルールベース)配置: 曜日別ルール＋モーダル
  const [autoRules, setAutoRules] = useState(() => defaultAutoRules());
  const [showAutoSchedule, setShowAutoSchedule] = useState(false);
  const [showAutoRule, setShowAutoRule] = useState(false);
  // 2人体制ペア相性表（「組めない」ペアのみ保持）＋モーダル
  const [pairsNG, setPairsNG] = useState({});
  const [pairsEnabled, setPairsEnabled] = useState(true); // 自動配置にペア相性を反映するか
  const [showPairMatrix, setShowPairMatrix] = useState(false);
  // 締めアラート関連
  const [dismissedAlerts, setDismissedAlerts] = useState({}); // {dateStr: true}
  const [alertsEnabled, setAlertsEnabled] = useState(true);
  // 引継ぎ（申し送りログ）
  const [handovers, setHandovers] = useState([]);
  const [showHandover, setShowHandover] = useState(false);
  // 共有（サーバー同期）
  const [showSyncConfig, setShowSyncConfig] = useState(false);
  const [syncOn, setSyncOn] = useState(() => isSyncOn());
  // "local"（この端末のみ）| "synced" | "offline"
  const [syncStatus, setSyncStatus] = useState(() => (isSyncOn() ? "synced" : "local"));
  const [syncAt, setSyncAt] = useState("");
  const [pulledNote, setPulledNote] = useState(""); // 「他の人の変更を取り込みました」の一時表示
  const dirtyRef = React.useRef(false); // 未保存の変更があるか（取り込みの抑止に使う）
  const restoreRef = React.useRef(null); // 復元用 <input type="file">
  // 取り込み直後の再保存を1回だけ止める（保存→取り込み→保存…のループ防止）
  const skipSaveRef = React.useRef(false);

  /* 読み込んだデータを画面へ反映（初回ロード・復元・他の人の変更の取り込みで共用） */
  const applyLoadedState = useCallback((s) => {
      if (!s) return;
      skipSaveRef.current = true; // 反映直後の自動保存を1回スキップ
        if (Array.isArray(s.members) && s.members.length) setMembers(s.members);
        if (Array.isArray(s.orderMembers)) setOrderMembers(s.orderMembers);
        if (s.events) setEvents(migrateEvents(s.events));
        // slotMode は保存値を読み込まず、起動時は常に午前/午後を既定表示にする
        if (s.todos && typeof s.todos === "object") {
          // 旧構造 { day:{...}, week:{...} } からの移行
          if (s.todos.day || s.todos.week) {
            const migrated = { ...(s.todos.day || {}) };
            // 旧・週TODOは週開始日(月曜)の日付に寄せて取り込む
            for (const [wk, list] of Object.entries(s.todos.week || {})) {
              migrated[wk] = [...(migrated[wk] || []), ...list];
            }
            setTodos(migrated);
          } else {
            setTodos(s.todos);
          }
        }
        if (s.officeEvents && typeof s.officeEvents === "object") {
          setOfficeEvents(s.officeEvents);
        }
        if (s.dismissedAlerts && typeof s.dismissedAlerts === "object") {
          setDismissedAlerts(s.dismissedAlerts);
        }
        if (typeof s.alertsEnabled === "boolean") {
          setAlertsEnabled(s.alertsEnabled);
        }
        if (s.partConfig && typeof s.partConfig === "object") {
          setPartConfig(s.partConfig);
        }
        if (s.autoRules && typeof s.autoRules === "object") {
          setAutoRules(s.autoRules);
        }
        if (s.pairsNG && typeof s.pairsNG === "object") {
          setPairsNG(s.pairsNG);
        }
        if (typeof s.pairsEnabled === "boolean") {
          setPairsEnabled(s.pairsEnabled);
        }
        if (Array.isArray(s.handovers)) {
          // 引継ぎは日毎にリセット：当日分だけ残す（前日以前は破棄）
          const todayStr = ymd(new Date());
          setHandovers(
            s.handovers
              .map((h) => ({
                ...h,
                category: normHandoverCat(h.category),
                date: h.date || ymd(new Date(h.createdAt)),
              }))
              .filter((h) => h.date === todayStr)
          );
        }
  }, []);

  /* 初回ロード */
  useEffect(() => {
    (async () => {
      const s = await loadState();
      applyLoadedState(s);
      if (isSyncOn()) {
        setSyncStatus(sync.ok ? "synced" : "offline");
        setSyncAt(sync.lastAt || "");
      }
      setLoaded(true);
    })();
  }, [applyLoadedState]);

  /* 自動保存（共有設定があればサーバーへも同期する） */
  useEffect(() => {
    if (!loaded) return;
    if (skipSaveRef.current) {
      skipSaveRef.current = false;
      return; // 読み込み・取り込み直後は保存しない
    }
    setSaving(true);
    dirtyRef.current = true;
    const t = setTimeout(async () => {
      const res = await saveState({
        members,
        orderMembers,
        events,
        slotMode,
        todos,
        officeEvents,
        dismissedAlerts,
        alertsEnabled,
        partConfig,
        autoRules,
        pairsNG,
        pairsEnabled,
        handovers,
      });
      if (res && res.mode !== "local") {
        setSyncStatus(res.mode); // "synced" or "offline"
        if (res.mode === "synced") setSyncAt(sync.lastAt || "");
        // 競合を自動マージした場合は、その結果を画面へ反映する
        if (res.merged) {
          applyLoadedState(res.merged);
          setPulledNote("他の人の変更と自動でマージしました");
        }
      }
      dirtyRef.current = false;
      setSaving(false);
    }, 500);
    return () => clearTimeout(t);
  }, [members, orderMembers, events, slotMode, todos, officeEvents, dismissedAlerts, alertsEnabled, partConfig, autoRules, pairsNG, pairsEnabled, handovers, loaded, applyLoadedState]);

  /* 他の人の変更を定期的に取り込む（15秒ごと・自分に未保存の変更が無いときだけ） */
  useEffect(() => {
    if (!loaded || !syncOn) return;
    const iv = setInterval(async () => {
      if (dirtyRef.current || document.hidden) return;
      try {
        const res = await apiGet();
        setSyncStatus("synced");
        setSyncAt(res.updatedAt || "");
        if ((res.version || 0) !== sync.version && res.data) {
          sync.version = res.version || 0;
          sync.lastAt = res.updatedAt || "";
          sync.base = structuredClone(res.data);
          sync.ok = true;
          applyLoadedState(res.data);
          setPulledNote("他の人の変更を取り込みました");
        }
      } catch (e) {
        setSyncStatus("offline");
      }
    }, 15000);
    return () => clearInterval(iv);
  }, [loaded, syncOn, applyLoadedState]);

  /* 取り込み通知は数秒で自動的に消す */
  useEffect(() => {
    if (!pulledNote) return;
    const t = setTimeout(() => setPulledNote(""), 5000);
    return () => clearTimeout(t);
  }, [pulledNote]);

  // メニュー（ドロップダウン）：外側クリック / Escape で閉じる
  useEffect(() => {
    if (!showMenu) return;
    const onDown = (e) => {
      if (!e.target.closest(".menu-wrap")) setShowMenu(false);
    };
    const onKey = (e) => {
      if (e.key === "Escape") setShowMenu(false);
    };
    document.addEventListener("mousedown", onDown);
    document.addEventListener("keydown", onKey);
    return () => {
      document.removeEventListener("mousedown", onDown);
      document.removeEventListener("keydown", onKey);
    };
  }, [showMenu]);

  // イベントが変更された日付の dismissal は無効化（状況が変わったので再評価）
  const clearDismissal = useCallback((dateStr) => {
    setDismissedAlerts((prev) => {
      if (!prev[dateStr]) return prev;
      const next = { ...prev };
      delete next[dateStr];
      return next;
    });
  }, []);
  const dismissAlert = useCallback((dateStr) => {
    setDismissedAlerts((prev) => ({ ...prev, [dateStr]: true }));
  }, []);

  const weekDays = useMemo(
    () => Array.from({ length: 6 }, (_, i) => addDays(anchor, i)), // 月〜土（午前/午後表用）
    [anchor]
  );
  // 時間軸用: timelineStart から日曜を飛ばして TIMELINE_DAYS 稼働日分
  const timelineDays = useMemo(
    () => buildTimelineDays(timelineStart, TIMELINE_DAYS),
    [timelineStart]
  );

  /* ---------- TODO操作（日付ごと） ---------- */
  const getTodos = useCallback(
    (dateStr) => todos?.[dateStr] || [],
    [todos]
  );
  function addTodo(dateStr, text) {
    const t = (text || "").trim();
    if (!t) return;
    setTodos((prev) => {
      const next = structuredClone(prev);
      next[dateStr] = next[dateStr] || [];
      next[dateStr].push({
        id: `td_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
        text: t,
        done: false,
      });
      return next;
    });
  }
  function toggleTodo(dateStr, id) {
    setTodos((prev) => {
      const next = structuredClone(prev);
      const list = next?.[dateStr] || [];
      const it = list.find((x) => x.id === id);
      if (it) it.done = !it.done;
      return next;
    });
  }
  function deleteTodo(dateStr, id) {
    setTodos((prev) => {
      const next = structuredClone(prev);
      const list = next?.[dateStr] || [];
      next[dateStr] = list.filter((x) => x.id !== id);
      return next;
    });
  }

  /* ---------- 社内行事（日付ごと・チェックなし） ---------- */
  const getOfficeEvents = useCallback(
    (dateStr) => officeEvents?.[dateStr] || [],
    [officeEvents]
  );
  function addOfficeEvent(dateStr, text) {
    const t = (text || "").trim();
    if (!t) return;
    setOfficeEvents((prev) => {
      const next = structuredClone(prev);
      next[dateStr] = next[dateStr] || [];
      next[dateStr].push({
        id: `oe_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
        text: t,
      });
      return next;
    });
  }
  function deleteOfficeEvent(dateStr, id) {
    setOfficeEvents((prev) => {
      const next = structuredClone(prev);
      const list = next?.[dateStr] || [];
      next[dateStr] = list.filter((x) => x.id !== id);
      return next;
    });
  }

  /* ---------- 引継ぎ（申し送りログ） ---------- */
  function addHandover(text, author, category) {
    const t = (text || "").trim();
    if (!t) return;
    setHandovers((prev) => [
      {
        id: `hv_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
        createdAt: Date.now(),
        date: ymd(new Date()), // 日毎リセット用の投稿日
        author: (author || "").trim(),
        category: normHandoverCat(category),
        text: t,
      },
      ...prev,
    ]);
  }
  function deleteHandover(id) {
    setHandovers((prev) => prev.filter((h) => h.id !== id));
  }
  // 申し送りの編集（本文・投稿者・カテゴリを更新。投稿日時はそのまま）
  function updateHandover(id, patch) {
    const t = (patch.text || "").trim();
    if (!t) return;
    setHandovers((prev) =>
      prev.map((h) =>
        h.id === id
          ? {
              ...h,
              text: t,
              author: (patch.author || "").trim(),
              category: normHandoverCat(patch.category),
            }
          : h
      )
    );
  }
  // 引継ぎ解析で選ばれたTODO候補をまとめて追加（同日同文の重複は除外）
  function addTodosFromHandover(picks) {
    setTodos((prev) => {
      const next = structuredClone(prev);
      for (const p of picks) {
        const list = (next[p.dateStr] = next[p.dateStr] || []);
        if (list.some((t) => t.text === p.text)) continue; // 重複ガード
        list.push({
          id: `td_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
          text: p.text,
          done: false,
        });
      }
      return next;
    });
  }

  /* ---------- イベント操作 ---------- */
  // getCell は AM/PM のエントリ配列を返す（無ければ空配列）
  const getCell = useCallback(
    (member, dateStr, slot) => events?.[member]?.[dateStr]?.[slot] || [],
    [events]
  );
  const getTimed = useCallback(
    (member, dateStr) => events?.[member]?.[dateStr]?.timed || [],
    [events]
  );

  // 1 日分の AM/PM 表示に必要な情報を一括で返す。
  // - am, pm: 自分の入力エントリ配列
  // - amDerived, pmDerived: 時間軸の予定から派生（開始時刻で AM/PM 振り分け）
  // - fullDay: 有給/公休 のエントリ（あれば AM/PM を 1 マスに合体）
  // - fullDaySlot: その有給/公休 がどちらに入っているか
  const getAmpmDisplay = useCallback(
    (member, dateStr) => {
      const day = events?.[member]?.[dateStr] || {};
      const am = day.AM || [];
      const pm = day.PM || [];
      const timed = day.timed || [];
      // part:true の時間軸予定(パート基本シフト)は午前/午後へ派生させない（時間軸専用）
      const splitByHour = (it) =>
        parseInt((it.start || "00:00").slice(0, 2), 10) < 12 ? "AM" : "PM";

      // パート: 既定シフトの「勤務ブロック」はAM/PM表に出さない。
      // 退社が既定と違う日だけ「○○退社」ラベルを出す。実予定(区分付き/メモ付き)は表示。
      const pcfg = partConfig[member] ? mergePartCfg(partConfig[member]) : null;
      const isShiftBlock = (it) =>
        it.part || (it.cat === "other" && (!it.text || it.text === "勤務"));
      let hideShift = () => false;
      const partNotes = []; // {slot, cat, text} 表示専用
      if (pcfg) {
        const shift = timed.filter(isShiftBlock);
        if (shift.length) {
          const clockOut = shift.reduce(
            (mx, b) => (b.end > mx ? b.end : mx),
            "00:00"
          );
          hideShift = isShiftBlock;
          if (clockOut !== pcfg.end) {
            const slot = parseInt(clockOut.slice(0, 2), 10) >= 12 ? "PM" : "AM";
            partNotes.push({
              slot,
              cat: clockOut < pcfg.end ? EARLY_LEAVE_CAT : "other",
              text: `${clockOut}退社`,
            });
          }
        }
      }

      const amDerived = timed
        .filter((it) => !it.part && !hideShift(it) && splitByHour(it) === "AM")
        .sort((a, b) => a.start.localeCompare(b.start));
      const pmDerived = timed
        .filter((it) => !it.part && !hideShift(it) && splitByHour(it) === "PM")
        .sort((a, b) => a.start.localeCompare(b.start));
      const amFD = findFullDayEntry(am);
      const pmFD = findFullDayEntry(pm);
      const fullDay = amFD || pmFD;
      const fullDaySlot = amFD ? "AM" : pmFD ? "PM" : null;
      // 退社ラベルを表示専用で追記（元配列は破壊しない）
      const amOut = [...am, ...partNotes.filter((n) => n.slot === "AM")];
      const pmOut = [...pm, ...partNotes.filter((n) => n.slot === "PM")];
      return {
        am: amOut,
        pm: pmOut,
        amDerived,
        pmDerived,
        fullDay,
        fullDaySlot,
      };
    },
    [events, partConfig]
  );

  // 午前/午後セル → 時間軸ブロックへ変換して重ねる（週・日 共通）。
  // 時刻のない AM/PM 予定は区分別の既定時間(slotBlockTime)でブロック化。
  // 有給/公休(全日)は 07:00-16:00。part:true(パートの退社メモ)は時間軸へ出さない。
  const getTimedMerged = useCallback(
    (member, dateStr) => {
      const day = events?.[member]?.[dateStr] || {};
      const real = (day.timed || []).map((it) => ({ ...it, _real: true }));
      const synth = [];
      // 全日は AM/PM どちらかにあれば全日ブロック化
      const fullDay =
        findFullDayEntry(day.AM) || findFullDayEntry(day.PM) || null;
      // その枠(AM/PM)に役割(TEL①/②/フォロー)が入っていればその区分を返す
      const slotRoleCat = (slot) => {
        if (fullDay && ORDER_ROLE_CATS.includes(fullDay.cat)) return fullDay.cat;
        for (const rc of ORDER_ROLE_CATS) {
          if ((day[slot] || []).some((e) => e && e.cat === rc && !e.part)) return rc;
        }
        return null;
      };
      // 非役割・非早上がりの時刻未定予定は、同枠の役割窓にスナップ（無ければ自区分の既定窓）。
      // これで役割ブロックが併存予定に伸ばされず、役割窓ちょうどに固定表示される。
      const winCatFor = (e, slot) =>
        (ORDER_ROLE_CATS.includes(e.cat) || e.cat === EARLY_LEAVE_CAT)
          ? e.cat
          : (slotRoleCat(slot) || e.cat);
      if (fullDay) {
        const fdText = fullDay.text || (CATEGORIES[fullDay.cat]?.label ?? "");
        if (ORDER_ROLE_CATS.includes(fullDay.cat)) {
          // TEL①/②/フォロー の全日 → AM/PM で入れたのと同じ 2 ブロック（各区分の窓）
          for (const slot of ["AM", "PM"]) {
            const [start, end] = slotBlockTime(fullDay.cat, slot);
            synth.push({
              id: `__fd${slot.toLowerCase()}_${dateStr}`,
              start,
              end,
              cat: fullDay.cat,
              text: fdText,
              _real: false,
              _fullRole: true, // 役割の全日窓。時刻未定予定に割られず●併記される背景
            });
          }
        } else {
          // それ以外の全日（会議・本社等）→ 7:00–16:00 の 1 本の帯。有給/公休も同様だが WeekTimeCal で非表示
          synth.push({
            id: `__fullday_${dateStr}`,
            start: "07:00",
            end: "16:00",
            cat: fullDay.cat,
            text: fdText,
            _real: false,
            _fullDay: true,
          });
        }
        // 全日でも早上がりは時間軸に 16:15 マーカーを出すため合成する
        for (const slot of ["AM", "PM"]) {
          (day[slot] || []).forEach((e, idx) => {
            if (!e || e.cat !== EARLY_LEAVE_CAT) return;
            const [start, end] = slotBlockTime(EARLY_LEAVE_CAT, slot);
            synth.push({
              id: `__hay${slot.toLowerCase()}${idx}_${dateStr}`,
              start,
              end,
              cat: EARLY_LEAVE_CAT,
              text: e.text || "早上がり",
              _real: false,
            });
          });
        }
        // 全日でない時刻未定のAM/PM予定（例：価格改定）も併記するため合成する。
        // 全日が役割(TEL①/②/フォロー)の日は AM/PM 窓が別ブロックなので、メモを
        // 両方の窓に併記する。全日「その他」帯(1本で終日)の日は自枠のみ（帯内に1回出れば足りる）。
        const noteSlots = ORDER_ROLE_CATS.includes(fullDay.cat) ? ["AM", "PM"] : null;
        for (const slot of ["AM", "PM"]) {
          (day[slot] || []).forEach((e, idx) => {
            if (!e || e.part) return;
            if (isEntryFullDay(e)) return;         // 全日エントリ自体は帯/役割窓で処理済み
            if (e.cat === EARLY_LEAVE_CAT) return; // 早上がりは上のループで処理済み
            for (const ts of (noteSlots || [slot])) {
              const [start, end] = slotBlockTime(winCatFor(e, ts), ts);
              synth.push({
                id: `__x${ts.toLowerCase()}${slot.toLowerCase()}${idx}_${dateStr}`,
                start,
                end,
                cat: e.cat,
                text: e.text || (CATEGORIES[e.cat]?.label ?? ""),
                _real: false,
              });
            }
          });
        }
      } else {
        for (const slot of ["AM", "PM"]) {
          (day[slot] || []).forEach((e, idx) => {
            if (!e || e.part) return; // パートの退社メモは時間軸に出さない
            const [start, end] = slotBlockTime(winCatFor(e, slot), slot);
            synth.push({
              id: `__${slot.toLowerCase()}${idx}_${dateStr}`,
              start,
              end,
              cat: e.cat,
              text: e.text || (CATEGORIES[e.cat]?.label ?? ""),
              _real: false,
            });
          });
        }
      }
      // 重なりを「具体度」で整形（会議など短い予定がその時間を占有し、広い予定を前後に分割）
      return clipBySpecificity([...synth, ...real]);
    },
    [events]
  );

  // 1日分の予定をコピー＆貼り付け（日パネルで他メンバーへ複製）。dayClip=コピー元の1日データ。
  const [dayClip, setDayClip] = useState(null); // { member, dateStr, data:{AM?,PM?,timed?} }
  const copyDay = (member, dateStr) => {
    const raw = events?.[member]?.[dateStr];
    if (!raw) return;
    setDayClip({ member, dateStr, data: structuredClone(raw) });
  };
  const pasteDay = (member, dateStr) => {
    if (!dayClip) return;
    setEvents((prev) => {
      const next = structuredClone(prev);
      const clone = structuredClone(dayClip.data);
      if (Array.isArray(clone.timed)) {
        clone.timed = clone.timed.map((t) => ({
          ...t,
          id: `t_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
        }));
      }
      next[member] = next[member] || {};
      next[member][dateStr] = clone; // 上書き
      return next;
    });
    clearDismissal(dateStr);
    setDayClip(null); // 1回貼り付けたらコピー状態を解除
  };

  // AM/PM スロットへエントリを追加。
  // 有給/公休 を入れたときは AM/PM 両方を一旦クリアし、そのエントリだけにする（全日扱い）。
  function addCellEntry(member, dateStr, slot, entry) {
    setEvents((prev) => {
      const next = structuredClone(prev);
      next[member] = next[member] || {};
      next[member][dateStr] = next[member][dateStr] || {};
      if (isEntryFullDay(entry)) {
        delete next[member][dateStr].AM;
        delete next[member][dateStr].PM;
        next[member][dateStr][slot] = [entry];
      } else {
        const list = next[member][dateStr][slot] || [];
        list.push(entry);
        next[member][dateStr][slot] = list;
      }
      return next;
    });
    clearDismissal(dateStr);
  }
  function removeCellEntry(member, dateStr, slot, idx) {
    setEvents((prev) => {
      const next = structuredClone(prev);
      const list = next?.[member]?.[dateStr]?.[slot] || [];
      const newList = list.filter((_, i) => i !== idx);
      if (newList.length === 0) {
        delete next[member][dateStr][slot];
      } else {
        next[member][dateStr][slot] = newList;
      }
      return next;
    });
    clearDismissal(dateStr);
  }
  // 時刻なし AM/PM エントリ(idx)の区分・メモを書き換える
  function updateCellEntry(member, dateStr, slot, idx, entry) {
    setEvents((prev) => {
      const next = structuredClone(prev);
      const list = next?.[member]?.[dateStr]?.[slot];
      if (!Array.isArray(list) || !list[idx]) return prev;
      list[idx] = { ...list[idx], ...entry };
      return next;
    });
    clearDismissal(dateStr);
  }
  // 旧 API（後方互換） — エントリ配列を丸ごと差し替え
  function setCell(member, dateStr, slot, data) {
    setEvents((prev) => {
      const next = structuredClone(prev);
      next[member] = next[member] || {};
      next[member][dateStr] = next[member][dateStr] || {};
      if (!data || (Array.isArray(data) && data.length === 0)) {
        delete next[member][dateStr][slot];
      } else {
        next[member][dateStr][slot] = Array.isArray(data) ? data : [data];
      }
      return next;
    });
  }

  function upsertTimed(member, dateStr, item) {
    setEvents((prev) => {
      const next = structuredClone(prev);
      next[member] = next[member] || {};
      next[member][dateStr] = next[member][dateStr] || {};
      const list = next[member][dateStr].timed || [];
      const idx = list.findIndex((x) => x.id === item.id);
      if (idx >= 0) list[idx] = item;
      else list.push(item);
      next[member][dateStr].timed = list;
      return next;
    });
    clearDismissal(dateStr);
  }
  function deleteTimed(member, dateStr, id) {
    setEvents((prev) => {
      const next = structuredClone(prev);
      const list = next?.[member]?.[dateStr]?.timed || [];
      next[member][dateStr].timed = list.filter((x) => x.id !== id);
      return next;
    });
    clearDismissal(dateStr);
  }

  // AI配置の反映: 生成された assignments を events へ一括書込（空欄のみ＝その日が空の人のみ生成済み）。
  function applyAutoSchedule(assignments) {
    setEvents((prev) => {
      const next = structuredClone(prev);
      for (const a of assignments) {
        const { member, dateStr, role, timing } = a;
        next[member] = next[member] || {};
        next[member][dateStr] = next[member][dateStr] || {};
        const day = next[member][dateStr];
        const addCell = (slot) => {
          const list = day[slot] || [];
          list.push({ cat: role, text: "" });
          day[slot] = list;
        };
        if (timing.mode === "pm" && timing.start) {
          const end =
            (SLOT_TIMES[role] && SLOT_TIMES[role].PM && SLOT_TIMES[role].PM[1]) ||
            "16:00";
          const list = day.timed || [];
          list.push({
            id: `auto_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
            start: timing.start,
            end,
            cat: role,
            text: "",
          });
          day.timed = list;
        } else if (timing.mode === "am") {
          addCell("AM");
        } else if (timing.mode === "pm") {
          addCell("PM");
        } else {
          addCell("AM");
          addCell("PM");
        }
      }
      return next;
    });
    [...new Set(assignments.map((a) => a.dateStr))].forEach(clearDismissal);
  }

  // 一括入力の反映: members × dates に同じ予定を「追加で並べる」。
  //  - 全日(有給/公休): その日の AM/PM をクリアして AM に全日1件
  //  - 時間指定(useTime): timed に1件追加（時間軸へ）
  //  - それ以外: 指定スロット(AM/PM)に1件追加
  // 戻り値: 追加した件数(members × dates)
  function applyBulkAdd({ members: tgtMembers, dates, cat, text, slot, useTime, start, end, allDay }) {
    const t = (text || "").trim();
    const fd = allDay || isFullDayCat(cat);
    setEvents((prev) => {
      const next = structuredClone(prev);
      let seq = 0;
      for (const m of tgtMembers) {
        for (const ds of dates) {
          next[m] = next[m] || {};
          next[m][ds] = next[m][ds] || {};
          const day = next[m][ds];
          if (fd) {
            delete day.AM;
            delete day.PM;
            day.AM = [{ cat, text: t, ...(isFullDayCat(cat) ? {} : { allDay: true }) }];
          } else if (useTime) {
            const list = day.timed || [];
            list.push({
              id: `t_bulk_${Date.now()}_${seq++}`,
              start,
              end,
              cat,
              text: t,
            });
            day.timed = list;
          } else {
            const list = day[slot] || [];
            list.push({ cat, text: t });
            day[slot] = list;
          }
        }
      }
      return next;
    });
    [...new Set(dates)].forEach(clearDismissal);
    return tgtMembers.length * dates.length;
  }

  /* ---------- シフト取込の反映 ---------- */
  // mode: "overwrite"(上書き) | "fillEmpty"(空欄のみ反映)
  function applyShiftImport(plan, mode, addNames) {
    if (Array.isArray(addNames) && addNames.length) {
      setMembers((prev) => [
        ...prev,
        ...addNames.filter((n) => !prev.includes(n)),
      ]);
    }
    setEvents((prev) => {
      const next = structuredClone(prev);
      let seq = 0;
      for (const e of plan) {
        const { member, dateStr } = e;
        next[member] = next[member] || {};
        next[member][dateStr] = next[member][dateStr] || {};
        const day = next[member][dateStr];
        const isEmpty =
          (day.AM?.length || 0) === 0 &&
          (day.PM?.length || 0) === 0 &&
          (day.timed?.length || 0) === 0;
        if (mode === "fillEmpty" && !isEmpty) continue;
        // その日の予定を取込内容で置き換える
        delete day.AM;
        delete day.PM;
        delete day.timed;
        const toTimed = (blocks) =>
          (blocks || []).map((b) => ({
            id: `t_imp_${Date.now()}_${seq++}`,
            start: b.start,
            end: b.end,
            cat: b.cat || "other",
            text: b.text || "",
            ...(b.part ? { part: true } : {}),
          }));
        if (e.kind === "part") {
          // パート: 時間軸は実勤務時間、午前/午後は退社が通常と違う日だけ
          day.timed = toTimed(e.timed);
          if (e.ampm && e.slot) {
            day[e.slot] = [{ cat: e.ampm.cat, text: e.ampm.text || "", part: true }];
          }
        } else if (e.kind === "timed") {
          day.timed = toTimed(e.timed);
        } else {
          day.AM = [{ cat: e.cat, text: e.text || "" }];
        }
      }
      return next;
    });
    const dates = [...new Set(plan.map((e) => e.dateStr))];
    setDismissedAlerts((prev) => {
      const n = { ...prev };
      dates.forEach((d) => delete n[d]);
      return n;
    });
  }

  /* ---------- 締めアラート判定 ---------- */
  const getAlertInfo = useCallback(
    (ds) => {
      if (!alertsEnabled) return null;
      if (dismissedAlerts[ds]) return null;
      const available = getClosingAvailable(events, members, ds);
      if (available.length >= CLOSING_REQUIRED) return null;
      return { available };
    },
    [events, members, alertsEnabled, dismissedAlerts]
  );

  /* ---------- メンバー管理 ---------- */
  function addMember() {
    const name = prompt("追加するメンバー名を入力してください");
    if (name && name.trim()) {
      setMembers((m) => (m.includes(name.trim()) ? m : [...m, name.trim()]));
    }
  }
  function removeMember(name) {
    if (!confirm(`「${name}」を削除しますか？（この人の予定も消えます）`)) return;
    setMembers((m) => m.filter((x) => x !== name));
    setOrderMembers((o) => o.filter((x) => x !== name));
    setEvents((prev) => {
      const next = structuredClone(prev);
      delete next[name];
      return next;
    });
    setPartConfig((prev) => {
      if (prev[name] === undefined) return prev;
      const next = { ...prev };
      delete next[name];
      return next;
    });
    // 相性表から、この人を含むペアを削除
    setPairsNG((prev) => {
      const next = {};
      for (const key of Object.keys(prev)) {
        if (!key.split("␟").includes(name)) next[key] = prev[key];
      }
      return next;
    });
  }
  function renameMember(oldName, newName) {
    const n = newName.trim();
    if (!n || n === oldName) return;
    if (members.includes(n)) { alert(`「${n}」は既に登録されています`); return; }
    setMembers((m) => m.map((x) => (x === oldName ? n : x)));
    setOrderMembers((o) => o.map((x) => (x === oldName ? n : x)));
    setEvents((prev) => {
      const next = structuredClone(prev);
      if (next[oldName] !== undefined) { next[n] = next[oldName]; delete next[oldName]; }
      return next;
    });
    // パート設定も新しい名前へ追従（リセットさせない）
    setPartConfig((prev) => {
      if (prev[oldName] === undefined) return prev;
      const next = { ...prev };
      next[n] = next[oldName];
      delete next[oldName];
      return next;
    });
    // 相性表のキー内の氏名も張り替え
    setPairsNG((prev) => {
      const next = {};
      for (const [key, v] of Object.entries(prev)) {
        const names = key.split("␟").map((x) => (x === oldName ? n : x));
        next[pairKey(names[0], names[1])] = v;
      }
      return next;
    });
  }
  function reorderMembers(newOrder) {
    setMembers(newOrder);
  }
  function toggleOrderMember(name) {
    setOrderMembers((o) =>
      o.includes(name) ? o.filter((x) => x !== name) : [...o, name]
    );
  }
  // ペア相性表：a と b の「組めない」をトグル（キーが有れば削除＝組める、無ければ追加＝組めない）
  function togglePairNG(a, b) {
    const key = pairKey(a, b);
    setPairsNG((prev) => {
      const next = { ...prev };
      if (next[key]) delete next[key];
      else next[key] = true;
      return next;
    });
  }

  // 生の cat 値が役割区分か（旧キー tel→tel1 も考慮）
  const isRoleCat = useCallback((raw) => {
    if (!raw || typeof raw !== "string") return false;
    const c = CAT_MIGRATE[raw] || raw;
    return ORDER_ROLE_CATS.includes(c);
  }, []);

  // 指定メンバーの「その日」に役割区分（TEL①/②・フォロー）の
  // 予定が入っているか
  const hasRoleOnDate = useCallback(
    (name, dateStr) => {
      const day = events?.[name]?.[dateStr];
      if (!day) return false;
      for (const slot of ["AM", "PM"]) {
        const list = day[slot];
        if (Array.isArray(list) && list.some((e) => e && isRoleCat(e.cat))) return true;
      }
      if (Array.isArray(day.timed)) {
        if (day.timed.some((it) => it && isRoleCat(it.cat))) return true;
      }
      return false;
    },
    [events, isRoleCat]
  );

  // 受注メンバー判定（手動指定 または その日に役割保有）— 日付単位
  const isOrder = useCallback(
    (name, dateStr) =>
      orderMembers.includes(name) ||
      (dateStr ? hasRoleOnDate(name, dateStr) : false),
    [orderMembers, hasRoleOnDate]
  );
  // 判定の内訳（設定モーダル用）— その日に役割があるかも返す
  const orderInfo = useCallback(
    (name, dateStr) => ({
      manual: orderMembers.includes(name),
      byRole: dateStr ? hasRoleOnDate(name, dateStr) : false,
    }),
    [orderMembers, hasRoleOnDate]
  );

  /* ---------- エディタ ---------- */
  function openEditor(payload) {
    setEditor(payload);
  }

  /* ---------- バックアップ / 復元 / 共有設定 ---------- */
  // 現在の全データ（保存されるのと同じ形）
  const currentSnapshot = () => ({
    members, orderMembers, events, slotMode, todos, officeEvents,
    dismissedAlerts, alertsEnabled, partConfig, autoRules,
    pairsNG, pairsEnabled, handovers,
  });
  function doBackup() {
    downloadBackup(currentSnapshot());
    setShowMenu(false);
  }
  async function doRestore(file) {
    if (!file) return;
    try {
      const data = await readBackupFile(file);
      if (!data || typeof data !== "object" || !Array.isArray(data.members)) {
        alert("このファイルはバックアップとして読み取れませんでした。");
        return;
      }
      const cnt = Object.keys(data.events || {}).length;
      if (!confirm(
        `バックアップを読み込みます。\n（メンバー${data.members.length}名 / 予定のある人 ${cnt}名分）\n\n` +
        `現在のデータはこの内容で置き換わります。よろしいですか？`
      )) return;
      applyLoadedState(data);
      // 復元した内容はサーバーにも反映したいので、スキップを解除して保存させる
      skipSaveRef.current = false;
      setSlotMode(data.slotMode === "timed" ? "timed" : "ampm");
      alert("バックアップを読み込みました。");
    } catch (e) {
      alert(`読み込みに失敗しました: ${e.message}`);
    }
  }
  // 共有設定の保存（接続テスト済みの値が渡ってくる）
  function applySyncConfig(url, token) {
    setSyncConfig(url, token);
    setSyncOn(isSyncOn());
    setSyncStatus(isSyncOn() ? "synced" : "local");
    sync.version = 0;
    sync.base = null;
    sync.ok = false;
  }

  return (
    <div className="app">
      <style>{CSS}</style>

      <header className="topbar">
        <div className="brand">
          <span className="brand-mark">総</span>
          <div>
            <h1>総務部 スケジュール管理</h1>
            <p className="sub">管理者が全メンバーの予定を一括管理</p>
          </div>
        </div>
        <div className="save-indicator">
          {pulledNote && <span className="dot pulled">↓ {pulledNote}</span>}
          {saving ? (
            <span className="dot saving">● {syncOn ? "同期中…" : "保存中…"}</span>
          ) : syncStatus === "synced" ? (
            <span className="dot saved" title={syncAt ? `最終同期 ${fmtSyncAt(syncAt)}` : ""}>
              ☁ 全員と共有中{syncAt ? `（${fmtSyncAt(syncAt)}）` : ""}
            </span>
          ) : syncStatus === "offline" ? (
            <span className="dot offline" title="サーバーに接続できません。変更はこの端末に保存されています">
              ⚠ オフライン（この端末に保存）
            </span>
          ) : (
            <span className="dot saved">● 自動保存済み（この端末のみ）</span>
          )}
        </div>
      </header>

      {/* 復元用（画面には出さない） */}
      <input
        ref={restoreRef}
        type="file"
        accept="application/json,.json"
        style={{ display: "none" }}
        onChange={(e) => {
          const f = e.target.files && e.target.files[0];
          e.target.value = "";
          doRestore(f);
        }}
      />

      <div className="controls">
        <div className="seg">
          <button
            className={slotMode === "timed" ? "active" : ""}
            onClick={() => setSlotMode("timed")}
          >
            時間軸
          </button>
          <button
            className={slotMode === "ampm" ? "active" : ""}
            onClick={() => setSlotMode("ampm")}
          >
            午前/午後
          </button>
        </div>

        {slotMode === "ampm" ? (
          <div className="nav">
            <button onClick={() => setAnchor((a) => addDays(a, -7))}>‹ 前週</button>
            <span className="period">{fmtRange(anchor)}</span>
            <button onClick={() => setAnchor((a) => addDays(a, 7))}>翌週 ›</button>
            <button
              className="today"
              onClick={() => setAnchor(startOfWeek(new Date()))}
            >
              今週
            </button>
          </div>
        ) : (
          <div className="nav">
            <button
              onClick={() =>
                goTimeline(addWorkdays(timelineStart, -TIMELINE_DAYS))
              }
            >
              ‹ 前へ
            </button>
            <input
              type="date"
              className="tl-date"
              value={ymd(timelineStart)}
              onChange={(e) =>
                e.target.value && goTimeline(parseYmd(e.target.value))
              }
              title="表示する開始日を選ぶ（その日から3稼働日・日曜は除く）"
            />
            <button
              onClick={() =>
                goTimeline(addDays(timelineDays[timelineDays.length - 1], 1))
              }
            >
              次へ ›
            </button>
            <button
              className="today"
              onClick={() => goTimeline(parseYmd(ymd(new Date())))}
            >
              今日
            </button>
          </div>
        )}

        <div className="menu-wrap">
          <button
            className={`menu-btn ${showMenu ? "open" : ""}`}
            onClick={() => setShowMenu((v) => !v)}
            aria-haspopup="true"
            aria-expanded={showMenu}
            title="便利機能メニュー"
          >
            ☰ メニュー <span className="menu-caret">▾</span>
          </button>
          {showMenu && (
            <div className="menu-pop" role="menu">
              <button
                className="menu-item"
                role="menuitem"
                onClick={() => { setShowHandover(true); setShowMenu(false); }}
                title="申し送り(引継ぎ)の共有と、日付からのTODO自動生成"
              >
                📋 引継ぎ
              </button>
              <button
                className="menu-item"
                role="menuitem"
                onClick={() => { setShowShiftImport(true); setShowMenu(false); }}
                title="シフト表のExcelを取り込みます"
              >
                📥 シフト取込
              </button>
              <button
                className="menu-item"
                role="menuitem"
                onClick={() => { setShowBulkAdd(true); setShowMenu(false); }}
                title="同じ予定を複数メンバー・複数日にまとめて登録します"
              >
                🧑‍🤝‍🧑 一括入力
              </button>
              <button
                className="menu-item"
                role="menuitem"
                onClick={() => { setShowPartConfig(true); setShowMenu(false); }}
                title="パート(時短)勤務の基本シフトを設定します"
              >
                🕘 パート設定
              </button>
              <button
                className="menu-item"
                role="menuitem"
                onClick={() => { setShowMemberMgr(true); setShowMenu(false); }}
                title="メンバーの追加・改名・並び替え・削除"
              >
                👥 メンバー管理
              </button>
              <button
                className="menu-item"
                role="menuitem"
                onClick={() => { setShowPairMatrix(true); setShowMenu(false); }}
                title="2人体制の相性表（TEL①②で組める/組めないペア）を設定します"
              >
                🤝 ペア設定
              </button>
              <button
                className="menu-item"
                role="menuitem"
                onClick={() => { setShowAutoSchedule(true); setShowMenu(false); }}
                title="受注メンバーの1週間分の配置(TEL①②・フォロー)を自動作成します"
              >
                🤖 自動配置作成
              </button>
              <div className="menu-sep" />
              <button
                className="menu-item"
                role="menuitem"
                onClick={() => { setShowSyncConfig(true); setShowMenu(false); }}
                title="メンバー全員でデータを共有する設定（サーバー同期）"
              >
                🔗 共有設定{syncOn ? "（ON）" : ""}
              </button>
              <button
                className="menu-item"
                role="menuitem"
                onClick={doBackup}
                title="現在の全データをJSONファイルに書き出します"
              >
                💾 バックアップ
              </button>
              <button
                className="menu-item"
                role="menuitem"
                onClick={() => { restoreRef.current && restoreRef.current.click(); setShowMenu(false); }}
                title="バックアップしたJSONファイルからデータを復元します"
              >
                📂 復元
              </button>
            </div>
          )}
        </div>
      </div>

      <div className="legend">
        {Object.entries(CATEGORIES).map(([k, c]) => (
          <span key={k} className="leg">
            <i style={{ background: c.chip }} />
            {c.label}
          </span>
        ))}
        <button
          className={`alert-toggle ${alertsEnabled ? "on" : "off"}`}
          onClick={() => setAlertsEnabled((v) => !v)}
          title="締め作業アラートの全体ON/OFF"
        >
          {alertsEnabled ? "🔔 アラートON" : "🔕 アラートOFF"}
        </button>
      </div>

      {!loaded ? (
        <div className="loading">読み込み中…</div>
      ) : slotMode === "ampm" ? (
        <WeekView
          members={members}
          weekDays={weekDays}
          slotMode="ampm"
          getAmpmDisplay={getAmpmDisplay}
          getTimed={getTimedMerged}
          onOpen={openEditor}
          onRemoveMember={removeMember}
          onRenameMember={renameMember}
          onReorderMembers={reorderMembers}
          isOrder={() => false}
          getTodos={getTodos}
          onAddTodo={addTodo}
          onToggleTodo={toggleTodo}
          onDeleteTodo={deleteTodo}
          getOfficeEvents={getOfficeEvents}
          onAddOfficeEvent={addOfficeEvent}
          onDeleteOfficeEvent={deleteOfficeEvent}
          getAlertInfo={getAlertInfo}
          onDismissAlert={dismissAlert}
          dayClip={dayClip}
          onPasteDay={pasteDay}
          onCancelCopy={() => setDayClip(null)}
        />
      ) : (
        <>
          <WeekTimeCal
            members={members}
            weekDays={timelineDays}
            getTimed={getTimedMerged}
            onOpen={openEditor}
            getAlertInfo={getAlertInfo}
            onDismissAlert={dismissAlert}
            selectedDate={showDayPanel ? selectedDate : null}
            onSelectDay={(ds) => {
              setSelectedDate(ds);
              setShowDayPanel(true);
            }}
            getTodos={getTodos}
            onAddTodo={addTodo}
            onToggleTodo={toggleTodo}
            onDeleteTodo={deleteTodo}
            getOfficeEvents={getOfficeEvents}
            onAddOfficeEvent={addOfficeEvent}
            onDeleteOfficeEvent={deleteOfficeEvent}
          />
          {showDayPanel && (
            <DayPanel
              members={members}
              dateStr={selectedDate}
              getTimed={getTimedMerged}
              onOpen={openEditor}
              isOrder={isOrder}
              onOpenOrderConfig={() => setShowOrderConfig(true)}
              onClose={() => { setShowDayPanel(false); setDayClip(null); }}
              dayClip={dayClip}
              onCopyDay={copyDay}
              onPasteDay={pasteDay}
              onCancelCopy={() => setDayClip(null)}
              getAlertInfo={getAlertInfo}
              onDismissAlert={dismissAlert}
              getTodos={getTodos}
              onAddTodo={addTodo}
              onToggleTodo={toggleTodo}
              onDeleteTodo={deleteTodo}
              getOfficeEvents={getOfficeEvents}
              onAddOfficeEvent={addOfficeEvent}
              onDeleteOfficeEvent={deleteOfficeEvent}
            />
          )}
        </>
      )}

      {editor && (
        <Editor
          key={`${editor.mode}_${editor.member}_${editor.dateStr}_${
            editor.slot || ""
          }_${editor.editId || ""}`}
          payload={editor}
          onClose={() => setEditor(null)}
          onReopen={openEditor}
          getCell={getCell}
          getTimed={getTimed}
          setCell={setCell}
          addCellEntry={addCellEntry}
          removeCellEntry={removeCellEntry}
          updateCellEntry={updateCellEntry}
          upsertTimed={upsertTimed}
          deleteTimed={deleteTimed}
          onCopyDay={copyDay}
        />
      )}

      {showShiftImport && (
        <ShiftImportModal
          onClose={() => setShowShiftImport(false)}
          onApply={applyShiftImport}
          members={members}
          events={events}
          anchor={anchor}
          partConfig={partConfig}
        />
      )}

      {showPartConfig && (
        <PartConfigModal
          onClose={() => setShowPartConfig(false)}
          members={members}
          partConfig={partConfig}
          onSave={setPartConfig}
        />
      )}

      {showBulkAdd && (
        <BulkAddModal
          members={members}
          weekDays={weekDays}
          defaultDate={selectedDate || ymd(new Date())}
          onClose={() => setShowBulkAdd(false)}
          onApply={applyBulkAdd}
        />
      )}

      {showOrderConfig && (
        <Modal onClose={() => setShowOrderConfig(false)}>
          <h3>受注メンバーの設定</h3>
          <p className="order-note">
            この設定は <b>表示中の日（{(() => {
              const dd = parseYmd(selectedDate);
              return `${dd.getMonth() + 1}/${dd.getDate()}`;
            })()}）</b> が対象です。
            その日に <b>{ORDER_ROLE_LABEL}</b> の予定がある人は
            <b>自動で受注メンバー</b>になります。
            それ以外の人はタップでこの日だけ指定できます。
          </p>
          <div className="order-list">
            {members.map((m) => {
              const info = orderInfo(m, selectedDate);
              const on = info.manual || info.byRole;
              return (
                <button
                  key={m}
                  className={`order-row ${on ? "on" : ""} ${
                    info.byRole ? "locked" : ""
                  }`}
                  onClick={() => {
                    if (info.byRole) return; // 役割で自動指定中は手動切替不可
                    toggleOrderMember(m);
                  }}
                  title={
                    info.byRole
                      ? "この日は役割により自動で受注メンバーです"
                      : "タップで受注メンバーを切替"
                  }
                >
                  <span className="order-check">{on ? "★" : "☆"}</span>
                  <span className="order-name">{m}</span>
                  <span className="order-state">
                    {info.byRole
                      ? "この日は自動（役割）"
                      : info.manual
                      ? "手動で指定中"
                      : "通常"}
                  </span>
                </button>
              );
            })}
          </div>
          <div className="m-actions">
            <div className="spacer" />
            <button
              className="primary"
              onClick={() => setShowOrderConfig(false)}
            >
              完了
            </button>
          </div>
        </Modal>
      )}

      {showMemberMgr && (
        <MemberManageModal
          members={members}
          orderMembers={orderMembers}
          onToggleOrder={toggleOrderMember}
          onClose={() => setShowMemberMgr(false)}
          onAdd={addMember}
          onRename={renameMember}
          onRemove={removeMember}
          onReorder={reorderMembers}
        />
      )}

      {showAutoSchedule && (
        <AutoScheduleModal
          weekDays={weekDays}
          autoRules={autoRules}
          orderMembers={orderMembers}
          events={events}
          pairsNG={pairsEnabled ? pairsNG : null}
          onApply={applyAutoSchedule}
          onEditRules={() => setShowAutoRule(true)}
          onClose={() => setShowAutoSchedule(false)}
        />
      )}

      {showPairMatrix && (
        <PairMatrixModal
          orderMembers={orderMembers}
          pairsNG={pairsNG}
          enabled={pairsEnabled}
          onToggleEnabled={() => setPairsEnabled((v) => !v)}
          onToggle={togglePairNG}
          onClose={() => setShowPairMatrix(false)}
        />
      )}

      {showAutoRule && (
        <AutoRuleModal
          autoRules={autoRules}
          onSave={setAutoRules}
          onClose={() => setShowAutoRule(false)}
        />
      )}

      {showHandover && (
        <HandoverModal
          handovers={handovers}
          onAdd={addHandover}
          onUpdate={updateHandover}
          onDelete={deleteHandover}
          onApplyTodos={addTodosFromHandover}
          onGotoDate={(ds) => {
            setSlotMode("ampm");
            setAnchor(startOfWeek(parseYmd(ds)));
            setShowHandover(false);
          }}
          onClose={() => setShowHandover(false)}
        />
      )}

      {showSyncConfig && (
        <SyncConfigModal
          onApply={applySyncConfig}
          onClose={() => setShowSyncConfig(false)}
        />
      )}

      <footer className="foot">
        {syncOn
          ? "データはサーバーで全員と共有されます。約15秒ごとに他の人の変更を自動で取り込みます。"
          : "データはこのブラウザ内に自動保存されます。別の端末・ブラウザには引き継がれません。（メニュー → 共有設定 で全員と共有できます）"}
      </footer>
    </div>
  );
}

/* ============================================================
   メンバー管理モーダル（追加・改名・並び替え・削除）
   ============================================================ */
function MemberManageModal({
  members,
  orderMembers = [],
  onToggleOrder,
  onClose,
  onAdd,
  onRename,
  onRemove,
  onReorder,
}) {
  const [editIdx, setEditIdx] = useState(null);
  const [editName, setEditName] = useState("");
  const move = (i, dir) => {
    const j = i + dir;
    if (j < 0 || j >= members.length) return;
    const o = [...members];
    [o[i], o[j]] = [o[j], o[i]];
    onReorder(o);
  };
  return (
    <Modal onClose={onClose}>
      <h3>メンバー管理</h3>
      <p className="order-note">
        氏名をクリックで改名、↑↓で並び替え、× で削除できます。
        <b>受注</b> にチェックした人が「自動配置作成」の対象（基本の受注メンバー）です。
      </p>
      <div className="mm-list">
        {members.map((m, i) => (
          <div key={m} className="mm-row">
            <div className="mm-ord">
              <button
                className="mm-arrow"
                disabled={i === 0}
                onClick={() => move(i, -1)}
                title="上へ"
              >
                ↑
              </button>
              <button
                className="mm-arrow"
                disabled={i === members.length - 1}
                onClick={() => move(i, 1)}
                title="下へ"
              >
                ↓
              </button>
            </div>
            {editIdx === i ? (
              <input
                className="name-edit"
                value={editName}
                autoFocus
                onChange={(e) => setEditName(e.target.value)}
                onBlur={() => {
                  if (editName.trim()) onRename(m, editName.trim());
                  setEditIdx(null);
                }}
                onKeyDown={(e) => {
                  if (e.key === "Enter") {
                    if (editName.trim()) onRename(m, editName.trim());
                    setEditIdx(null);
                  }
                  if (e.key === "Escape") setEditIdx(null);
                }}
              />
            ) : (
              <span
                className="mm-name"
                title="クリックで改名"
                onClick={() => {
                  setEditIdx(i);
                  setEditName(m);
                }}
              >
                {m}
              </span>
            )}
            <label className="mm-order" title="基本の受注メンバーに設定">
              <input
                type="checkbox"
                checked={orderMembers.includes(m)}
                onChange={() => onToggleOrder && onToggleOrder(m)}
              />
              受注
            </label>
            <button
              className="mm-del"
              onClick={() => {
                if (confirm(`「${m}」を削除しますか？`)) onRemove(m);
              }}
              title="削除"
            >
              ×
            </button>
          </div>
        ))}
      </div>
      <div className="m-actions">
        <button className="add-member" onClick={onAdd}>
          ＋ メンバー追加
        </button>
        <div className="spacer" />
        <button className="primary" onClick={onClose}>
          完了
        </button>
      </div>
    </Modal>
  );
}

/* ============================================================
   AIで配置作成（確認→反映）モーダル
   ============================================================ */
function AutoScheduleModal({
  weekDays,
  autoRules,
  orderMembers,
  events,
  pairsNG,
  onApply,
  onEditRules,
  onClose,
}) {
  const [result, setResult] = useState(() =>
    generateAutoSchedule(weekDays, autoRules, orderMembers, events, pairsNG)
  );
  const regen = useCallback(
    () => setResult(generateAutoSchedule(weekDays, autoRules, orderMembers, events, pairsNG)),
    [weekDays, autoRules, orderMembers, events, pairsNG]
  );
  // ルール編集後など autoRules が変われば再生成
  useEffect(() => {
    regen();
  }, [autoRules]); // eslint-disable-line

  const workDays = weekDays.filter((d) => d.getDay() !== 0);
  const byDate = {};
  for (const a of result.assignments) {
    (byDate[a.dateStr] = byDate[a.dateStr] || []).push(a);
  }
  const unfByDate = {};
  for (const u of result.unfilled) {
    (unfByDate[u.dateStr] = unfByDate[u.dateStr] || []).push(u);
  }
  const warnByDate = {};
  for (const w of result.pairWarnings || []) warnByDate[w.dateStr] = w;
  const noOrder = (orderMembers || []).length === 0;
  const roleLabel = (role, timing) =>
    `${CATEGORIES[role]?.label || role}（${timingLabel(timing)}）`;

  return (
    <Modal wide onClose={onClose}>
      <button className="modal-close" onClick={onClose} aria-label="閉じる" title="閉じる">
        ×
      </button>
      <h3>🤖 自動配置作成（{fmtRange(weekDays[0])} の週）</h3>
      <p className="order-note">
        受注メンバーのうち<b>その日に予定が無い人</b>を、配置ルールに沿って割り当てます。
        有給・公休・会議・既存予定のある人はその日は割り当てません。
      </p>

      {noOrder ? (
        <p className="auto-warn">
          受注メンバーが未設定です。「👥 メンバー管理」で <b>受注</b> にチェックしてください。
        </p>
      ) : (
        <>
          <div className="auto-actions-top">
            <button onClick={regen}>↻ 再生成</button>
            <button onClick={onEditRules}>⚙ 配置ルールを編集</button>
            <span className="auto-count">
              割当 {result.assignments.length} 件
              {result.unfilled.length > 0 && (
                <b className="auto-unf"> / 未割当 {result.unfilled.length} 件</b>
              )}
              {(result.pairWarnings || []).length > 0 && (
                <b className="auto-pairwarn"> / 要確認 {result.pairWarnings.length} 日</b>
              )}
            </span>
          </div>

          <div className="auto-grid">
            {workDays.map((d) => {
              const ds = ymd(d);
              const items = byDate[ds] || [];
              const unf = unfByDate[ds] || [];
              const warn = warnByDate[ds];
              return (
                <div key={ds} className={`auto-day ${warn ? "has-warn" : ""}`}>
                  <div className="auto-day-head">
                    {d.getMonth() + 1}/{d.getDate()}（{WEEKDAY_LABELS[d.getDay()]}）
                  </div>
                  {items.length === 0 && unf.length === 0 && (
                    <div className="auto-empty">配置なし</div>
                  )}
                  {warn && (
                    <div className="auto-pairbadge" title="TEL①とTEL②が「組めない」ペアです">
                      ⚠ 要確認: 組めないペア（{warn.a}×{warn.b}）
                    </div>
                  )}
                  {items.map((a, i) => (
                    <div key={`a${i}`} className="auto-asgn">
                      <span
                        className="auto-role"
                        style={{
                          background: CATEGORIES[a.role]?.chip,
                          color: CATEGORIES[a.role]?.fg,
                        }}
                      >
                        {roleLabel(a.role, a.timing)}
                      </span>
                      <span className="auto-member">{a.member}</span>
                    </div>
                  ))}
                  {unf.map((u, i) => (
                    <div key={`u${i}`} className="auto-asgn unfilled">
                      <span className="auto-role">{roleLabel(u.role, u.timing)}</span>
                      <span className="auto-member none">未割当</span>
                    </div>
                  ))}
                </div>
              );
            })}
          </div>
        </>
      )}

      <div className="m-actions">
        <button className="ghost" onClick={onClose}>
          閉じる
        </button>
        <button
          className="primary"
          disabled={result.assignments.length === 0}
          onClick={() => {
            onApply(result.assignments);
            onClose();
          }}
        >
          この内容で反映（空欄のみ）
        </button>
      </div>
    </Modal>
  );
}

/* ============================================================
   配置ルール設定（曜日別）モーダル
   ============================================================ */
function AutoRuleModal({ autoRules, onSave, onClose }) {
  const [draft, setDraft] = useState(() => structuredClone(autoRules || {}));
  const setSlots = (wd, slots) => setDraft((d) => ({ ...d, [wd]: slots }));
  const addSlot = (wd) =>
    setSlots(wd, [
      ...(draft[wd] || []),
      { role: "tel1", count: 1, timing: { mode: "allday" } },
    ]);
  const removeSlot = (wd, i) =>
    setSlots(wd, (draft[wd] || []).filter((_, j) => j !== i));
  const patchSlot = (wd, i, patch) =>
    setSlots(
      wd,
      (draft[wd] || []).map((s, j) => (j === i ? { ...s, ...patch } : s))
    );

  return (
    <Modal wide onClose={onClose}>
      <button className="modal-close" onClick={onClose} aria-label="閉じる" title="閉じる">
        ×
      </button>
      <h3>⚙ 配置ルール設定（曜日別）</h3>
      <p className="order-note">
        曜日ごとに必要な<b>役割・人数・時間帯</b>を設定します。「自動配置作成」がこのルールで割り当てます。
      </p>
      <div className="ar-grid">
        {AUTO_WEEKDAYS.map((wd) => (
          <div key={wd} className="ar-day">
            <div className="ar-day-head">{WEEKDAY_LABELS[wd]}曜</div>
            {(draft[wd] || []).map((s, i) => {
              const timingVal = s.timing?.start ? "pmtime" : s.timing?.mode || "allday";
              return (
                <div key={i} className="ar-slot">
                  <select
                    value={s.role}
                    onChange={(e) => patchSlot(wd, i, { role: e.target.value })}
                  >
                    {ORDER_ROLE_CATS.map((r) => (
                      <option key={r} value={r}>
                        {CATEGORIES[r].label}
                      </option>
                    ))}
                  </select>
                  <input
                    type="number"
                    min="1"
                    max="9"
                    value={s.count}
                    onChange={(e) =>
                      patchSlot(wd, i, {
                        count: Math.max(1, parseInt(e.target.value, 10) || 1),
                      })
                    }
                  />
                  <span className="ar-unit">名</span>
                  <select
                    value={timingVal}
                    onChange={(e) => {
                      const v = e.target.value;
                      patchSlot(wd, i, {
                        timing:
                          v === "pmtime"
                            ? { mode: "pm", start: "14:00" }
                            : { mode: v },
                      });
                    }}
                  >
                    <option value="allday">全日</option>
                    <option value="am">午前</option>
                    <option value="pm">午後</option>
                    <option value="pmtime">午後(時刻指定)</option>
                  </select>
                  {timingVal === "pmtime" && (
                    <input
                      type="time"
                      value={s.timing.start || "14:00"}
                      onChange={(e) =>
                        patchSlot(wd, i, {
                          timing: { mode: "pm", start: e.target.value },
                        })
                      }
                    />
                  )}
                  <button
                    className="mm-del"
                    onClick={() => removeSlot(wd, i)}
                    title="このスロットを削除"
                  >
                    ×
                  </button>
                </div>
              );
            })}
            <button className="ar-add" onClick={() => addSlot(wd)}>
              ＋ 追加
            </button>
          </div>
        ))}
      </div>
      <div className="m-actions">
        <button className="ghost" onClick={onClose}>
          キャンセル
        </button>
        <button
          className="primary"
          onClick={() => {
            onSave(draft);
            onClose();
          }}
        >
          保存
        </button>
      </div>
    </Modal>
  );
}

/* ============================================================
   日詳細サイドパネル（週・時間軸で選択した1日を右側に拡大表示・閲覧中心）
   - メンバー＝列、縦＝時間軸、重なりは clusterMemberEvents で1ブロック結合
   - ブロック内の各帯クリックで編集（onOpen）。受注メンバーは★強調。
   ============================================================ */
function DayPanel({
  members,
  dateStr,
  getTimed,
  onOpen,
  isOrder,
  onOpenOrderConfig,
  onClose,
  getAlertInfo,
  onDismissAlert,
  getTodos,
  onAddTodo,
  onToggleTodo,
  onDeleteTodo,
  getOfficeEvents,
  onAddOfficeEvent,
  onDeleteOfficeEvent,
  dayClip,
  onCopyDay,
  onPasteDay,
  onCancelCopy,
}) {
  const d = parseYmd(dateStr);
  const hours = Array.from(
    { length: HOUR_END - HOUR_START },
    (_, i) => HOUR_START + i
  );
  const ROW_H = 52;
  const alert = getAlertInfo && getAlertInfo(dateStr);
  // 公休/有給(全日)の人は列を出さず、ヘッダーの「休み」チップに移す。
  // ただし休み以外の予定も持つ人は列を残す(予定が見えなくなるのを防ぐ)。
  const infos = members.map((m) => {
    const all = getTimed(m, dateStr);
    const fullDay = all.find((it) => isFullDayCat(it.cat));
    const clusters = clusterMemberEvents(all.filter((it) => !isFullDayCat(it.cat)));
    return { m, fullDay, clusters };
  });
  const resting = infos.filter((x) => x.fullDay);
  const visibleInfos = infos.filter((x) => !x.fullDay || x.clusters.length > 0);
  return (
    <Modal wide onClose={onClose}>
      <div className={`day-detail ${alert ? "day-alert" : ""}`}>
      <div className="day-side-head">
        <div className="dsh-title">
          {d.getMonth() + 1}/{d.getDate()}（{WEEKDAYS_JP[d.getDay()]}）の予定
        </div>
        {resting.length > 0 && (
          <div className="dsh-rest">
            <span className="dsh-rest-label">休み</span>
            {resting.map(({ m, fullDay }) => (
              <button
                key={m}
                className="rest-chip"
                style={{
                  background: CATEGORIES[fullDay.cat]?.bg,
                  color: CATEGORIES[fullDay.cat]?.fg,
                }}
                onClick={() =>
                  onOpen({ mode: "ampm", member: m, dateStr, slot: "AM" })
                }
                title="クリックで編集"
              >
                {m}（{CATEGORIES[fullDay.cat]?.label}）
              </button>
            ))}
          </div>
        )}
        <button
          className="order-cfg sm"
          onClick={onOpenOrderConfig}
          title="この日の受注メンバーを設定"
        >
          ★ 受注メンバー
        </button>
        {alert && (
          <AlertBadge info={alert} onDismiss={() => onDismissAlert(dateStr)} />
        )}
        <button className="day-side-close" onClick={onClose} title="閉じる">
          ×
        </button>
      </div>

      {dayClip && (
        <div className="copy-bar">
          「{dayClip.member}」の予定をコピー中 → 貼り付け先の列で「貼付」
          <button className="mini" onClick={onCancelCopy}>キャンセル</button>
        </div>
      )}

      <div className="cal-scroll day-detail-scroll">
        <div
          className="cal"
          style={{
            gridTemplateColumns: `40px repeat(${Math.max(visibleInfos.length, 1)}, minmax(96px,1fr))`,
          }}
        >
          <div className="cal-corner" />
          {visibleInfos.map(({ m }) => (
            <div
              key={m}
              className={`cal-head ${isOrder(m, dateStr) ? "order-cal-head" : ""}`}
            >
              <span className="ch-name">
                {isOrder(m, dateStr) && <span className="order-star">★</span>}
                {m}
              </span>
              {dayClip ? (
                m === dayClip.member && dateStr === dayClip.dateStr ? (
                  <span className="ch-copying">コピー中</span>
                ) : (
                  <button
                    className="ch-paste"
                    onClick={() => onPasteDay(m, dateStr)}
                    title={`「${dayClip.member}」の予定をこの人に上書き貼り付け`}
                  >
                    貼付
                  </button>
                )
              ) : (
                getTimed(m, dateStr).length > 0 && (
                  <button
                    className="ch-copy"
                    onClick={() => onCopyDay(m, dateStr)}
                    title="この人の1日をコピー"
                  >
                    ⧉
                  </button>
                )
              )}
            </div>
          ))}

          <div className="cal-time-col">
            {hours.map((h) => (
              <div key={h} className="cal-hour" style={{ height: ROW_H }}>
                {String(h).padStart(2, "0")}:00
              </div>
            ))}
          </div>

          {visibleInfos.map(({ m, clusters }) => {
            return (
              <div
                key={m}
                className={`cal-col ${isOrder(m, dateStr) ? "order-cal-col" : ""}`}
              >
                {hours.map((h) => (
                  <div key={h} className="cal-slot-bg" style={{ height: ROW_H }} />
                ))}
                {clusters.map((cl, ci) => {
                  // 早上がりだけのクラスタは 16:15 マーカーのみ（空ブロックは描かない）
                  if (cl.entries.every((x) => x.cat === EARLY_LEAVE_CAT)) return null;
                  const [sh, sm] = cl.start.split(":").map(Number);
                  const [eh, em] = cl.end.split(":").map(Number);
                  const top = (sh + sm / 60 - HOUR_START) * ROW_H;
                  const height = Math.max(
                    24,
                    (eh + em / 60 - (sh + sm / 60)) * ROW_H - 2
                  );
                  const { lead, bg, fg, rest } = clusterView(cl.entries);
                  const openEntry = makeEntryOpener(onOpen, m, dateStr);
                  return (
                    <div
                      key={ci}
                      className="cal-event"
                      style={{
                        top,
                        height,
                        left: "2px",
                        right: "2px",
                        background: bg,
                        color: fg,
                      }}
                      onClick={() => openEntry(lead || cl.entries[0])}
                    >
                      <ClusterBlockBody
                        member={m}
                        lead={lead}
                        rest={rest}
                        timeText={`${cl.start}–${cl.end}`}
                        onEntry={openEntry}
                      />
                    </div>
                  );
                })}
                {hasEarlyLeave(getTimed(m, dateStr)) && (
                  <EarlyLeaveMarker
                    top={(16 + 15 / 60 - HOUR_START) * ROW_H}
                    className="cal-el"
                    member={m}
                    color={memberColor(members, m)}
                    onClick={() => {
                      const en = getTimed(m, dateStr).find((e) => e.cat === EARLY_LEAVE_CAT);
                      if (en) makeEntryOpener(onOpen, m, dateStr)(en);
                    }}
                  />
                )}
              </div>
            );
          })}
        </div>
      </div>

      <TodoPanel
        title={`${d.getMonth() + 1}/${d.getDate()} のTODO`}
        items={getTodos(dateStr)}
        onAdd={(t) => onAddTodo(dateStr, t)}
        onToggle={(id) => onToggleTodo(dateStr, id)}
        onDelete={(id) => onDeleteTodo(dateStr, id)}
      />
      <TodoPanel
        title={`${d.getMonth() + 1}/${d.getDate()} の社内行事`}
        items={getOfficeEvents(dateStr)}
        onAdd={(t) => onAddOfficeEvent(dateStr, t)}
        onDelete={(id) => onDeleteOfficeEvent(dateStr, id)}
        hideCheck
        placeholder="社内行事を入力して Enter または「追加」"
        emptyText="まだ社内行事はありません"
      />
      </div>
    </Modal>
  );
}

/* 締めアラートの小さなバッジ（日付ヘッダーに埋め込み）
   - ⚠ + 残り人数 + ✕（解除）
   - ホバーで詳細（残れるメンバー名）を表示
*/
function AlertBadge({ info, onDismiss }) {
  const detail =
    `16時以降の締め作業に2人以上残りません\n` +
    `残り ${info.available.length}名（必要 ${CLOSING_REQUIRED}名以上）` +
    (info.available.length > 0 ? `\n: ${info.available.join("、")}` : "");
  return (
    <div className="dh-alert" title={detail}>
      <span className="dh-alert-icon">⚠</span>
      <span className="dh-alert-text">締め{info.available.length}名</span>
      <button
        type="button"
        className="dh-alert-x"
        onClick={(e) => {
          e.stopPropagation();
          onDismiss();
        }}
        title="このアラートを解除"
      >
        ×
      </button>

}

/* 未完了TODOの件数バッジ（日付ヘッダーに埋め込み）
   - 未完了0件なら何も出さない。当日は塗りつぶして強調。
*/
function TodoBadge({ count, isToday }) {
  if (!count) return null;
  return (
    <div
      className={`dh-todo ${isToday ? "dh-todo-today" : ""}`}
      title={`未完了のTODOが ${count} 件あります`}
    >
      <span className="dh-todo-icon">📝</span>
      <span className="dh-todo-text">残{count}</span>

// 未完了TODOの件数（表示用の共通ヘルパー）
function remainingTodoCount(getTodos, ds) {
  return (getTodos ? getTodos(ds) : []).filter((t) => !t.done).length;
}

/* ============================================================
   シフト表 Excel 取込モーダル
   ============================================================ */
function ShiftImportModal({ onClose, onApply, members, events, anchor, partConfig }) {
  const [fileName, setFileName] = useState("");
  const [aoaSheets, setAoaSheets] = useState(null); // [{name, aoa}]
  const [sheetIdx, setSheetIdx] = useState(0);
  const [result, setResult] = useState(null); // parseShiftAoa の戻り値
  const [error, setError] = useState("");
  const [mode, setMode] = useState("fillEmpty"); // fillEmpty | overwrite
  const [includeUnmatched, setIncludeUnmatched] = useState(false); // 名簿外も追加
  const [busy, setBusy] = useState(false);

  // 指定シートを解釈
  const parseSheet = (sheets, idx) => {
    const sh = sheets[idx];
    const base = detectBaseYM(sh.name, sh.aoa) || {
      year: anchor.getFullYear(),
      month: anchor.getMonth() + 1,
    };
    const r = parseShiftAoa(sh.aoa, members, base.year, base.month, partConfig);
    if (r.error) { setError(r.error); setResult(null); }
    else { setError(""); setResult(r); }
  };

  const handleFile = (file) => {
    if (!file) return;
    setError(""); setResult(null); setAoaSheets(null);
    setFileName(file.name);
    if (typeof XLSX === "undefined") {
      setError("Excel読み込みライブラリ(XLSX)が読み込めませんでした。ネット接続をご確認ください。");
      return;
    }
    setBusy(true);
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const wb = XLSX.read(new Uint8Array(ev.target.result), {
          type: "array", cellDates: true,
        });
        const sheets = wb.SheetNames.map((name) => ({
          name,
          aoa: XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: "" }),
        }));
        // 今日を含む期間のシートを既定選択（シート名 YYYYMMDD-YYYYMMDD）
        const todayKey = ymd(new Date()).replace(/-/g, "");
        let def = sheets.findIndex((s) => {
          const m = s.name.match(/(\d{8}).*?(\d{8})/);
          return m && m[1] <= todayKey && todayKey <= m[2];
        });
        if (def < 0) def = 0;
        setAoaSheets(sheets);
        setSheetIdx(def);
        parseSheet(sheets, def);
      } catch (e) {
        setError("ファイルの解析に失敗しました: " + (e?.message || e));
      } finally {
        setBusy(false);
      }
    };
    reader.onerror = () => { setError("ファイルの読み込みに失敗しました"); setBusy(false); };
    reader.readAsArrayBuffer(file);
  };

  const onSheetChange = (idx) => {
    setSheetIdx(idx);
    if (aoaSheets) parseSheet(aoaSheets, idx);
  };

  // 取込内容に対する、その日の現在の状態ラベル
  const currentLabel = (member, dateStr) => {
    const day = events?.[member]?.[dateStr];
    if (!day) return "";
    const parts = [];
    for (const slot of ["AM", "PM"]) {
      for (const e of day[slot] || []) parts.push(e.text || CATEGORIES[e.cat]?.label || "");
    }
    for (const it of day.timed || []) {
      parts.push(`${it.start} ${it.text || CATEGORIES[it.cat]?.label || ""}`);
    }
    return parts.filter(Boolean).join(" / ");
  };

  // 表示・反映対象の判定
  const planWithStatus = (result?.plan || []).map((e) => {
    const cur = currentLabel(e.member, e.dateStr);
    let skipped = false, reason = "";
    if (!e.matched && !includeUnmatched) { skipped = true; reason = "名簿外"; }
    else if (mode === "fillEmpty" && cur !== "") { skipped = true; reason = "既存あり"; }
    return { ...e, cur, skipped, reason };
  });
  const applyCount = planWithStatus.filter((e) => !e.skipped).length;

  const doApply = () => {
    const plan = planWithStatus.filter((e) => !e.skipped);
    const addNames = includeUnmatched
      ? [...new Set(plan.filter((e) => !e.matched).map((e) => e.member))]
      : [];
    onApply(plan, mode, addNames);
    onClose();
  };

  return (
    <Modal onClose={onClose}>
      <button className="modal-close" onClick={onClose} aria-label="閉じる" title="閉じる">×</button>
      <h3>シフト表(Excel)の取込</h3>

      {!aoaSheets && !error && (
        <div className="si-intro">
          <p className="si-note">
            シフト表の <b>.xlsx</b> を選択してください。<br />
            ・氏名が縦・日付が横に並ぶ表を想定（日付は <code>16 17 18…</code> や <code>5/25</code> 等）<br />
            ・セルの <b>有給 / 公休 / TEL① / TEL② / フォロー / 本社 / 会議</b> などを自動判定<br />
            ・<b>アプリの名簿にある氏名の行のみ</b>反映します（名前は空白を無視して照合）
          </p>
        </div>
      )}

      {!aoaSheets && (
        <label className="si-file">
          <input type="file" accept=".xlsx,.xls" onChange={(e) => handleFile(e.target.files?.[0])} />
          <span className="si-file-btn">{busy ? "読み込み中…" : "Excelファイルを選択"}</span>
          {fileName && <span className="si-file-name">{fileName}</span>}
        </label>
      )}

      {error && (
        <div className="si-error">
          <b>⚠ 取り込めませんでした</b>
          <p>{error}</p>
        </div>
      )}

      {aoaSheets && (
        <div className="si-sheet">
          <label>取り込むシート：
            <select value={sheetIdx} onChange={(e) => onSheetChange(+e.target.value)}>
              {aoaSheets.map((s, i) => (
                <option key={i} value={i}>{s.name}</option>
              ))}
            </select>
          </label>
          <button className="ghost si-refile" onClick={() => { setAoaSheets(null); setResult(null); setError(""); setFileName(""); }}>
            別のファイル
          </button>
        </div>
      )}

      {result && (
        <div className="si-result">
          <div className="si-summary">
            <b>{fileName}</b>（{result.dateCount}日分）
            ／一致 <b>{result.matchedNames.length}名</b>
            {result.unmatchedNames.length > 0 && (
              <span className="si-unmatched">・名簿外 {result.unmatchedNames.length}名</span>
            )}
          </div>

          {result.unmatchedNames.length > 0 && (
            <div className="si-newmem">
              <label>
                <input type="checkbox" checked={includeUnmatched} onChange={(e) => setIncludeUnmatched(e.target.checked)} />
                名簿に無い氏名も新規メンバーとして追加して取り込む
              </label>
              <div className="si-newmem-names">{result.unmatchedNames.join("、")}</div>
            </div>
          )}

          <div className="si-mode">
            <label className={mode === "fillEmpty" ? "on" : ""}>
              <input type="radio" name="si-mode" checked={mode === "fillEmpty"} onChange={() => setMode("fillEmpty")} />
              空欄のみ反映（既存の予定は残す）
            </label>
            <label className={mode === "overwrite" ? "on" : ""}>
              <input type="radio" name="si-mode" checked={mode === "overwrite"} onChange={() => setMode("overwrite")} />
              上書き（その日のAM/PMを取込内容で置き換え）
            </label>
          </div>

          <div className="si-table-wrap">
            <table className="si-table">
              <thead>
                <tr><th>氏名</th><th>日付</th><th>現在</th><th>取込</th><th></th></tr>
              </thead>
              <tbody>
                {planWithStatus.map((e, i) => {
                  const d = parseYmd(e.dateStr);
                  return (
                    <tr key={i} className={e.skipped ? "si-skip" : ""}>
                      <td>
                        {e.member}
                        {!e.matched && <span className="si-new-tag">名簿外</span>}
                      </td>
                      <td>{d.getMonth() + 1}/{d.getDate()}（{WEEKDAYS_JP[d.getDay()]}）</td>
                      <td className="si-cur">{e.cur || "—"}</td>
                      <td>
                        {e.kind === "part" ? (
                          <span className="si-timed">
                            {e.ampm && <><span className="si-part-tag">{e.slot}</span> {e.ampm.text} ／</>}
                            <span className="si-text">🕘 {e.timed.map((b) => `${b.start}–${b.end}`).join(" / ")}</span>
                          </span>
                        ) : e.kind === "timed" ? (
                          <span className="si-timed">
                            🕘 {e.timed.map((b) => `${b.start}–${b.end}`).join(" / ")}
                          </span>
                        ) : (
                          <>
                            <span className="si-cat" style={{ background: CATEGORIES[e.cat]?.chip, color: CATEGORIES[e.cat]?.fg }}>
                              {CATEGORIES[e.cat]?.label}
                            </span>
                            {e.text && <span className="si-text"> {e.text}</span>}
                          </>
                        )}
                      </td>
                      <td>{e.skipped && <span className="si-skip-tag">{e.reason}</span>}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>

          <div className="m-actions">
            <div className="spacer" />

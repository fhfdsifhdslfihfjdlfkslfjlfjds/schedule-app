            <button className="primary" onClick={doApply} disabled={applyCount === 0}>
              {applyCount}件を反映
            </button>
          </div>
        </div>
      )}
    </Modal>
  );
}

/* ============================================================
   パート(時短)勤務 設定モーダル
   - メンバーごとに「パートにする」ON/OFF と 出社/退勤/休憩 時刻を編集
   - シフト取込時に、この基本シフトが固定で反映される（退勤時刻はExcelの数字で上書き）
   ============================================================ */
function PartConfigModal({ onClose, members, partConfig, onSave }) {
  const [draft, setDraft] = useState(() => structuredClone(partConfig || {}));

  const isPart = (m) => !!draft[m];
  const toggle = (m) => {
    setDraft((prev) => {
      const next = { ...prev };
      if (next[m]) delete next[m];
      else next[m] = { ...PART_DEFAULT };
      return next;
    });
  };
  const setField = (m, key, val) => {
    setDraft((prev) => ({ ...prev, [m]: { ...mergePartCfg(prev[m]), [key]: val } }));
  };
  const save = () => { onSave(draft); onClose(); };

  return (
    <Modal onClose={onClose}>
      <button className="modal-close" onClick={onClose} aria-label="閉じる" title="閉じる">×</button>
      <h3>パート(時短)勤務の設定</h3>
      <p className="order-note">
        パートの予定は重要度が低いので、シフト取込時は
        <b>通常の退勤時刻（下記）と違う日だけ</b>反映します（いつも通り・空欄の日は予定なし）。
        Excelのセルの <b>数字＝退勤時刻</b>（例: <b>16</b>）。
        <b>午前/午後</b>表示は退社時刻で AM/PM に振り分けて「○○退社」のみ（16時→PM）、
        <b>時間軸</b>表示は休憩を挟んだ実勤務時間で表示します。
        公休/有給はそのまま全日で反映。取込後も各予定は自由に編集できます。
      </p>
      <div className="part-list">
        {members.map((m) => {
          const cfg = mergePartCfg(draft[m]);
          const on = isPart(m);
          return (
            <div key={m} className={`part-row ${on ? "on" : ""}`}>
              <label className="part-name">
                <input type="checkbox" checked={on} onChange={() => toggle(m)} />
                <b>{m}</b>
                <span className="part-state">{on ? "パート" : "通常"}</span>
              </label>
              {on && (
                <div className="part-times">
                  <label>出社<input type="time" value={cfg.start} onChange={(e) => setField(m, "start", e.target.value)} /></label>
                  <label>退勤<input type="time" value={cfg.end} onChange={(e) => setField(m, "end", e.target.value)} /></label>
                  <label>休憩<input type="time" value={cfg.breakStart} onChange={(e) => setField(m, "breakStart", e.target.value)} /></label>
                  <span>〜</span>
                  <label><input type="time" value={cfg.breakEnd} onChange={(e) => setField(m, "breakEnd", e.target.value)} /></label>
                </div>
              )}
            </div>
          );
        })}
      </div>
      <div className="m-actions">
        <button className="ghost" onClick={onClose}>キャンセル</button>
        <div className="spacer" />
        <button className="primary" onClick={save}>保存</button>
      </div>
    </Modal>
  );
}

/* 重なるイベントを横方向に分割配置するためのカラム割り当て
   ルール:
   - 同じメンバーの予定は常に「同一列」を共有（重なって表示される）
   - 別メンバー同士の予定がいずれかで時間が重なる場合は別列に振り分け
   - 各イベントの _colCount は「そのイベントの時間帯に重なる他メンバーの中で最大列番号 + 1」
*/
// 時刻文字列(HH:MM)↔分 の変換
function hmToMin(t) { const [h, m] = t.split(":").map(Number); return h * 60 + m; }
function minToHm(min) {
  return `${String(Math.floor(min / 60)).padStart(2, "0")}:${String(min % 60).padStart(2, "0")}`;
}
// 開始時刻の変更時: 従来の所要時間(不正なら60分)を保って終了時刻をずらす(上限23:59)
function shiftEndByStart(newStart, oldStart, oldEnd) {
  if (!newStart) return oldEnd;
  const dur = Math.max(hmToMin(oldEnd) - hmToMin(oldStart), 0) || 60;
  return minToHm(Math.min(hmToMin(newStart) + dur, 23 * 60 + 59));
}
// 区分の「具体度」: フリー(0) < 役割TEL①/②・フォロー(1) < それ以外の具体予定(会議・その他等 2)。
// 同じ長さで重なったときのタイブレークに使う。
function catSpecificity(cat) {
  if (cat === "free") return 0;
  if (ORDER_ROLE_CATS.includes(cat)) return 1;
  return 2;
}
// 時間軸で重なる予定を「具体度」で整形する。
// より具体的（＝時間が短い。同長なら区分具体度が高い）なブロック A が重なると、
// 広い方 B をその時間帯で前後に分割し、A がその時間を占有して見えるようにする。
// 全日(有給/公休)と早上がりは分割にも割り込みにも関与しない。
function clipBySpecificity(blocks) {
  const dur = (b) => hmToMin(b.end) - hmToMin(b.start);
  // 背景ブロック＝全日帯(_fullDay)と役割の全日窓(_fullRole)。
  // 背景は「他を割り込む側」にはならないが「割り込まれる側」にはなる。
  // これで実時刻予定(TEL①等)が背景を前後に分割し、独立ブロックとして表示される。
  const isBg = (b) => b._fullDay || b._fullRole;
  const canCut = (b) => !isBg(b) && b.cat !== EARLY_LEAVE_CAT && dur(b) > 0;
  const canBeCut = (b) => b.cat !== EARLY_LEAVE_CAT && dur(b) > 0;
  // A が B より具体的か（A が B を分割する側）
  const moreSpecific = (a, b) => {
    const da = dur(a), db = dur(b);
    if (da !== db) return da < db;
    return catSpecificity(a.cat) > catSpecificity(b.cat);
  };
  const out = [];
  for (const b of blocks) {
    if (!canBeCut(b)) { out.push(b); continue; }
    // b を分割する（b より具体的で重なる）区間を収集
    // 背景(全日帯/役割窓)を分割できるのは実時刻(_real)の予定だけ。
    // 時刻未定の半日ブロック(価格改定等)は背景を割らず、同じマスに併記される。
    const cutters = blocks
      .filter((a) => a !== b && canCut(a) && moreSpecific(a, b) && (!isBg(b) || a._real))
      .map((a) => [hmToMin(a.start), hmToMin(a.end)]);
    if (cutters.length === 0) { out.push(b); continue; }
    let segs = [[hmToMin(b.start), hmToMin(b.end)]];
    for (const [rs, re] of cutters) {
      const next = [];
      for (const [s, e] of segs) {
        if (re <= s || rs >= e) { next.push([s, e]); continue; } // 重ならない
        if (s < rs) next.push([s, rs]);   // 割り込みの前
        if (re < e) next.push([re, e]);   // 割り込みの後
      }
      segs = next;
    }
    segs.forEach(([s, e], i) => {
      if (e - s < 5) return; // 5分未満は表示しない
      out.push({
        ...b,
        start: minToHm(s),
        end: minToHm(e),
        id: `${b.id}__c${i}`,
        _srcId: b._srcId || b.id, // 分割片から元エントリを開くための元ID
        _clipped: true,
      });
    });
  }
  return out;
}

// 1メンバーの予定を、時間が連結して重なるまとまり(クラスタ)へ結合する。
// 各クラスタ: { start(最小開始), end(最大終了), entries:[event...] }（開始時刻順）。
// 重なる予定は同じクラスタ＝1ブロックにまとめ、中で区分色の帯を縦に積んで表示する。
function clusterMemberEvents(evs) {
  const sorted = [...evs].sort(
    (a, b) => a.start.localeCompare(b.start) || a.end.localeCompare(b.end)
  );
  const clusters = [];
  for (const ev of sorted) {
    const last = clusters[clusters.length - 1];
    if (last && ev.start < last.end) {
      // 直前クラスタと時間が重なる → 結合
      last.entries.push(ev);
      if (ev.end > last.end) last.end = ev.end;
    } else {
      clusters.push({ start: ev.start, end: ev.end, entries: [ev] });
    }
  }
  return clusters;
}

// 全メンバー混在の時間軸(週)で、メンバーを横レーンに割り当てる。
// 戻り値は「クラスタ結合ブロック」の配列: { _member, _col, _colCount, start, end, entries }。
// 同一メンバー内の重なりは clusterMemberEvents で1ブロックに結合済み(副列分割はしない)。
// 予定のある各メンバーに「名簿順で1レーンずつ」固定割当（1日拡大表示と同じ並び）。
// memberOrder = メンバー名簿（並び順）。同一メンバーの重なりは clusterMemberEvents で結合。
function assignEventColumns(events, memberOrder) {
  // メンバー別にグループ化
  const byMember = new Map();
  for (const e of events) {
    if (!byMember.has(e._member)) byMember.set(e._member, []);
    byMember.get(e._member).push(e);
  }

  const order = memberOrder || [];
  const memberList = [...byMember.entries()]
    .map(([member, evs]) => ({ member, clusters: clusterMemberEvents(evs) }))
    .sort((a, b) => {
      const ia = order.indexOf(a.member);
      const ib = order.indexOf(b.member);
      return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib);
    });

  const totalCols = memberList.length || 1;
  const result = [];
  memberList.forEach((m, col) => {
    for (const cl of m.clusters) {
      result.push({
        _member: m.member,
        _col: col,
        _colCount: totalCols,
        start: cl.start,
        end: cl.end,
        entries: cl.entries,
        id: cl.entries[0].id,
      });
    }
  });
  return result;
}

// 結合ブロック内の1エントリ(帯)に出すラベル。
// その他/早上がりはメモ(text)優先、それ以外は区分名。
function entryRoleText(en) {
  if (en.cat === EARLY_LEAVE_CAT) return en.text || "早上がり";
  if (en.cat === "other") return en.text || "その他";
  return CATEGORIES[en.cat]?.label || "";
}

// クラスタ内の「背景にする主役」エントリ。ORDER_ROLE_CATS=["tel1","tel2","follow"] の
// 優先順で最初に見つかったものを返す（無ければ null）。
function clusterPrimary(entries) {
  for (const cat of ORDER_ROLE_CATS) {
    const found = entries.find((e) => e.cat === cat);
    if (found) return found;
  }
  return null;
}

// クラスタ(結合ブロック)の見せ方を計算: 主役(背景色)・残り(ドットリスト)・色。
//  - 主役 = 優先カテゴリ or 単一エントリならそれ自身
//  - 主役なし(複数で優先カテゴリ無し)→ 背景は中立色、全エントリをドットリストへ
function clusterView(entries) {
  const primary = clusterPrimary(entries);
  const lead = primary || (entries.length === 1 ? entries[0] : null);
  let bg, fg;
  if (lead) {
    bg = CATEGORIES[lead.cat]?.bg || CATEGORIES.other.bg;
    fg = CATEGORIES[lead.cat]?.fg || CATEGORIES.other.fg;
  } else if (new Set(entries.map((e) => e.cat)).size === 1) {
    // 主役なしでも全て同一区分（例：全て「その他」）ならその区分色を背景に
    const c = entries[0].cat;
    bg = CATEGORIES[c]?.bg || CATEGORIES.other.bg;
    fg = CATEGORIES[c]?.fg || CATEGORIES.other.fg;
  } else {
    // 区分が混在する重なり → 中立色（従来 #eef1f5 より濃く目立たせる）
    bg = "#cbd5e1";
    fg = "#334155";
  }
  const rest = lead ? entries.filter((x) => x !== lead) : entries;
  return { lead, bg, fg, rest };
}

// 結合ブロックの中身（週タイムライン・日パネルで共用）。
// 氏名＋共通時間帯を1回表示し、主役は背景色、その他はドット＋ラベルのリスト。
function ClusterBlockBody({ member, lead, rest, timeText, onEntry }) {
  // 早上がりは 16:15 マーカーに一本化するため、ブロック内の見出し/ドットからは除外
  const showLead = lead && lead.cat !== EARLY_LEAVE_CAT;
  const restDisp = (rest || []).filter((e) => e.cat !== EARLY_LEAVE_CAT);
  return (
    <div className="wce-body">
      <div className="wce-cl-head">
        <span className="wce-name">{member}</span>
        {timeText && <span className="wce-time2">{timeText}</span>}
      </div>
      {showLead && (
        <div
          className="wce-lead"
          title={`${lead.start}–${lead.end} ${
            lead.text || CATEGORIES[lead.cat]?.label || ""
          }`}
          onClick={(ev) => {
            ev.stopPropagation();
            onEntry(lead);
          }}
        >
          {entryRoleText(lead)}
        </div>
      )}
      {restDisp.length > 0 && (
        <div className="wce-dotlist">
          {restDisp.map((en, i) => (
            <div
              key={en.id || i}
              className="wce-dotrow"
              title={`${en.start}–${en.end} ${
                en.text || CATEGORIES[en.cat]?.label || ""
              }`}
              onClick={(ev) => {
                ev.stopPropagation();
                onEntry(en);
              }}
            >
              <i
                className="wce-dot2"
                style={{ background: CATEGORIES[en.cat]?.fg || CATEGORIES.other.fg }}
              />
              <span className="wce-dotlabel">{entryRoleText(en)}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// 早上がりの退社マーカー（時間軸の 16:15 位置に表示）。
// top は各タイムラインの ROW_H で算出して渡す。className でレイアウト差（cal/wcal）を切替。
function EarlyLeaveMarker({ top, className, style, onClick, member, color }) {
  const [hh, mm] = EARLY_LEAVE_TIME.split(":");
  return (
    <div
      className={`el-marker ${className || ""}`}
      style={{ top, ...(style || {}) }}
      title={`${member ? member + "・" : ""}早上がり（${EARLY_LEAVE_TIME}退社）`}
      onClick={onClick ? (ev) => { ev.stopPropagation(); onClick(); } : undefined}
    >
      <span className="el-line" />
      <span className="el-pill" style={color ? { borderColor: color } : undefined}>
        {color && <i className="el-dot" style={{ background: color }} />}
        🚶 {member ? member + " " : "早上がり "}{hh}:{mm}
      </span>
    </div>
  );
}

// クラスタの1エントリをクリックしたとき開く編集モーダルの種別を決める。
function makeEntryOpener(onOpen, member, dateStr) {
  return (en) => {
    if (en._real === false) {
      const h = parseInt((en.start || "00:00").slice(0, 2), 10);
      onOpen({ mode: "ampm", member, dateStr, slot: h < 12 ? "AM" : "PM" });
    } else {
      // 分割片(_clipped)は元エントリID(_srcId)で編集を開く
      onOpen({ mode: "timed", member, dateStr, editId: en._srcId || en.id });
    }
  };
}

/* ============================================================
   週表示・時間軸モード（全メンバーの予定を 1 つの時間軸で混在表示）
   ============================================================ */
function WeekTimeCal({
  members,
  weekDays,
  getTimed,
  onOpen,
  getAlertInfo,
  onDismissAlert,
  selectedDate,
  onSelectDay,
  getTodos,
  onAddTodo,
  onToggleTodo,
  onDeleteTodo,
  getOfficeEvents,
  onAddOfficeEvent,
  onDeleteOfficeEvent,
}) {
  const hours = Array.from(
    { length: HOUR_END - HOUR_START },
    (_, i) => HOUR_START + i
  );
  const ROW_H = 60;
  const todayStr = ymd(new Date());
  const scrollRef = React.useRef(null);
  const todayRef = React.useRef(null);

  // 初回表示時、本日列が見える位置へ自動スクロール
  React.useEffect(() => {
    const sc = scrollRef.current, th = todayRef.current;
    if (!sc || !th) return;
    const target = th.offsetLeft - (sc.clientWidth - th.offsetWidth) / 2;
    sc.scrollLeft = Math.max(0, target);
  }, [todayStr]);

  // 日別データを前計算: 各日の配置済みイベントとレーン数を求め、
  // 列幅をレーン数でスケールさせる（メンバーが多い日ほど列を広げ横スクロール）。
  const LANE_W = 58; // 1レーンの目安幅(px)。週は密なオーバービュー（詳細は日モーダル）
  const dayData = weekDays.map((d) => {
    const ds = ymd(d);
    const all = [];
    for (const m of members) {
      for (const it of getTimed(m, ds)) {
        if (isFullDayCat(it.cat)) continue; // 公休/有給(休み)は時間軸に出さない
        all.push({ ...it, _member: m });
      }
    }
    const positioned = assignEventColumns(all, members);
    const lanes = positioned.reduce((mx, e) => Math.max(mx, e._colCount), 1);
    return { d, ds, lanes, positioned };
  });
  const gridCols =
    `52px ` +
    dayData
      .map((dc) => `minmax(${Math.max(104, dc.lanes * LANE_W)}px, 1fr)`)
      .join(" ");

  return (
    <div className="wcal-scroll" ref={scrollRef}>
      <div
        className="wcal"
        style={{ gridTemplateColumns: gridCols }}
      >
        <div className="wcal-corner" />
        {dayData.map(({ d, ds }) => {
          const isToday = ds === todayStr;
          const sat = d.getDay() === 6;
          const isSelected = ds === selectedDate;
          const alert = getAlertInfo && getAlertInfo(ds);
          return (
            <div
              key={ds}
              ref={isToday ? todayRef : null}
              className={`wcal-head clickable ${isToday ? "today" : ""} ${sat ? "sat" : ""} ${isSelected ? "selected" : ""} ${alert ? "alert" : ""}`}
              onClick={() => onSelectDay && onSelectDay(ds)}
              title="クリックでこの日を右側に詳しく表示"
            >
              <div className="wch-date">
                {d.getMonth() + 1}/{d.getDate()}
              </div>
              <div className="wch-wd">（{WEEKDAYS_JP[d.getDay()]}）</div>
              {alert && (
                <AlertBadge
                  info={alert}
                  onDismiss={() => onDismissAlert(ds)}
                />
              )}
              <TodoBadge count={remainingTodoCount(getTodos, ds)} isToday={isToday} />
            </div>
          );
        })}

        <div className="wcal-time-col">
          {hours.map((h) => (
            <div key={h} className="wcal-hour" style={{ height: ROW_H }}>
              {String(h).padStart(2, "0")}:00
            </div>
          ))}
        </div>

        {dayData.map(({ ds, positioned }) => {
          const isToday = ds === todayStr;

          return (
            <div key={ds} className={`wcal-col ${isToday ? "today" : ""}`}>
              {hours.map((h) => (
                <div
                  key={h}
                  className="wcal-slot-bg"
                  style={{ height: ROW_H }}
                />
              ))}
              {positioned.map((e) => {
                const [sh, sm] = e.start.split(":").map(Number);
                const [eh, em] = e.end.split(":").map(Number);
                const top = (sh + sm / 60 - HOUR_START) * ROW_H;
                const height = Math.max(
                  28,
                  (eh + em / 60 - (sh + sm / 60)) * ROW_H - 2
                );
                const widthPercent = 100 / e._colCount;
                const leftPercent = (e._col * 100) / e._colCount;
                const mColor = memberColor(members, e._member);
                const { lead, bg, fg, rest } = clusterView(e.entries);
                const openEntry = makeEntryOpener(onOpen, e._member, ds);
                const hasEarly = hasEarlyLeave(e.entries);
                // 早上がりだけのクラスタは 16:15 マーカーのみ表示し、空ブロックは描かない
                const onlyEarly = e.entries.every((x) => x.cat === EARLY_LEAVE_CAT);
                return (
                  <React.Fragment key={`${e._member}_${e.id}`}>
                    {!onlyEarly && (
                    <div
                      className={`wcal-event ${isToday ? "wce-today" : ""}`}
                      style={{
                        top,
                        height,
                        left: `calc(${leftPercent}% + 2px)`,
                        width: `calc(${widthPercent}% - 4px)`,
                        background: bg,
                        color: fg,
                        // 左帯はメンバー識別色
                        borderLeft: `4px solid ${mColor}`,
                        zIndex: 3,
                      }}
                      title={`${e._member} ${e.start}–${e.end}`}
                      // ブロック全体(背景)クリックで主役(無ければ先頭)の予定を編集
                      onClick={() => openEntry(lead || e.entries[0])}
                    >
                      <ClusterBlockBody
                        member={e._member}
                        lead={lead}
                        rest={rest}
                        timeText={`${e.start}–${e.end}`}
                        onEntry={openEntry}
                      />
                    </div>
                    )}
                    {hasEarly && (
                      <EarlyLeaveMarker
                        top={(16 + 15 / 60 - HOUR_START) * ROW_H}
                        className="wcal-el"
                        member={e._member}
                        color={mColor}
                        style={{
                          left: `calc(${leftPercent}% + 2px)`,
                          width: `calc(${widthPercent}% - 4px)`,
                        }}
                        onClick={() => {
                          const en = e.entries.find((x) => x.cat === EARLY_LEAVE_CAT);
                          if (en) openEntry(en);
                        }}
                      />
                    )}
                  </React.Fragment>
                );
              })}
            </div>
          );
        })}
      </div>

      <WeekTimedTodoStrip
        weekDays={weekDays}
        gridCols={gridCols}
        getTodos={getTodos}
        onAddTodo={onAddTodo}
        onToggleTodo={onToggleTodo}
        onDeleteTodo={onDeleteTodo}
      />
      <WeekTimedTodoStrip
        weekDays={weekDays}
        gridCols={gridCols}
        getTodos={getOfficeEvents}
        onAddTodo={onAddOfficeEvent}
        onDeleteTodo={onDeleteOfficeEvent}
        label="社内行事"
        hideCheck
        placeholder="＋ 社内行事"
      />
    </div>
  );
}

function WeekTimedTodoStrip({
  weekDays,
  gridCols,
  getTodos,
  onAddTodo,
  onToggleTodo,
  onDeleteTodo,
  label = "To Do",
  hideCheck = false,
  placeholder,
}) {
  const todayStr = ymd(new Date());
  return (
    <div
      className={`wts ${hideCheck ? "wts-event" : ""}`}
      style={{ gridTemplateColumns: gridCols }}
    >
      <div className="wts-label">{label}</div>
      {weekDays.map((d) => {
        const ds = ymd(d);
        // 未完了が残っている日はセルを強調（社内行事ストリップ hideCheck では出さない）
        const remain = hideCheck ? 0 : remainingTodoCount(getTodos, ds);
        const hl = remain
          ? ds === todayStr ? " has-todo has-todo-today" : " has-todo"
          : "";
        return (
          <div key={ds} className={`wts-cell${hl}`}>
            <WeekTodoCell
              items={getTodos(ds)}
              onAdd={(t) => onAddTodo(ds, t)}
              onToggle={(id) => onToggleTodo(ds, id)}
              onDelete={(id) => onDeleteTodo(ds, id)}
              hideCheck={hideCheck}
              placeholder={placeholder}
            />
          </div>
        );
      })}
    </div>
  );
}

/* ============================================================
   2人体制ペア相性表モーダル（体制管理画面）
   - 受注メンバー同士の「組める/組めない」を手動設定
   - 自動配置(②)が同日の TEL①＋TEL② を組めるペアにする（ソフト）
   ============================================================ */
function PairMatrixModal({ orderMembers, pairsNG, enabled, onToggleEnabled, onToggle, onClose }) {
  const pool = orderMembers || [];
  return (
    <Modal wide onClose={onClose}>
      <button className="modal-close" onClick={onClose} aria-label="閉じる" title="閉じる">×</button>
      <h3>🤝 2人体制ペア設定（相性表）</h3>
      <p className="order-note">
        受注メンバー同士の<b>組める / 組めない</b>を設定します（既定は全て「組める」）。
        自動配置は同じ日の <b>TEL①＋TEL②</b> がなるべく「組める」ペアになるよう割り当て、
        どうしても組めない日は配置した上で<b>要確認</b>を表示します。
      </p>

      <div className={`pm-enable ${enabled ? "on" : "off"}`}>
        <button
          className={`pm-switch ${enabled ? "on" : ""}`}
          role="switch"
          aria-checked={enabled}
          onClick={onToggleEnabled}
          title="自動配置にペア相性を反映するかを切り替えます"
        >
          <span className="pm-knob" />
        </button>
        <span className="pm-enable-label">
          自動配置にペア相性を反映：<b>{enabled ? "ON" : "OFF"}</b>
          {!enabled && <span className="pm-enable-note">（現在OFF：相性表は保存されますが配置には反映されません）</span>}
        </span>
      </div>

      {pool.length < 2 ? (
        <p className="auto-warn">
          受注メンバーが2人以上必要です。「👥 メンバー管理」で <b>受注</b> にチェックしてください。
        </p>
      ) : (
        <>
          <div className="pm-legend">
            <span className="pm-leg ok">○ 組める</span>
            <span className="pm-leg ng">× 組めない</span>
            <span className="pm-hint">セルをクリックで切替</span>
          </div>
          <div className={`pm-table-wrap ${enabled ? "" : "pm-off"}`}>
            <table className="pm-table">
              <thead>
                <tr>
                  <th className="pm-corner"></th>
                  {pool.map((m) => (
                    <th key={m} className="pm-colh"><span>{m}</span></th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {pool.map((rowM, ri) => (
                  <tr key={rowM}>
                    <th className="pm-rowh">{rowM}</th>
                    {pool.map((colM, ci) => {
                      if (ci === ri) return <td key={colM} className="pm-diag" />;
                      if (ci < ri) return <td key={colM} className="pm-blank" />;
                      const ng = !isPairOK(pairsNG, rowM, colM);
                      return (
                        <td key={colM} className="pm-cell">
                          <button
                            className={`pm-btn ${ng ? "ng" : "ok"}`}
                            onClick={() => onToggle(rowM, colM)}
                            title={`${rowM} と ${colM}: ${ng ? "組めない" : "組める"}（クリックで切替）`}
                          >
                            {ng ? "×" : "○"}
                          </button>
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </>
      )}
      <div className="m-actions">
        <div className="spacer" />
        <button className="primary" onClick={onClose}>完了</button>
      </div>
    </Modal>
  );
}

/* ============================================================
   AM/PM セル（週表示・日表示の午前/午後モードで共用）
   - 有給/公休 が入っていれば AM/PM を 1 マスに合体表示
   - そうでなければ AM/PM の 2 マスに自分の入力エントリ＋時間軸由来エントリを併記
   ============================================================ */
function AmpmCell({ disp, onOpenSlot, variant = "week", onlySlot }) {
  const { am, pm, amDerived, pmDerived, fullDay, fullDaySlot } = disp;
  if (fullDay) {
    const cat = fullDay.cat;
    const label = fullDay.text || CATEGORIES[cat]?.label;
    // 全日ラベル以外の自分の AM/PM エントリ（早上がり等）も併記する（早上がりは最後に回す）
    const ownExtrasAll = [...am, ...pm].filter((e) => e && !isEntryFullDay(e));
    const ownExtrasEarly = ownExtrasAll.filter((e) => e.cat === EARLY_LEAVE_CAT);
    const ownExtras = ownExtrasAll.filter((e) => e.cat !== EARLY_LEAVE_CAT);
    // 全日でも時間帯あり予定（day.timed 由来）は併記する
    const derived = [...amDerived, ...pmDerived].sort((a, b) =>
      a.start.localeCompare(b.start)
    );
    const renderExtra = (e, idx, kp) => (
      <button
        type="button"
        key={`${kp}${idx}`}
        className={`slot-entry ${e.cat === EARLY_LEAVE_CAT ? "slot-entry-hay" : ""}`}
        style={{
          background: CATEGORIES[e.cat]?.chip || CATEGORIES.other.chip,
          color: CATEGORIES[e.cat]?.fg || CATEGORIES.other.fg,
          ...(e.cat === EARLY_LEAVE_CAT ? {} : { border: "none" }),
        }}
        onClick={() => onOpenSlot(fullDaySlot)}
        title="クリックで編集"
      >
        {e.cat === EARLY_LEAVE_CAT && <span className="hay-arrow">↓</span>}
        {e.cat === EARLY_LEAVE_CAT
          ? (e.text || "早上がり")
          : (e.text || CATEGORIES[e.cat]?.label)}
      </button>
    );
    // 全日区分は AM/PM を1つに結合し、セル全体（縦いっぱい）を埋める
    return (
      <div
        className={`ampm-merged ${variant === "day" ? "ampm-merged-day" : ""}`}
        style={{
          background: CATEGORIES[cat]?.bg || CATEGORIES.other.bg,
          color: CATEGORIES[cat]?.fg || CATEGORIES.other.fg,
        }}
      >
        <button
          type="button"
          className="fd-main"
          onClick={() => onOpenSlot(fullDaySlot)}
          title="クリックで編集（全日）"
        >
          <em>全日</em>
          <span className="fd-label">{label}</span>
        </button>
        {(ownExtrasAll.length > 0 || derived.length > 0) && (
          <div className="fd-derived">
            {ownExtras.map((e, idx) => renderExtra(e, idx, "oe"))}
            {derived.map((d, idx) => (
              <button
                type="button"
                key={`fd${idx}`}
                className="slot-entry slot-entry-derived"
                style={{
                  borderLeftColor: CATEGORIES[d.cat]?.fg || CATEGORIES.other.fg,
                  background: CATEGORIES[d.cat]?.chip || CATEGORIES.other.chip,
                }}
                onClick={() => onOpenSlot(fullDaySlot)}
                title="時間軸の予定（クリックで編集）"
              >
                <span className="se-time">{d.start}–{d.end}</span>
                <span className="se-text">{d.text || CATEGORIES[d.cat]?.label}</span>
              </button>
            ))}
            {ownExtrasEarly.map((e, idx) => renderExtra(e, idx, "oee"))}
          </div>
        )}
      </div>
    );
  }
  const renderSlot = (slot) => {
    const ownAll = slot === "AM" ? am : pm;
    const derived = slot === "AM" ? amDerived : pmDerived;
    // 早上がりは常にそのスロットの一番最後の行に表示する
    const ownEarly = ownAll.filter((e) => e.cat === EARLY_LEAVE_CAT);
    const ownNormal = ownAll.filter((e) => e.cat !== EARLY_LEAVE_CAT);
    const isEmpty = ownAll.length === 0 && derived.length === 0;
    // 背景色：早上がり以外の自分のエントリ→派生→早上がり の順で先頭色を決定
    const headCat = ownNormal[0]?.cat || derived[0]?.cat || ownEarly[0]?.cat;
    const bg = !isEmpty && headCat ? CATEGORIES[headCat]?.bg : undefined;
    const fg = !isEmpty && headCat ? CATEGORIES[headCat]?.fg : undefined;
    const renderOwn = (e, idx, kp) => (
      <div
        key={`${kp}${idx}`}
        className={`slot-entry ${e.cat === EARLY_LEAVE_CAT ? "slot-entry-hay" : ""}`}
        style={{
          background: CATEGORIES[e.cat]?.chip || CATEGORIES.other.chip,
          color: CATEGORIES[e.cat]?.fg || CATEGORIES.other.fg,
        }}
      >
        {e.cat === EARLY_LEAVE_CAT && <span className="hay-arrow">↓</span>}
        {e.cat === EARLY_LEAVE_CAT
          ? (e.text || "早上がり")
          : (e.text || CATEGORIES[e.cat]?.label)}
      </div>
    );
    return (
      <button
        key={slot}
        className={`slot ${variant === "day" ? "day-slot" : ""}`}
        style={!isEmpty ? { background: bg, color: fg } : {}}
        onClick={() => onOpenSlot(slot)}
      >
        <em className="slot-tag">{slot}</em>
        <div className="slot-entries">
          {isEmpty && <span className="slot-empty">＋ 追加</span>}
          {ownNormal.map((e, idx) => renderOwn(e, idx, "o"))}
          {derived.map((d, idx) => {
            const dfg = CATEGORIES[d.cat]?.fg || CATEGORIES.other.fg;
            const label = d.text || CATEGORIES[d.cat]?.label;
            return (
              <div
                key={`d${idx}`}
                className="slot-entry slot-entry-derived"
                style={{
                  borderLeftColor: dfg,
                  background: CATEGORIES[d.cat]?.chip || CATEGORIES.other.chip,
                }}
                title="時間軸の予定（読み取り専用）"
              >
                <span className="se-time">{d.start}–{d.end}</span>
                <span className="se-text">{label}</span>
              </div>
            );
          })}
          {ownEarly.map((e, idx) => renderOwn(e, idx, "oe"))}
        </div>
      </button>
    );
  };
  if (onlySlot) {
    return <div className="ampm">{renderSlot(onlySlot)}</div>;
  }
  return (
    <div className={`ampm ${variant === "day" ? "ampm-day" : ""}`}>
      {renderSlot("AM")}
      {renderSlot("PM")}
    </div>
  );
}

/* コピー中にマスへ重ねる「貼付 / コピー中」の半透明オーバーレイ。
   予定の中身は隠さずそのまま見えるようにし、枠だけを上に重ねる。
   half: null=セル全体(全日マス) / "am"=上半分(ラベル付き) / "pm"=下半分(ラベル無し・AMと繋がって1枠に見える) */
function renderClipOverlay(dayClip, member, ds, clipMD, onPasteDay, half) {
  if (!dayClip) return null;
  const halfCls = half ? ` cell-ov-${half}` : "";
  const isSrc = member === dayClip.member && ds === dayClip.dateStr;
  if (isSrc) {
    return (
      <div className={`cell-copying${halfCls}`}>
        {half === "pm" ? "" : "コピー中"}
      </div>
    );
  }
  return (
    <button
      type="button"
      className={`cell-paste${halfCls}`}
      onClick={() => onPasteDay(member, ds)}
      title={`「${dayClip.member} ${clipMD}」をここに上書き貼り付け`}
    >
      {half === "pm" ? "" : "貼付"}
    </button>
  );
}

/* ============================================================
   週表示
   ============================================================ */
function WeekView({
  members,
  weekDays,
  slotMode,
  getAmpmDisplay,
  getTimed,
  onOpen,
  onRemoveMember,
  onRenameMember,
  onReorderMembers,
  isOrder,
  getTodos,
  onAddTodo,
  onToggleTodo,
  onDeleteTodo,
  getOfficeEvents,
  onAddOfficeEvent,
  onDeleteOfficeEvent,
  getAlertInfo,
  onDismissAlert,
  dayClip,
  onPasteDay,
  onCancelCopy,
}) {
  const todayStr = ymd(new Date());
  const [editingMember, setEditingMember] = useState(null);
  const [editName, setEditName] = useState("");
  const [dragIdx, setDragIdx] = useState(null);
  const [overIdx, setOverIdx] = useState(null);

  // 時間軸モードは「全メンバー × 時間軸」のレイアウトに切り替え
  if (slotMode === "timed") {
    return (
      <>
        <WeekTimeCal
          members={members}
          weekDays={weekDays}
          getTimed={getTimed}
          onOpen={onOpen}
          getAlertInfo={getAlertInfo}
          onDismissAlert={onDismissAlert}
        />
        <WeekTimedTodoStrip
          weekDays={weekDays}
          getTodos={getTodos}
          onAddTodo={onAddTodo}
          onToggleTodo={onToggleTodo}
          onDeleteTodo={onDeleteTodo}
        />
      </>
    );
  }

  const clipMD = dayClip
    ? (() => { const cd = parseYmd(dayClip.dateStr); return `${cd.getMonth() + 1}/${cd.getDate()}`; })()
    : "";

  return (
    <div className="grid-wrap">
      {dayClip && (
        <div className="copy-bar">
          「{dayClip.member} {clipMD}」の予定をコピー中 → 貼り付け先のマスをクリック
          <button className="mini" onClick={onCancelCopy}>キャンセル</button>
        </div>
      )}
      <table className="grid">
        <thead>
          <tr>
            <th className="corner">メンバー</th>
            {weekDays.map((d) => {
              const ds = ymd(d);
              const isToday = ds === todayStr;
              const sat = d.getDay() === 6;
              const alert = getAlertInfo && getAlertInfo(ds);
              return (
                <th
                  key={ds}
                  className={`dayhead ${isToday ? "today" : ""} ${
                    sat ? "sat" : ""
                  } ${alert ? "alert" : ""}`}
                >
                  <div className="dh-date">
                    {d.getMonth() + 1}/{d.getDate()}
                  </div>
                  <div className="dh-wd">（{WEEKDAYS_JP[d.getDay()]}）</div>
                  {alert && (
                    <AlertBadge
                      info={alert}
                      onDismiss={() => onDismissAlert(ds)}
                    />
                  )}
                  <TodoBadge count={remainingTodoCount(getTodos, ds)} isToday={isToday} />
                </th>
              );
            })}
          </tr>
        </thead>
        <tbody>
          {members.map((m, i) => {
            const rowClass = [
              isOrder(m) ? "order-tr" : "",
              dragIdx === i ? "row-dragging" : "",
              overIdx === i && dragIdx !== i ? "drag-over" : "",
              i % 2 === 1 ? "row-even" : "",
            ].filter(Boolean).join(" ");
            const dragHandlers = {
              draggable: true,
              onDragStart: (e) => {
                if (editingMember !== null) { e.preventDefault(); return; }
                e.dataTransfer.effectAllowed = "move";
                setDragIdx(i);
              },
              onDragOver: (e) => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; if (overIdx !== i) setOverIdx(i); },
              onDrop: () => {
                if (dragIdx === null || dragIdx === i) return;
                const o = [...members];
                const [mv] = o.splice(dragIdx, 1);
                o.splice(i, 0, mv);
                onReorderMembers(o);
                setDragIdx(null); setOverIdx(null);
              },
              onDragEnd: () => { setDragIdx(null); setOverIdx(null); },
            };
            // AM行・PM行の2つの<tr>に分割し、同じ<tr>内でセル高さが自動で揃う
            // ブラウザ標準の性質を使って、日をまたいだAM/PM境界のガタつきを解消する。
            return (
              <React.Fragment key={m}>
                <tr className={rowClass} {...dragHandlers}>
                  <th rowSpan={2} className={`rowhead ${isOrder(m) ? "order-head" : ""}`}>
                    <span className="drag-handle" title="ドラッグで順序変更">⠿</span>
                    {isOrder(m) && <span className="order-star">★</span>}
                    {editingMember === m ? (
                      <input
                        className="name-edit"
                        value={editName}
                        autoFocus
                        onChange={(e) => setEditName(e.target.value)}
                        onBlur={() => { onRenameMember(m, editName); setEditingMember(null); }}
                        onKeyDown={(e) => {
                          if (e.key === "Enter") { onRenameMember(m, editName); setEditingMember(null); }
                          if (e.key === "Escape") setEditingMember(null);
                        }}
                        onClick={(e) => e.stopPropagation()}
                      />
                    ) : (
                      <span
                        className="member-name-label"
                        title="クリックで名前を編集"
                        onClick={() => { setEditingMember(m); setEditName(m); }}
                      >
                        {m}
                      </span>
                    )}
                    <button
                      className="rm"
                      title="削除"
                      onClick={() => onRemoveMember(m)}
                    >
                      ×
                    </button>
                  </th>
                  {weekDays.map((d) => {
                    const ds = ymd(d);
                    const disp = getAmpmDisplay(m, ds);
                    // コピー中の重ね表示（予定の中身は隠さず、半透明の枠を上に重ねる）
                    const overlay = (half) =>
                      renderClipOverlay(dayClip, m, ds, clipMD, onPasteDay, half);
                    if (disp.fullDay) {
                      return (
                        <td key={ds} className="cell" rowSpan={2}>
                          {overlay(null)}
                          <AmpmCell
                            disp={disp}
                            onOpenSlot={(slot) =>
                              onOpen({ mode: "ampm", member: m, dateStr: ds, slot })
                            }
                          />
                        </td>
                      );
                    }
                    return (
                      <td key={ds} className="cell cell-am">
                        {overlay("am")}
                        <AmpmCell
                          disp={disp}
                          onlySlot="AM"
                          onOpenSlot={(slot) =>
                            onOpen({ mode: "ampm", member: m, dateStr: ds, slot })
                          }
                        />
                      </td>
                    );
                  })}
                </tr>
                <tr className={rowClass} {...dragHandlers}>
                  {weekDays.map((d) => {
                    const ds = ymd(d);
                    const disp = getAmpmDisplay(m, ds);
                    if (disp.fullDay) return null; // AM行のrowSpanでカバー済み
                    return (
                      <td key={ds} className="cell cell-pm">
                        {renderClipOverlay(dayClip, m, ds, clipMD, onPasteDay, "pm")}
                        <AmpmCell
                          disp={disp}
                          onlySlot="PM"
                          onOpenSlot={(slot) =>
                            onOpen({ mode: "ampm", member: m, dateStr: ds, slot })
                          }
                        />
                      </td>
                    );
                  })}
                </tr>
              </React.Fragment>
            );
          })}
          <tr className="todo-row">
            <th className="rowhead todo-rowhead">To Do</th>
            {weekDays.map((d) => {
              const ds = ymd(d);
              // 未完了が残っている日はセルを強調（当日はより濃く）
              const remain = remainingTodoCount(getTodos, ds);
              const hl = remain
                ? ds === todayStr ? " has-todo has-todo-today" : " has-todo"
                : "";
              return (
                <td key={ds} className={`cell todo-cell${hl}`}>
                  <WeekTodoCell
                    items={getTodos(ds)}
                    onAdd={(t) => onAddTodo(ds, t)}
                    onToggle={(id) => onToggleTodo(ds, id)}
                    onDelete={(id) => onDeleteTodo(ds, id)}
                  />
                </td>
              );
            })}
          </tr>
          <tr className="todo-row event-row">
            <th className="rowhead todo-rowhead event-rowhead">社内行事</th>
            {weekDays.map((d) => {
              const ds = ymd(d);
              return (
                <td key={ds} className="cell todo-cell event-cell">
                  <WeekTodoCell
                    items={getOfficeEvents(ds)}
                    onAdd={(t) => onAddOfficeEvent(ds, t)}
                    onDelete={(id) => onDeleteOfficeEvent(ds, id)}
                    hideCheck
                    placeholder="＋ 社内行事"
                  />
                </td>
              );
            })}
          </tr>
        </tbody>
      </table>
    </div>
  );
}

function WeekTodoCell({ items, onAdd, onToggle, onDelete, hideCheck, placeholder }) {
  const [text, setText] = useState("");
  const submit = () => {
    if (text.trim()) {
      onAdd(text);
      setText("");
    }
  };
  return (
    <div className="wtc">
      {items.length > 0 && (
        <ul className={`wtc-list ${hideCheck ? "wtc-list-nocheck" : ""}`}>
          {items.map((it) => (
            <li key={it.id} className={!hideCheck && it.done ? "done" : ""}>
              {!hideCheck && (
                <input
                  type="checkbox"
                  checked={it.done}
                  onChange={() => onToggle(it.id)}
                />
              )}
              <span className="wtc-text">{it.text}</span>
              <button
                className="wtc-del"
                title="削除"
                onClick={() => onDelete(it.id)}
              >
                ×
              </button>
            </li>
          ))}
        </ul>
      )}
      <div className="wtc-input">
        <input
          value={text}
          placeholder={placeholder || "＋ TODO追加"}
          onChange={(e) => setText(e.target.value)}
          onKeyDown={(e) => {
            if (e.key === "Enter") submit();
          }}
        />
      </div>
    </div>
  );
}

/* ============================================================
   日表示（時間軸 = Googleカレンダー風）
   ============================================================ */
function DayView({
  members,
  dateStr,
  slotMode,
  getAmpmDisplay,
  getTimed,
  onOpen,
  isOrder,
  onRenameMember,
  onReorderMembers,
  getAlertInfo,
  onDismissAlert,
}) {
  const d = parseYmd(dateStr);
  const hours = Array.from(
    { length: HOUR_END - HOUR_START },
    (_, i) => HOUR_START + i
  );
  const ROW_H = 56;
  const [editingMember, setEditingMember] = useState(null);
  const [editName, setEditName] = useState("");
  const [dragIdx, setDragIdx] = useState(null);
  const [overIdx, setOverIdx] = useState(null);
  const alert = getAlertInfo && getAlertInfo(dateStr);

  // 時間軸モード: 公休/有給(全日)の人は列を出さず「休み」チップに移す。
  // 休み以外の予定も持つ人は列を残す(予定が見えなくなるのを防ぐ)。
  const infos = members.map((m) => {
    const all = getTimed(m, dateStr);
    const fullDay = all.find((it) => isFullDayCat(it.cat));
    const others = all.filter((it) => !isFullDayCat(it.cat));
    return { m, fullDay, others };
  });
  const resting = infos.filter((x) => x.fullDay);
  const visibleInfos = infos.filter((x) => !x.fullDay || x.others.length > 0);

  return (
    <div className={`day-wrap ${alert ? "day-alert" : ""}`}>
      <div className="day-title">
        {d.getFullYear()}年 {d.getMonth() + 1}月 {d.getDate()}日（
        {WEEKDAYS_JP[d.getDay()]}）
        {alert && (
          <AlertBadge
            info={alert}
            onDismiss={() => onDismissAlert(dateStr)}
          />
        )}
      </div>
      <p className="link-note">
        時間軸モードでは、時刻のない午前/午後の予定は上部の「AM/PM帯」に、時間指定の予定は時間グリッドに表示され、両方を一度に確認できます。
        午前/午後モードでは、時間軸の予定も各枠に読み取り表示されます。
      </p>

      {slotMode === "ampm" ? (
        <div className="day-ampm">
          {members.map((m, i) => (
            <div
              key={m}
              draggable
              onDragStart={(e) => {
                if (editingMember !== null) { e.preventDefault(); return; }
                e.dataTransfer.effectAllowed = "move";
                setDragIdx(i);
              }}
              onDragOver={(e) => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; if (overIdx !== i) setOverIdx(i); }}
              onDrop={() => {
                if (dragIdx === null || dragIdx === i) return;
                const o = [...members];
                const [mv] = o.splice(dragIdx, 1);
                o.splice(i, 0, mv);
                onReorderMembers(o);
                setDragIdx(null); setOverIdx(null);
              }}
              onDragEnd={() => { setDragIdx(null); setOverIdx(null); }}
              className={[
                "day-row",
                isOrder(m, dateStr) ? "order-day-row" : "",
                dragIdx === i ? "row-dragging" : "",
                overIdx === i && dragIdx !== i ? "drag-over-row" : "",
              ].filter(Boolean).join(" ")}
            >
              <div
                className={`day-name ${
                  isOrder(m, dateStr) ? "order-name" : ""
                }`}
              >
                <span className="drag-handle" title="ドラッグで順序変更">⠿</span>
                {isOrder(m, dateStr) && (
                  <span className="order-star">★</span>
                )}
                {editingMember === m ? (
                  <input
                    className="name-edit"
                    value={editName}
                    autoFocus
                    onChange={(e) => setEditName(e.target.value)}
                    onBlur={() => { onRenameMember(m, editName); setEditingMember(null); }}
                    onKeyDown={(e) => {
                      if (e.key === "Enter") { onRenameMember(m, editName); setEditingMember(null); }
                      if (e.key === "Escape") setEditingMember(null);
                    }}
                    onClick={(e) => e.stopPropagation()}
                  />
                ) : (
                  <span
                    className="member-name-label"
                    title="クリックで名前を編集"
                    onClick={() => { setEditingMember(m); setEditName(m); }}
                  >
                    {m}
                  </span>
                )}
              </div>
              <AmpmCell
                disp={getAmpmDisplay(m, dateStr)}
                onOpenSlot={(slot) =>
                  onOpen({ mode: "ampm", member: m, dateStr, slot })
                }
                variant="day"
              />
            </div>
          ))}
        </div>
      ) : (
        <>
        {resting.length > 0 && (
          <div className="dsh-rest day-rest">
            <span className="dsh-rest-label">休み</span>
            {resting.map(({ m, fullDay }) => (
              <button
                key={m}
                className="rest-chip"
                style={{
                  background: CATEGORIES[fullDay.cat]?.bg,
                  color: CATEGORIES[fullDay.cat]?.fg,
                }}
                onClick={() =>
                  onOpen({ mode: "ampm", member: m, dateStr, slot: "AM" })
                }
                title="クリックで編集"
              >
                {m}（{CATEGORIES[fullDay.cat]?.label}）
              </button>
            ))}
          </div>
        )}
        <div className="cal-scroll">
          <div
            className="cal"
            style={{
              gridTemplateColumns: `40px repeat(${Math.max(visibleInfos.length, 1)}, minmax(0,1fr))`,
            }}
          >
            <div className="cal-corner" />
            {visibleInfos.map(({ m }) => {
              const i = members.indexOf(m); // 並び替えは元の members 基準
              return (
              <div
                key={m}
                draggable
                onDragStart={(e) => {
                  if (editingMember !== null) { e.preventDefault(); return; }
                  e.dataTransfer.effectAllowed = "move";
                  setDragIdx(i);
                }}
                onDragOver={(e) => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; if (overIdx !== i) setOverIdx(i); }}
                onDrop={() => {
                  if (dragIdx === null || dragIdx === i) return;
                  const o = [...members];
                  const [mv] = o.splice(dragIdx, 1);
                  o.splice(i, 0, mv);
                  onReorderMembers(o);
                  setDragIdx(null); setOverIdx(null);
                }}
                onDragEnd={() => { setDragIdx(null); setOverIdx(null); }}
                className={[
                  "cal-head",
                  isOrder(m, dateStr) ? "order-cal-head" : "",
                  dragIdx === i ? "col-dragging" : "",
                  overIdx === i && dragIdx !== i ? "drag-over-col" : "",
                ].filter(Boolean).join(" ")}
              >
                {isOrder(m, dateStr) && (
                  <span className="order-star">★</span>
                )}
                {editingMember === m ? (
                  <input
                    className="name-edit name-edit-cal"
                    value={editName}
                    autoFocus
                    onChange={(e) => setEditName(e.target.value)}
                    onBlur={() => { onRenameMember(m, editName); setEditingMember(null); }}
                    onKeyDown={(e) => {
                      if (e.key === "Enter") { onRenameMember(m, editName); setEditingMember(null); }
                      if (e.key === "Escape") setEditingMember(null);
                    }}
                    onClick={(e) => e.stopPropagation()}
                  />
                ) : (
                  <span
                    className="member-name-label name-label-cal"
                    title="クリックで名前を編集"
                    onClick={() => { setEditingMember(m); setEditName(m); }}
                  >
                    {m}
                  </span>
                )}
              </div>
              );
            })}

            {/* 時間ラベル列 + 各メンバー列 */}
            <div className="cal-time-col">
              {hours.map((h) => (
                <div key={h} className="cal-hour" style={{ height: ROW_H }}>
                  {String(h).padStart(2, "0")}:00
                </div>
              ))}
            </div>

            {visibleInfos.map(({ m, others }) => (
              <div
                key={m}
                className={`cal-col ${
                  isOrder(m, dateStr) ? "order-cal-col" : ""
                }`}
                onClick={(e) => {
                  // クリック位置から開始時刻を推定
                  const rect = e.currentTarget.getBoundingClientRect();
                  const y = e.clientY - rect.top;
                  const hour = HOUR_START + Math.floor(y / ROW_H);
                  const hh = String(Math.max(HOUR_START, Math.min(hour, HOUR_END - 1))).padStart(2, "0");
                  onOpen({
                    mode: "timed",
                    member: m,
                    dateStr,
                    prefill: { start: `${hh}:00`, end: `${String(Math.min(hour + 1, HOUR_END)).padStart(2, "0")}:00` },
                  });
                }}
              >
                {hours.map((h) => (
                  <div
                    key={h}
                    className="cal-slot-bg"
                    style={{ height: ROW_H }}
                  />
                ))}
                {assignSubColumns(others).map((it) => {
                  const [sh, sm] = it.start.split(":").map(Number);
                  const [eh, em] = it.end.split(":").map(Number);
                  const top = (sh + sm / 60 - HOUR_START) * ROW_H;
                  const height = Math.max(
                    22,
                    (eh + em / 60 - (sh + sm / 60)) * ROW_H - 4
                  );
                  const synthetic = it._real === false;
                  const sub = it._sub || 0;
                  const subCount = it._subCount || 1;
                  return (
                    <div
                      key={it.id}
                      className={`cal-event ${synthetic ? "synthetic" : ""}`}
                      style={{
                        top,
                        height,
                        left: `calc(${(sub / subCount) * 100}% + 2px)`,
                        width: `calc(${100 / subCount}% - 4px)`,
                        right: "auto",
                        background:
                          CATEGORIES[it.cat]?.bg || CATEGORIES.other.bg,
                        color: CATEGORIES[it.cat]?.fg || CATEGORIES.other.fg,
                        borderLeft: `3px ${synthetic ? "dashed" : "solid"} ${
                          CATEGORIES[it.cat]?.fg || CATEGORIES.other.fg
                        }`,
                      }}
                      onClick={(ev) => {
                        ev.stopPropagation();
                        if (synthetic) {
                          // AM/PM由来 → 対応する午前/午後エディタを開く
                          const slot = sh < 12 ? "AM" : "PM";
                          onOpen({
                            mode: "ampm",
                            member: m,
                            dateStr,
                            slot,
                          });
                        } else {
                          onOpen({
                            mode: "timed",
                            member: m,
                            dateStr,
                            editId: it.id,
                          });
                        }
                      }}
                    >
                      <b>
                        {synthetic
                          ? sh < 12
                            ? "午前"
                            : "午後"
                          : `${it.start}–${it.end}`}
                      </b>
                      <span>{it.text || CATEGORIES[it.cat]?.label}</span>
                    </div>
                  );
                })}
              </div>
            ))}
          </div>
        </div>
        </>
      )}
    </div>
  );
}

/* ============================================================
   編集モーダル
   ============================================================ */
function Editor({
  payload,
  onClose,
  onReopen,
  getCell,
  getTimed,
  setCell,
  addCellEntry,
  removeCellEntry,
  updateCellEntry,
  upsertTimed,
  deleteTimed,
  onCopyDay,
}) {
  const { mode, member, dateStr, slot } = payload;
  const d = parseYmd(dateStr);
  const dateLabel = `${d.getMonth() + 1}/${d.getDate()}（${
    WEEKDAYS_JP[d.getDay()]
  }）`;

  if (mode === "ampm") {
    const entries = getCell(member, dateStr, slot);
    // 全日（有給/公休/allDay）が入っている日は「終日」扱いで AM/PM 両方の予定をまとめて表示
    const dayIsFull = !!(
      findFullDayEntry(getCell(member, dateStr, "AM")) ||
      findFullDayEntry(getCell(member, dateStr, "PM"))
    );
    // 時間軸の予定：通常はこのスロット分（AM:開始<12 / PM:開始>=12）、全日の日は全ての時間帯予定
    // part:true(パート基本シフト)は午前/午後では扱わないので除外
    const slotTimed = getTimed(member, dateStr)
      .filter((it) => !it.part)
      .filter((it) => {
        if (dayIsFull) return true;
        const h = parseInt((it.start || "00:00").slice(0, 2), 10);
        return slot === "AM" ? h < 12 : h >= 12;
      })
      .sort((a, b) => a.start.localeCompare(b.start));

    const defaultStart = slot === "AM" ? "09:00" : "14:00";
    const defaultEnd = slot === "AM" ? "10:00" : "15:00";
    const [text, setText] = useState("");
    const [useTime, setUseTime] = useState(false);
    const [allDay, setAllDay] = useState(false);
    const [start, setStart] = useState(defaultStart);
    const [end, setEnd] = useState(defaultEnd);
    // 時刻なしAM/PMエントリの編集中インデックス（null=新規追加モード）
    const [editIdx, setEditIdx] = useState(null);
    const editing = editIdx != null ? entries[editIdx] : null;

    // 全日 と 時間指定 は相互排他。編集中は「全日」チェックでその予定へ即反映。
    const toggleAllDay = (v) => {
      setAllDay(v);
      if (v) setUseTime(false);
      if (editIdx != null) {
        const e = entries[editIdx];
        if (e && !isFullDayCat(e.cat)) {
          updateCellEntry(member, dateStr, slot, editIdx, { allDay: v });
        }
      }
    };
    const toggleUseTime = (v) => { setUseTime(v); if (v) setAllDay(false); };

    const resetForm = () => {
      setText("");
      setUseTime(false);
      setAllDay(false);
      setStart(defaultStart);
      setEnd(defaultEnd);
      setEditIdx(null);
    };

    // 時刻なしAM/PMエントリの編集を開始
    const startEdit = (idx) => {
      const e = entries[idx];
      setEditIdx(idx);
      setText(e.text || "");
      setUseTime(false);
      setAllDay(isEntryFullDay(e));
      setStart(defaultStart);
      setEnd(defaultEnd);
    };

    // 区分ボタンをクリックした時点で確定
    //  - editIdx あり → 既存の時刻なしエントリを更新（時間指定ONなら時刻あり予定へ変換）
    //  - 全日(有給/公休) は時間指定を無視して AM/PM エントリ（マージ表示）
    //  - 時間指定 ON → upsertTimed（時間軸の予定として登録、AM/PM に派生表示）
    //  - 時間指定 OFF → addCellEntry（時間なしの AM/PM エントリ）
    // 全日エントリの生成（有給/公休は区分自体が全日なのでフラグ不要）
    const mkFull = (c, t) => ({ cat: c, text: t, ...(isFullDayCat(c) ? {} : { allDay: true }) });
    const submitWith = (c) => {
      const t = text.trim();
      // 全日（有給/公休 or 全日チェックON）は時間指定を無視し AM/PM 合体エントリにする
      const wantFull = isFullDayCat(c) || allDay;
      if (editIdx != null) {
        if (wantFull) {
          if (c === "other" && !t) return;
          removeCellEntry(member, dateStr, slot, editIdx);
          addCellEntry(member, dateStr, slot, mkFull(c, t));
        } else if (useTime) {
          if (start >= end) {
            alert("終了時刻は開始時刻より後にしてください");
            return;
          }
          upsertTimed(member, dateStr, {
            id: `t_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
            start,
            end,
            cat: c,
            text: t,
          });
          removeCellEntry(member, dateStr, slot, editIdx);
        } else {
          if (c === "other" && !t) return;
          updateCellEntry(member, dateStr, slot, editIdx, { cat: c, text: t });
        }
        resetForm();
        return;
      }
      if (wantFull) {
        if (c === "other" && !t) return;
        addCellEntry(member, dateStr, slot, mkFull(c, t));
        setText("");
        setAllDay(false);
        return;
      }
      if (useTime) {
        if (start >= end) {
          alert("終了時刻は開始時刻より後にしてください");
          return;
        }
        upsertTimed(member, dateStr, {
          id: `t_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
          start,
          end,
          cat: c,
          text: t,
        });
      } else {
        if (c === "other" && !t) return; // その他+メモ空は無視
        addCellEntry(member, dateStr, slot, { cat: c, text: t });
      }
      setText("");
    };

    const hasAnything = entries.length > 0 || slotTimed.length > 0;
    // 有給/公休を編集中は「全日」は常時ON・切替不可
    const fullDayLocked = !!(editing && isFullDayCat(editing.cat));
    // 時刻行の確定：編集中は区分維持で更新、追加中は区分なしで追加
    const commitTime = () => submitWith(editing ? editing.cat : "other");
    // 一覧の並び：早上がりは常に一番下（元の index は編集/削除用に保持）
    const entryList = entries.map((e, idx) => ({ e, idx }));
    const entryNormal = entryList.filter(({ e }) => e.cat !== EARLY_LEAVE_CAT);
    const entryEarly = entryList.filter(({ e }) => e.cat === EARLY_LEAVE_CAT);
    const renderEntryRow = ({ e, idx }) => (
      <div
        key={`a${idx}`}
        className={`ev-row ${editIdx === idx ? "ev-row-editing" : ""}`}
      >
        <span className="ev-color" style={{ background: CATEGORIES[e.cat]?.chip }} />
        <b style={{ color: CATEGORIES[e.cat]?.fg }}>{CATEGORIES[e.cat]?.label}</b>
        {isEntryFullDay(e) && <span className="ev-fd-badge">全日</span>}
        <span className="ev-txt">{e.text}</span>
        <button className="mini edit" onClick={() => startEdit(idx)}>編集</button>
        <button
          className="mini"
          onClick={() => removeCellEntry(member, dateStr, slot, idx)}
        >
          削除
        </button>
      </div>
    );

    return (
      <Modal onClose={onClose}>
        <button
          className="modal-close"
          onClick={onClose}
          aria-label="閉じる"
          title="閉じる"
        >
          ×
        </button>
        <h3>
          {member}・{dateLabel}・{dayIsFull ? "AM/PM" : slot}
        </h3>

        {onCopyDay &&
          (getCell(member, dateStr, "AM").length > 0 ||
            getCell(member, dateStr, "PM").length > 0 ||
            getTimed(member, dateStr).some((it) => !it.part)) && (
          <button
            className="ev-copy-day"
            title="この日の予定をコピー（週表で他の日付マスに貼り付け）"
            onClick={() => { onCopyDay(member, dateStr); onClose(); }}
          >
            ⧉ この日をコピー
          </button>
        )}

        {hasAnything && (
          <div className="ev-list">
            {entryNormal.map(renderEntryRow)}
            {slotTimed.map((it) => (
              <div key={it.id} className="ev-row ev-row-timed">
                <span
                  className="ev-color"
                  style={{ background: CATEGORIES[it.cat]?.chip }}
                />
                <b className="ev-time">{it.start}–{it.end}</b>
                <b style={{ color: CATEGORIES[it.cat]?.fg }}>
                  {CATEGORIES[it.cat]?.label}
                </b>
                <span className="ev-txt">{it.text}</span>
                <button
                  className="mini edit"
                  onClick={() =>
                    onReopen({ mode: "timed", member, dateStr, editId: it.id })
                  }
                >
                  編集
                </button>
                <button
                  className="mini"
                  onClick={() => deleteTimed(member, dateStr, it.id)}
                >
                  削除
                </button>
              </div>
            ))}
            {entryEarly.map(renderEntryRow)}
          </div>
        )}

        {editing && (
          <div className="edit-banner">
            <span>
              「{editing.text || CATEGORIES[editing.cat]?.label}」を編集中
              （メモ・区分を変更して確定）
            </span>
            <button className="mini" onClick={resetForm}>
              やめる
            </button>
          </div>
        )}

        <p className="m-label">
          {editing
            ? "メモ（区分をクリックで更新）"
            : `メモ（区分なしで${slot}全体の予定として追加できます）`}
        </p>
        <div className="memo-row">
          <input
            className="m-input"
            value={text}
            autoFocus
            placeholder="例：ロボパット（午前すべての予定）"
            onChange={(e) => setText(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") submitWith("other"); }}
          />
          <button
            type="button"
            className="memo-add"
            disabled={!text.trim()}
            onClick={() => submitWith("other")}
            title={editing ? "このメモで更新" : "このメモを区分なしで追加（時間指定なし）"}
          >
            {editing ? "更新" : "＋ 追加"}
          </button>
        </div>

        <label className={`time-toggle ${allDay ? "disabled" : ""}`}>
          <input
            type="checkbox"
            checked={useTime}
            disabled={allDay}
            onChange={(e) => toggleUseTime(e.target.checked)}
          />
          {editing
            ? "時間を指定（時間軸の予定に変換）"
            : "時間を指定して追加（時間軸にも表示されます）"}
        </label>
        <label className={`time-toggle ${useTime || fullDayLocked ? "disabled" : ""}`}>
          <input
            type="checkbox"
            checked={allDay || fullDayLocked}
            disabled={useTime || fullDayLocked}
            onChange={(e) => toggleAllDay(e.target.checked)}
          />
          {editing ? "全日にする" : "全日にする（先にチェック→区分を選ぶ）"}
        </label>
        {useTime && (
          <div className="time-row-inline">
            <div className="time-inputs">
              <input
                type="time"
                value={start}
                onChange={(e) => { const v = e.target.value; setEnd(shiftEndByStart(v, start, end)); setStart(v); }}
                onKeyDown={(e) => { if (e.key === "Enter") commitTime(); }}
              />
              <span>〜</span>
              <input
                type="time"
                value={end}
                onChange={(e) => setEnd(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Enter") commitTime(); }}
              />
            </div>
            <button
              type="button"
              className="time-add"
              onClick={commitTime}
              title={editing ? "区分は維持して、この時刻の時間帯予定に変換" : "区分なしで、この時間とメモだけを追加"}
            >
              {editing ? "この時刻で更新" : "＋ この時間で追加（区分なし）"}
            </button>
          </div>
        )}

        <p className="m-label">
          {editing
            ? "区分をクリックで更新"
            : allDay
              ? "区分をクリックで全日として追加"
              : useTime
                ? "区分も指定したい場合はクリック"
                : "区分をクリックしてそのまま追加"}
        </p>
        {!editing && (
          <p className="ampm-steps">
            全日にするとき：先に「全日」にチェック → 区分を選ぶ。
            時間帯予定：「時間を指定」→区分。
          </p>
        )}
        <CatPicker value={editing ? editing.cat : null} onChange={submitWith} />

        <p className="ampm-hint">
          ※「有給」「公休」は常に <b>全日扱い</b>。<b>全日</b>にチェックすると
          どの区分でも終日扱い（AM/PMを1マスに合体・他の予定は消去）になります。
          TEL①/②・フォローの全日は時間軸で<b>AM/PMの2ブロック</b>、その他は<b>7:00–16:00の帯</b>で表示。
        </p>
      </Modal>
    );
  }

  // timed モード
  const list = getTimed(member, dateStr)
    .slice()
    .sort((a, b) => a.start.localeCompare(b.start));
  const editing =
    payload.editId && list.find((x) => x.id === payload.editId);

  const [start, setStart] = useState(
    editing?.start || payload.prefill?.start || "09:00"
  );
  const [end, setEnd] = useState(
    editing?.end || payload.prefill?.end || "10:00"
  );
  const [cat, setCat] = useState(editing?.cat || "other");
  const [text, setText] = useState(editing?.text || "");

  return (
    <Modal onClose={onClose}>
      <h3>
        {member}・{dateLabel}
      </h3>

      {list.length > 0 && (
        <div className="ev-list">
          {list.map((it) => (
            <div
              key={it.id}
              className={`ev-row ${editing && editing.id === it.id ? "ev-row-editing" : ""}`}
            >
              <span
                className="ev-color"
                style={{ background: CATEGORIES[it.cat]?.chip }}
              />
              <b>
                {it.start}–{it.end}
              </b>
              <span className="ev-txt">
                {it.text || CATEGORIES[it.cat]?.label}
              </span>
              <button
                className="mini edit"
                onClick={() =>
                  onReopen({ mode: "timed", member, dateStr, editId: it.id })
                }
              >
                編集
              </button>
              <button
                className="mini"
                onClick={() => deleteTimed(member, dateStr, it.id)}
              >
                削除
              </button>
            </div>
          ))}
        </div>
      )}

      <p className="m-label">{editing ? "予定を編集" : "新しい予定"}</p>
      <div className="time-row">
        <input
          type="time"
          value={start}
          onChange={(e) => { const v = e.target.value; setEnd(shiftEndByStart(v, start, end)); setStart(v); }}
        />
        <span>〜</span>
        <input
          type="time"
          value={end}
          onChange={(e) => setEnd(e.target.value)}
        />
      </div>

      <p className="m-label">区分</p>
      <CatPicker value={cat} onChange={setCat} />

      <input
        className="m-input"
        value={text}
        placeholder="内容メモ（任意）"
        onChange={(e) => setText(e.target.value)}
      />

      <div className="m-actions">
        <div className="spacer" />
        <button className="ghost" onClick={onClose}>
          閉じる
        </button>
        <button
          className="primary"
          onClick={() => {
            if (start >= end) {
              alert("終了時刻は開始時刻より後にしてください");
              return;
            }
            upsertTimed(member, dateStr, {
              id: editing?.id || `t_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
              start,
              end,
              cat,
              text: text.trim(),
            });
            onClose();
          }}
        >
          {editing ? "更新" : "追加"}
        </button>
      </div>
    </Modal>
  );
}

function CatPicker({ value, onChange }) {
  const primary = Object.entries(CATEGORIES).filter(([, c]) => c.primary);
  const secondary = Object.entries(CATEGORIES).filter(([, c]) => !c.primary);
  return (
    <>
      <div className="cat-grid">
        {primary.map(([k, c]) => (
          <button
            key={k}
            className={`cat-btn ${value === k ? "sel" : ""}`}
            style={{ background: c.chip, color: c.fg }}
            onClick={() => onChange(k)}
          >
            {c.label}
          </button>
        ))}
      </div>
      <div className="cat-sub">
        {secondary.map(([k, c]) => (
          <button
            key={k}
            className={`cat-mini ${value === k ? "sel" : ""}`}
            style={{ background: c.chip, color: c.fg }}
            onClick={() => onChange(k)}
          >
            {c.label}
          </button>
        ))}
      </div>
    </>
  );
}

/* ============================================================
   一括入力モーダル（複数メンバー × 複数日 に同じ予定をまとめて登録）
   ============================================================ */
function BulkAddModal({ members, weekDays, defaultDate, onClose, onApply }) {
  const [selMembers, setSelMembers] = useState(() => new Set());
  const [selDates, setSelDates] = useState(() => new Set([defaultDate]));
  const [cat, setCat] = useState(null);
  const [text, setText] = useState("");
  const [slot, setSlot] = useState("AM");
  const [useTime, setUseTime] = useState(false);
  const [start, setStart] = useState("09:00");
  const [end, setEnd] = useState("10:00");
  const [extraDate, setExtraDate] = useState("");
  const [resultMsg, setResultMsg] = useState("");

  // 表示中の週（月〜土）をトグル用に整形
  const weekOpts = weekDays.map((d) => {
    const ds = ymd(d);
    const label = `${d.getMonth() + 1}/${d.getDate()}（${WEEKDAYS_JP[d.getDay()]}）`;
    return { ds, label };
  });
  const weekSet = new Set(weekOpts.map((o) => o.ds));
  // 週外に手動追加された日付（チップ表示用）
  const extraDates = [...selDates].filter((ds) => !weekSet.has(ds)).sort();

  const toggleSet = (setter, key) =>
    setter((prev) => {
      const nx = new Set(prev);
      nx.has(key) ? nx.delete(key) : nx.add(key);
      return nx;
    });

  const fmtDs = (ds) => {
    const d = parseYmd(ds);
    return `${d.getMonth() + 1}/${d.getDate()}（${WEEKDAYS_JP[d.getDay()]}）`;
  };

  const memberList = [...selMembers];
  const dateList = [...selDates];
  // 区分未選択のときは自動的に「その他」として扱う
  const effCat = cat || "other";
  const isFull = isFullDayCat(effCat) || slot === "allday";
  const canApply =
    memberList.length > 0 &&
    dateList.length > 0 &&
    !(effCat === "other" && !text.trim()) &&
    !(useTime && !isFull && start >= end);

  const handleApply = () => {
    if (memberList.length === 0) { alert("メンバーを1人以上選んでください"); return; }
    if (dateList.length === 0) { alert("日付を1つ以上選んでください"); return; }
    if (effCat === "other" && !text.trim()) {
      alert("区分を選ぶか、予定の内容（メモ）を入力してください");
      return;
    }
    if (useTime && !isFull && start >= end) {
      alert("終了時刻は開始時刻より後にしてください");
      return;
    }
    const n = onApply({
      members: memberList,
      dates: dateList,
      cat: effCat,
      text,
      slot: slot === "allday" ? "AM" : slot,
      useTime: useTime && !isFull,
      start,
      end,
      allDay: isFull,
    });
    setResultMsg(
      `✓ ${CATEGORIES[effCat]?.label || effCat} を ${memberList.length}人 × ${dateList.length}日（計${n}件）追加しました`
    );
    // 続けて追加できるよう内容だけリセット（対象の選択は残す）
    setCat(null);
    setText("");
    setUseTime(false);
  };

  return (
    <Modal onClose={onClose} wide>
      <button className="modal-close" onClick={onClose} aria-label="閉じる" title="閉じる">×</button>
      <h3>一括入力（複数メンバー・複数日）</h3>

      {/* メンバー選択 */}
      <div className="bulk-sec-head">
        <p className="m-label">対象メンバー（{memberList.length}人）</p>
        <div className="bulk-quick">
          <button className="mini" onClick={() => setSelMembers(new Set(members))}>全選択</button>
          <button className="mini" onClick={() => setSelMembers(new Set())}>全解除</button>
        </div>
      </div>
      <div className="bulk-members">
        {members.map((m) => (
          <button
            key={m}
            className={`bulk-chip ${selMembers.has(m) ? "on" : ""}`}

        onChange={(e) => setText(e.target.value)}

        <label className={`bulk-radio ${isFullDayCat(cat) || useTime ? "disabled" : ""}`}>

            checked={slot === "AM" && !isFullDayCat(cat)}
            disabled={isFullDayCat(cat) || useTime}

        <label className={`bulk-radio ${isFullDayCat(cat) || useTime ? "disabled" : ""}`}>
          <input
            type="radio"
            name="bulkslot"
            checked={slot === "PM" && !isFullDayCat(cat)}
            disabled={isFullDayCat(cat) || useTime}
            onChange={() => setSlot("PM")}
          />

        </label>
        <label className={`bulk-radio ${useTime ? "disabled" : ""}`}>
          <input
            type="radio"
            name="bulkslot"
            checked={slot === "allday" || isFullDayCat(cat)}
            disabled={useTime}
            onChange={() => setSlot("allday")}

        <label className={`time-toggle ${isFull ? "disabled" : ""}`}>
          <input
            type="checkbox"
            checked={useTime && !isFull}
            disabled={isFull}
            onChange={(e) => setUseTime(e.target.checked)}

        </label>
      </div>
      {useTime && !isFull && (
        <div className="time-row">
          <input type="time" value={start} onChange={(e) => { const v = e.target.value; setEnd(shiftEndByStart(v, start, end)); setStart(v); }} />
          <span>〜</span>
          <input type="time" value={end} onChange={(e) => setEnd(e.target.value)} />
        </div>
      )}

      <p className="m-label">区分（クリックで選択。未選択なら「その他」）</p>
      <CatPicker value={cat} onChange={setCat} />
      {isFull && (
        <p className="ampm-hint">
          <b>全日</b>：AM/PMを1マスに合体し、その日の既存AM/PM予定は消去されます
          （有給/公休は常に全日）。時間軸では TEL①/②・フォローは<b>AM/PMの2ブロック</b>、
          その他は<b>7:00–16:00の帯</b>で表示されます。
        </p>
      )}

      {resultMsg && <div className="bulk-result">{resultMsg}</div>}

      <div className="m-actions">
        <div className="spacer" />
        <button className="ghost" onClick={onClose}>閉じる</button>
        <button className="primary" disabled={!canApply} onClick={handleApply}>
          {memberList.length}人 × {dateList.length}日 に一括追加
        </button>
      </div>
    </Modal>
  );
}

function TodoPanel({ title, items, onAdd, onToggle, onDelete, compact, hideCheck, placeholder, emptyText }) {
  const [text, setText] = useState("");
  const remaining = items.filter((x) => !x.done).length;

  const submit = () => {
    if (text.trim()) {
      onAdd(text);
      setText("");
    }
  };

  return (
    <div className={`todo-panel ${compact ? "compact" : ""} ${hideCheck ? "event-panel" : ""}`}>
      <div className="todo-head">
        <h3>{title}</h3>
        {!hideCheck && (
          <span className="todo-count">
            残り {remaining} 件 / 全 {items.length} 件
          </span>
        )}
      </div>

      <div className="todo-input">
        <input
          value={text}
          placeholder={placeholder || "TODOを入力して Enter または「追加」"}
          onChange={(e) => setText(e.target.value)}
          onKeyDown={(e) => {
            if (e.key === "Enter") submit();
          }}
        />
        <button className="todo-add" onClick={submit}>
          追加
        </button>
      </div>

      {items.length === 0 ? (
        <p className="todo-empty">{emptyText || "まだTODOはありません"}</p>
      ) : (
        <ul className="todo-list">
          {items.map((it) => (
            <li key={it.id} className={!hideCheck && it.done ? "done" : ""}>
              {hideCheck ? (
                <span className="todo-text todo-text-nocheck">{it.text}</span>
              ) : (
                <label className="todo-check">
                  <input
                    type="checkbox"
                    checked={it.done}
                    onChange={() => onToggle(it.id)}
                  />
                  <span className="todo-text">{it.text}</span>
                </label>
              )}
              <button
                className="todo-del"
                title="削除"
                onClick={() => onDelete(it.id)}
              >
                ×
              </button>
            </li>
          ))}
        </ul>
      )}
    </div>
  );
}

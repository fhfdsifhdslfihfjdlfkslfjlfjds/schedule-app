<script type="text/plain" id="app-source">
// React と Hooks は CDN のグローバルから取得
const { useState, useEffect, useCallback, useMemo } = React;

/* ============================================================
   総務部 スケジュール管理アプリ
   - 管理者が全メンバーの予定を入力・管理
   - 週表示（メンバー×日付グリッド）/ 日表示（時間軸）切替
   - 午前/午後区分 と 時間軸 の両モード
   - 区分はワンタッチ（有給・公休・TEL当番 等）+ 自由メモ
   - ブラウザ内に自動保存（localStorage）
   ============================================================ */

const STORAGE_KEY = "soumu_schedule_v1";

// 予定の種別（色分け）— 元表の運用に合わせた区分
// 主役区分（ワンタッチ）
const CATEGORIES = {
  yukyu:   { label: "有給",     bg: "#fde047", fg: "#713f12", chip: "#facc15", primary: true },
  kokyu:   { label: "公休",     bg: "#e2e8f0", fg: "#334155", chip: "#cbd5e1", primary: true },
  tel1:    { label: "TEL①",    bg: "#bfdbfe", fg: "#1e3a5f", chip: "#93c5fd", primary: true },
  tel2:    { label: "TEL②",    bg: "#a5b4fc", fg: "#312e81", chip: "#818cf8", primary: true },
  follow:  { label: "フォロー", bg: "#bbf7d0", fg: "#14532d", chip: "#86efac", primary: true },
  honsha:  { label: "本社",     bg: "#fed7aa", fg: "#7c2d12", chip: "#fdba74", primary: true },
  free:    { label: "フリー",   bg: "#fbcfe8", fg: "#831843", chip: "#f9a8d4", primary: true },
  genkin:  { label: "現金締め", bg: "#fecaca", fg: "#7f1d1d", chip: "#fca5a5", primary: true },
  hayaagari:{ label: "早上がり", bg: "#cffafe", fg: "#155e75", chip: "#67e8f9", primary: true },
  // 補助区分
  meeting: { label: "会議",     bg: "#ddd6fe", fg: "#4c1d95", chip: "#c4b5fd", primary: false },
  other:   { label: "その他",   bg: "#e7ddc6", fg: "#5f4b27", chip: "#d8c9a8", primary: false },
};

// 旧キー（tel→tel1）からの移行マップ
const CAT_MIGRATE = { tel: "tel1" };
function normCat(c) {
  if (!c) return "other";
  if (CAT_MIGRATE[c]) return CAT_MIGRATE[c];
  return CATEGORIES[c] ? c : "other";
}

// この区分が予定に入っていると「受注メンバー」として自動判定される役割
const ORDER_ROLE_CATS = ["tel1", "tel2", "follow"];
const ORDER_ROLE_LABEL = ORDER_ROLE_CATS.map((k) => CATEGORIES[k].label).join("・");

// この区分は「全日」扱い：AM/PM のどちらかに入ると 1 マスに合体表示
const FULL_DAY_CATS = ["yukyu", "kokyu"];
function isFullDayCat(c) { return FULL_DAY_CATS.includes(c); }
// エントリが全日か：有給/公休（常に全日）または allDay フラグ付き（任意区分を全日化）
function isEntryFullDay(e) { return !!e && (isFullDayCat(e.cat) || e.allDay === true); }

// 時刻のない AM/PM 予定を時間軸ブロックにするときの区分別デフォルト時間
const SLOT_TIMES = {
  tel1:   { AM: ["07:00", "11:00"], PM: ["12:00", "16:00"] },
  tel2:   { AM: ["07:00", "11:30"], PM: ["12:30", "16:00"] },
  follow: { AM: ["07:00", "12:30"], PM: ["13:30", "16:00"] },
};
const SLOT_TIMES_DEFAULT = { AM: ["07:00", "12:00"], PM: ["13:00", "16:00"] };
function slotBlockTime(cat, slot) {
  return (SLOT_TIMES[cat] && SLOT_TIMES[cat][slot]) || SLOT_TIMES_DEFAULT[slot];
}

/* ============================================================
   AI（ルールベース）配置: 曜日別ルール＋週次自動生成
   ============================================================ */
const WEEKDAY_LABELS = ["日", "月", "火", "水", "木", "金", "土"];
const AUTO_WEEKDAYS = [1, 2, 3, 4, 5, 6]; // 月〜土（日曜は休業）
// timing.mode: "allday" | "am" | "pm"（start があれば時刻指定の時間軸予定）
function defaultAutoRules() {
  const tel = () => [
    { role: "tel1", count: 1, timing: { mode: "allday" } },
    { role: "tel2", count: 1, timing: { mode: "allday" } },
  ];
  const monFri = () => [
    ...tel(),
    { role: "follow", count: 1, timing: { mode: "allday" } },
  ];
  const tueSat = () => [
    ...tel(),
    { role: "follow", count: 1, timing: { mode: "pm", start: "14:00" } },
  ];
  return { 1: monFri(), 2: tueSat(), 3: tueSat(), 4: tueSat(), 5: monFri(), 6: tueSat() };
}
// timing を人が読むラベルに
function timingLabel(t) {
  if (!t) return "全日";
  if (t.mode === "am") return "午前";
  if (t.mode === "pm") return t.start ? `午後 ${t.start}〜` : "午後";
  return "全日";
}
// その日に予定が一切ない（割当可能）か
function isDayEmpty(events, member, ds) {
  const day = events?.[member]?.[ds];
  if (!day) return true;
  const a = day.AM, p = day.PM, t = day.timed;
  return (!a || a.length === 0) && (!p || p.length === 0) && (!t || t.length === 0);
}
// 候補選択の加重スコア（小さいほど優先）。役割の連続/偏りを抑えるための重み。
const AUTO_W_TOTAL = 10; // 総回数の公平性（主たる駆動力）
const AUTO_W_ROLE = 4;   // 特定役割への偏り抑制
const AUTO_W_REPEAT = 20; // 前日と同じ役割の連続を強く抑制（総回数2件分の不利に相当。出遅れ者でも役割が日替わりになる）
const AUTO_W_PAIR = 100;  // 相性NGペアを避けるための大ペナルティ（ソフト制約）

// 2人体制のペア対象役割（同日の TEL①＋TEL②）
const PAIR_ROLES = ["tel1", "tel2"];
// 相性表のキー（氏名を昇順ソートして連結）。区切りは氏名に出にくい制御文字。
function pairKey(a, b) { return [a, b].sort().join("␟"); }
// その2人が「組める」か（pairsNG に無ければ組める＝既定OK）
function isPairOK(pairsNG, a, b) { return !(pairsNG && pairsNG[pairKey(a, b)]); }

// 週次のルールベース配置生成。assignments / 未割当(unfilled) / ペア要確認(pairWarnings) を返す。
function generateAutoSchedule(weekDays, autoRules, orderMembers, events, pairsNG) {
  const pool = orderMembers || [];
  const load = {};       // 総割当回数（公平性）
  const roleLoad = {};   // 役割別の割当回数（役割の偏り抑制）
  const lastRole = {};   // 直近に割り当てた役割（前日同役割の連続抑制）
  pool.forEach((m) => {
    load[m] = 0;
    roleLoad[m] = {};
  });
  const assignments = [];
  const unfilled = [];
  const pairWarnings = [];
  for (const d of weekDays) {
    const wd = d.getDay();
    if (wd === 0) continue; // 日曜
    const ds = ymd(d);
    const slots = autoRules[wd] || [];
    const assignedToday = new Set();
    const todayByRole = {}; // その日の役割→氏名（TEL①/②のペア判定に使う）
    // 役割を区別したスコア: 総回数 + 役割別回数 + 前日同役割 + 相性NGペナルティ
    const score = (m, role) => {
      let s =
        load[m] * AUTO_W_TOTAL +
        (roleLoad[m]?.[role] || 0) * AUTO_W_ROLE +
        (lastRole[m] === role ? AUTO_W_REPEAT : 0);
      // TEL①/② の一方が既に決まっていれば、相手とNGな候補に大ペナルティ（ソフト）
      if (PAIR_ROLES.includes(role)) {
        const partnerRole = role === "tel1" ? "tel2" : "tel1";
        const partner = todayByRole[partnerRole];
        if (partner && !isPairOK(pairsNG, partner, m)) s += AUTO_W_PAIR;
      }
      return s;
    };
    for (const slot of slots) {
      const n = Math.max(1, slot.count || 1);
      for (let i = 0; i < n; i++) {
        const cands = pool.filter(
          (m) => !assignedToday.has(m) && isDayEmpty(events, m, ds)
        );
        if (cands.length === 0) {
          unfilled.push({ dateStr: ds, role: slot.role, timing: slot.timing });
          continue;
        }
        cands.sort(
          (a, b) =>
            (score(a, slot.role) - score(b, slot.role)) ||
            (pool.indexOf(a) - pool.indexOf(b))
        );
        const pick = cands[0];
        assignments.push({ member: pick, dateStr: ds, role: slot.role, timing: slot.timing });
        assignedToday.add(pick);
        load[pick] = (load[pick] || 0) + 1;
        roleLoad[pick][slot.role] = (roleLoad[pick][slot.role] || 0) + 1;
        lastRole[pick] = slot.role;
        if (todayByRole[slot.role] === undefined) todayByRole[slot.role] = pick;
      }
    }
    // その日の TEL①・TEL② が両方揃い、組めないペアなら要確認
    const t1 = todayByRole.tel1, t2 = todayByRole.tel2;
    if (t1 && t2 && !isPairOK(pairsNG, t1, t2)) {
      pairWarnings.push({ dateStr: ds, a: t1, b: t2 });
    }
  }
  return { assignments, unfilled, pairWarnings };
}

// メンバー識別色（週・時間軸モードの左帯）。並び順(index)で割り当て。
const MEMBER_COLORS = ["#2563eb","#dc2626","#059669","#d97706","#7c3aed","#db2777","#0891b2","#65a30d","#ea580c","#4f46e5"];
function memberColor(members, name) {
  const i = members.indexOf(name);
  return i < 0 ? "#64748b" : MEMBER_COLORS[i % MEMBER_COLORS.length];
}
function findFullDayEntry(entries) {
  return (entries || []).find((e) => isEntryFullDay(e)) || null;
}

// 締め作業（16:00以降）のアラート判定
const CLOSING_REQUIRED = 2;            // 残るべき最低人数
const CLOSING_EXCLUDED_NAMES = ["石川"]; // 常時除外（締め担当外）
const EARLY_LEAVE_CAT = "hayaagari";
const EARLY_LEAVE_TIME = "16:15"; // 早上がりの退社時刻（固定）。時間軸ではこの位置にマーカー表示
// 予定リストに早上がりが含まれるか
function hasEarlyLeave(list) {
  return (list || []).some((e) => e && e.cat === EARLY_LEAVE_CAT);
}

// パート（時短）勤務の基本シフト既定値（編集可）
const PART_DEFAULT = { start: "09:00", end: "17:00", breakStart: "13:00", breakEnd: "14:00" };
function mergePartCfg(cfg) { return { ...PART_DEFAULT, ...(cfg || {}) }; }
// パート基本シフトを timed ブロック配列へ（昼休憩を挟む）
function buildPartShift(cfg, endStr) {
  const c = mergePartCfg(cfg);
  const end = endStr || c.end;
  const blocks = [];
  if (end <= c.breakStart) {
    blocks.push({ start: c.start, end });
  } else {
    blocks.push({ start: c.start, end: c.breakStart });
    if (end > c.breakEnd) blocks.push({ start: c.breakEnd, end });
  }
  return blocks;
}
// セル文字列が退勤時刻(数字)なら "HH:MM" を返す
function parseClockOut(raw) {
  const s = String(raw == null ? "" : raw).trim();
  const m = s.match(/^(\d{1,2})(?::?(\d{2}))?$/);
  if (!m) return null;
  const h = +m[1];
  if (h < 1 || h > 24) return null;
  const mm = m[2] ? +m[2] : 0;
  return `${pad2(h)}:${pad2(mm)}`;
}
function hasLateScheduleOnDay(day) {
  const timed = day?.timed || [];
  return timed.some((it) => parseInt((it.start || "00:00").slice(0, 2), 10) >= 16);
}
function isExcludedFromClosing(day) {
  // 全日休み or 早上がり
  for (const slot of ["AM", "PM"]) {
    const list = day?.[slot] || [];
    if (list.some((e) => isFullDayCat(e.cat))) return true;
    if (list.some((e) => e.cat === EARLY_LEAVE_CAT)) return true;
  }
  // 16時以降に予定がある
  if (hasLateScheduleOnDay(day)) return true;
  return false;
}
function getClosingAvailable(events, members, dateStr) {
  return members.filter((m) => {
    if (CLOSING_EXCLUDED_NAMES.includes(m)) return false;
    const day = events?.[m]?.[dateStr] || {};
    return !isExcludedFromClosing(day);
  });
}

/* ============================================================
   シフト表 Excel 取込
   - SheetJS(グローバル XLSX) でブックを読み、氏名×日付の表を解釈
   - セル文字列から区分を判定し、予定(AM枠の1エントリ)へ変換
   ============================================================ */
function pad2(n) { return String(n).padStart(2, "0"); }

// 氏名比較用の正規化（空白を除去）
function normName(s) { return String(s == null ? "" : s).replace(/[\s　]/g, "").trim(); }

// セル文字列 → { cat, text } を判定。区分が取れなければ other(予定)扱い。空なら null。
// シフト表のコード(公/有/公コウ 等のふりがな付き)にも対応。
function detectShiftCategory(raw) {
  const s = String(raw == null ? "" : raw).trim();
  if (!s) return null;
  const t = s.replace(/[\s　]/g, "");
  // 具体的な区分を先に、ゆるい単字コード(有/公/休)は最後に判定
  const rules = [
    { cat: "tel2",      re: /(TEL|ＴＥＬ|テル|電話)[\s]*[②2２]/i },
    { cat: "tel1",      re: /(TEL|ＴＥＬ|テル|電話)[\s]*[①1１]/i },
    { cat: "tel1",      re: /(TEL|ＴＥＬ|テル)/i },
    { cat: "follow",    re: /(フォロー|フォロ|follow)/i },
    { cat: "honsha",    re: /(本社)/ },
    { cat: "meeting",   re: /(会議|ミーティング|ＭＴＧ|MTG|打合|打ち合わせ)/i },
    { cat: "genkin",    re: /(現金締め|現金|締め)/ },
    { cat: "hayaagari", re: /(早上がり|早上り|早あがり|早退|早帰)/ },
    { cat: "free",      re: /(フリー|free)/i },
    { cat: "yukyu",     re: /(有給|有休|年休|有)/ },
    { cat: "kokyu",     re: /(公休|代休|公|休)/ },
  ];
  for (const r of rules) {
    if (r.re.test(t)) {
      // 区分として認識できたものは memo を空に（コード表記のため）
      return { cat: r.cat, text: "" };
    }
  }
  // 区分に当てはまらない文字列は「その他(予定)」として登録（原文を保持）
  return { cat: "other", text: s };
}

// 1セル値から日付らしさを評価して { kind, month, day, year } を返す（kindなしは null）
function parseDateCell(v) {
  if (v == null || v === "") return null;
  if (v instanceof Date && !isNaN(v) && v.getFullYear() >= 1990) {
    return { kind: "full", year: v.getFullYear(), month: v.getMonth() + 1, day: v.getDate() };
  }
  const s = String(v).trim();
  let m;
  if ((m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/))) {
    return { kind: "full", year: +m[1], month: +m[2], day: +m[3] };
  }
  if ((m = s.match(/^(\d{1,2})[\/.月](\d{1,2})/))) {
    return { kind: "md", month: +m[1], day: +m[2] };
  }
  if ((m = s.match(/^(\d{1,2})日?$/))) {
    const day = +m[1];
    if (day >= 1 && day <= 31) return { kind: "day", day };
  }
  return null;
}

// ヘッダー行のセル群 → 日付列を構築。日(数字)のみが続く場合は月の繰り上がりを考慮。
function buildDateCols(row, baseYear, baseMonth) {
  const cells = [];
  for (let c = 0; c < row.length; c++) {
    const p = parseDateCell(row[c]);
    if (p) cells.push({ col: c, p });
  }
  if (cells.length === 0) return [];
  let curY = baseYear, curM = baseMonth, prevDay = 0;
  const out = [];
  for (const { col, p } of cells) {
    if (p.kind === "full") { curY = p.year; curM = p.month; }
    else if (p.kind === "md") { curM = p.month; }
    else if (p.kind === "day") {
      if (prevDay && p.day < prevDay) { // 日が戻ったら翌月へ
        curM += 1;
        if (curM > 12) { curM = 1; curY += 1; }
      }
    }
    prevDay = p.day;
    out.push({ col, dateStr: `${curY}-${pad2(curM)}-${pad2(p.day)}` });
  }
  return out;
}

// シート名(例: "20260616-20260715")や1行目テキストから基準年月を推定
function detectBaseYM(sheetName, aoa) {
  let m = String(sheetName || "").match(/(\d{4})(\d{2})(\d{2})/);
  if (m) return { year: +m[1], month: +m[2] };
  for (let r = 0; r < Math.min(aoa.length, 4); r++) {
    for (const v of aoa[r] || []) {
      const s = String(v == null ? "" : v);
      if ((m = s.match(/(\d{4})[/年-](\d{1,2})[/月-](\d{1,2})/))) {
        return { year: +m[1], month: +m[2] };
      }
    }
  }
  return null;
}

// 氏名照合: 完全一致(空白無視) → 姓(先頭トークン)一致(候補が1人のときのみ)
function makeMemberMatcher(members) {
  const byNorm = new Map();
  const bySurname = new Map();
  for (const m of members) {
    byNorm.set(normName(m), m);
    const sn = normName(String(m).split(/[\s　]/)[0]);
    if (!bySurname.has(sn)) bySurname.set(sn, []);
    bySurname.get(sn).push(m);
  }
  return (rawName) => {
    const nn = normName(rawName);
    if (byNorm.has(nn)) return byNorm.get(nn);
    const sn = normName(String(rawName).split(/[\s　]/)[0]);
    const cand = bySurname.get(sn);
    if (cand && cand.length === 1) return cand[0];
    return null;
  };
}

// 1セル → 取込エントリ。partCfg があればパート扱い。
// パートは:
//  - 時間軸: 勤務日(公休/有給以外)はすべて実勤務時間を入れる(`part:true` で午前/午後には派生させない)
//  - 午前/午後: 通常の退勤時刻と違う日だけ「○○退社」を記載(16時→PM)
function cellToEntry(rawCell, partCfg) {
  const s = String(rawCell == null ? "" : rawCell).trim();
  const det = s ? detectShiftCategory(s) : null;
  if (partCfg) {
    // 公休/有給 は全日（休み）
    if (det && isFullDayCat(det.cat)) return { kind: "ampm", cat: det.cat, text: "" };
    // 認識できた役割区分(TEL等)はそのまま
    if (det && det.cat !== "other") return { kind: "ampm", cat: det.cat, text: det.text };
    const co = parseClockOut(s);
    // 数字でないコード/予定(例: 健診)はメモとして残す（勤務シフトは作らない）
    if (!co && s) return { kind: "ampm", cat: "other", text: s };
    // 空欄 or 数字(退勤時刻): 実勤務時間を時間軸に。退勤=数字 or 通常end
    const end = co || partCfg.end;
    const timed = buildPartShift(partCfg, end).map((b) => ({
      ...b, cat: "other", text: "勤務", part: true,
    }));
    // 退勤が通常と違う日だけ 午前/午後 に「○○退社」
    let slot = null, ampm = null;
    if (co && co !== partCfg.end) {
      slot = parseInt(co.slice(0, 2), 10) >= 12 ? "PM" : "AM";
      ampm = { cat: co < partCfg.end ? "hayaagari" : "other", text: `${co}退社`, part: true };
    }
    return { kind: "part", slot, ampm, timed, label: ampm ? ampm.text : "勤務" };
  }
  // 非パート: 区分のみ。数字単独はスキップ（退勤時刻は基準が無いため）
  if (!det) return null;
  if (det.cat === "other") {
    if (/^\d{1,2}(?::?\d{2})?$/.test(s)) return null;
    return { kind: "ampm", cat: "other", text: s };
  }
  return { kind: "ampm", cat: det.cat, text: det.text };
}

// AoA(2次元配列)からシフト表を解釈し、取込計画を返す
// 氏名は完全一致/姓一致でアプリ名簿へ対応づけ。partConfig にある人はパート基本シフトを反映。
function parseShiftAoa(aoa, members, baseYear, baseMonth, partConfig) {
  if (!aoa || aoa.length === 0) return { error: "シートが空です" };
  const maxRows = Math.min(aoa.length, 14);
  partConfig = partConfig || {};

  // 1) 日付が最も多く並ぶ行をヘッダー行とみなす
  let headerRow = -1, dateCols = [];
  for (let r = 0; r < maxRows; r++) {
    const cols = buildDateCols(aoa[r] || [], baseYear, baseMonth);
    if (cols.length > dateCols.length) { dateCols = cols; headerRow = r; }
  }
  if (dateCols.length < 2) {
    return { error: "日付の並ぶ行を認識できませんでした。氏名の右側に日付(例: 16 17 18… や 5/25)が並んでいるか確認してください。" };
  }

  // 2) 氏名列を推定（アプリ名簿に最も多く一致する列、無ければ先頭列）
  const matchMember = makeMemberMatcher(members);
  let nameCol = 0, bestMatch = -1;
  const colCount = Math.max(...aoa.map((row) => (row ? row.length : 0)));
  for (let c = 0; c < colCount; c++) {
    let match = 0;
    for (let r = headerRow + 1; r < aoa.length; r++) {
      const v = String((aoa[r] || [])[c] ?? "").trim();
      if (v && matchMember(v)) match++;
    }
    if (match > bestMatch) { bestMatch = match; nameCol = c; }
  }

  // 3) 計画を構築
  const plan = [];
  const matchedNames = new Set();
  const unmatchedNames = new Set();
  for (let r = headerRow + 1; r < aoa.length; r++) {
    const row = aoa[r] || [];
    const rawName = String(row[nameCol] ?? "").trim();
    if (!rawName) continue;
    if (parseDateCell(rawName)) continue; // 日付/曜日行はスキップ
    const appName = matchMember(rawName);
    const matched = !!appName;
    if (matched) matchedNames.add(appName); else unmatchedNames.add(rawName);
    const partCfg = matched && partConfig[appName] ? mergePartCfg(partConfig[appName]) : null;
    for (const { col, dateStr } of dateCols) {
      const ent = cellToEntry(row[col], partCfg);
      if (!ent) continue;
      plan.push({
        member: appName || rawName,
        excelName: rawName,
        matched,
        isPart: !!partCfg,
        dateStr,
        ...ent,
      });
    }
  }
  if (plan.length === 0) {
    return { error: "取り込める予定が見つかりませんでした。氏名行と日付列の交差セルに区分や予定が入っているか確認してください。" };
  }
  return {
    plan,
    matchedNames: [...matchedNames],
    unmatchedNames: [...unmatchedNames],
    headerRow,
    nameCol,
    dateCount: dateCols.length,
  };
}

const DEFAULT_MEMBERS = [

];

const WEEKDAYS_JP = ["日", "月", "火", "水", "木", "金", "土"];
const SLOTS = ["AM", "PM"];

// 時間軸モードの表示時間レンジ
const HOUR_START = 7;
const HOUR_END = 19;

/* ---------- 日付ユーティリティ ---------- */
function ymd(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function parseYmd(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function startOfWeek(d) {
  // 月曜始まり
  const x = new Date(d);
  const day = x.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  x.setDate(x.getDate() + diff);
  x.setHours(0, 0, 0, 0);
  return x;
}
function addDays(d, n) {
  const x = new Date(d);
  x.setDate(x.getDate() + n);
  return x;
}
function fmtRange(start) {
  const end = addDays(start, 5);
  return `${start.getMonth() + 1}/${start.getDate()} 〜 ${end.getMonth() + 1}/${end.getDate()}`;
}
// 時間軸（タイムライン）の既定表示日数（今日を含む先の3稼働日）
const TIMELINE_DAYS = 3;
// 日曜は休業日。日曜なら翌日(月)へ寄せる。
function firstWorkday(d) {
  return d.getDay() === 0 ? addDays(d, 1) : d;
}
// start から日曜を飛ばして n 稼働日分の Date 配列
function buildTimelineDays(start, n) {
  const out = [];
  let x = new Date(start);
  while (out.length < n) {
    if (x.getDay() !== 0) out.push(new Date(x));
    x = addDays(x, 1);
  }
  return out;
}
// 日曜を飛ばして n 稼働日 進む(n>0)/戻る(n<0)
function addWorkdays(d, n) {
  let x = new Date(d);
  const step = n >= 0 ? 1 : -1;
  let cnt = Math.abs(n);
  while (cnt > 0) {
    x = addDays(x, step);
    if (x.getDay() !== 0) cnt--;
  }
  return x;
}

/* ============================================================
   引継ぎ（申し送りログ）＋ 日付解析による TODO 自動生成
   ============================================================ */
// 申し送りのカテゴリ定義（色分けバッジ）
const HANDOVER_CATS = {
  hikitsugi: { label: "引き継ぎ", bg: "#e5edf9", fg: "#33507d", dot: "#4f6d9a" },
  share:     { label: "共有",     bg: "#e6f6ec", fg: "#1f7a45", dot: "#2f9e5c" },
  trouble:   { label: "不都合",   bg: "#fdeaea", fg: "#a52a2a", dot: "#d64545" },
  inconv:    { label: "不便",     bg: "#fdf3e0", fg: "#8a5a12", dot: "#c8862a" },
};
const HANDOVER_CAT_KEYS = Object.keys(HANDOVER_CATS);
function normHandoverCat(c) { return HANDOVER_CATS[c] ? c : "hikitsugi"; }

// 行頭の箇条書き記号を除去
function stripBullet(s) {
  return String(s || "").replace(/^\s*[・\-*＊•]\s*/, "").trim();
}
// 曜日ラベル(月〜日) → getDay() の数値
const WD_TO_NUM = { 日: 0, 月: 1, 火: 2, 水: 3, 木: 4, 金: 5, 土: 6 };
// baseDate 以降で最も近い曜日 wd（今日を含む）
function nextWeekday(baseDate, wd) {
  const cur = baseDate.getDay();
  const diff = (wd - cur + 7) % 7;
  return addDays(baseDate, diff);
}
// 1行から最初の日付表現を検出して Date を返す（無ければ null）。base=今日基準。
function detectLineDate(line, base) {
  const s = String(line || "");
  let m;
  // YYYY-MM-DD / YYYY/M/D
  if ((m = s.match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/))) {
    const d = new Date(+m[1], +m[2] - 1, +m[3]);
    return { date: d, label: `${+m[2]}/${+m[3]}` };
  }
  // M月D日
  if ((m = s.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*日/))) {
    const mo = +m[1], da = +m[2];
    let d = new Date(base.getFullYear(), mo - 1, da);
    if (d < stripTime(base)) d = new Date(base.getFullYear() + 1, mo - 1, da);
    return { date: d, label: `${mo}月${da}日` };
  }
  // M/D（年なし）
  if ((m = s.match(/(?<![\d/])(\d{1,2})\/(\d{1,2})(?![\d/])/))) {
    const mo = +m[1], da = +m[2];
    if (mo >= 1 && mo <= 12 && da >= 1 && da <= 31) {
      let d = new Date(base.getFullYear(), mo - 1, da);
      if (d < stripTime(base)) d = new Date(base.getFullYear() + 1, mo - 1, da);
      return { date: d, label: `${mo}/${da}` };
    }
  }
  // 相対（今日・明日・明後日・明々後日/しあさって）
  const rel = [
    { re: /(今日|本日)/, add: 0, label: "今日" },
    { re: /(明後日|あさって)/, add: 2, label: "明後日" },
    { re: /(明々後日|明明後日|しあさって)/, add: 3, label: "明々後日" },
    { re: /(明日|あした|あす)/, add: 1, label: "明日" },
  ];
  // 明後日/明々後日を先に判定するため、明日は最後
  for (const r of [rel[2], rel[1], rel[0], rel[3]]) {
    if (r.re.test(s)) return { date: addDays(base, r.add), label: r.label };
  }
  // 曜日（今週/来週 + 月〜日 + 曜(日)）。裸の「月」等は誤認するため「曜」必須。
  if ((m = s.match(/(今週|来週)?\s*([日月火水木金土])曜(?:日)?/))) {
    const wd = WD_TO_NUM[m[2]];
    let d;
    if (m[1] === "来週") d = addDays(nextWeekday(startOfWeek(base), wd), 7);
    else if (m[1] === "今週") d = nextWeekday(startOfWeek(base), wd);
    else d = nextWeekday(stripTime(base), wd);
    return { date: d, label: `${m[1] || ""}${m[2]}曜` };
  }
  return null;
}
function stripTime(d) {
  const x = new Date(d);
  x.setHours(0, 0, 0, 0);
  return x;
}
// 申し送り本文 → TODO候補配列。行ごとに日付を検出できた行のみ候補化。
function parseHandoverTodos(text, baseDate) {
  const base = stripTime(baseDate || new Date());
  const out = [];
  const lines = String(text || "").split(/\r?\n/);
  let seq = 0;
  for (const raw of lines) {
    const line = stripBullet(raw);
    if (!line) continue;
    const hit = detectLineDate(line, base);
    if (!hit) continue;
    out.push({
      id: `hg_${Date.now()}_${seq++}`,
      dateStr: ymd(hit.date),
      text: line,
      rawLine: raw.trim(),
      label: hit.label,
    });
  }
  return out;
}

/* ---------- ストレージ ----------
   共有先（GAS WebアプリのURL）が分かればサーバーと同期し、
   無ければ従来どおり localStorage だけで動く（後方互換）。
   通信できないときも必ずローカルに保存するので、オフラインでも使える。 */

/* ★ここにGoogle Apps ScriptのURLを貼ると、開いた人全員が自動で共有に参加します★
   （メンバーは何も設定せずに使えます。空のままなら「共有設定」から手入力も可能）
   例: const DEFAULT_API_URL = "https://script.google.com/macros/s/AKfycb.../exec"; */
const DEFAULT_API_URL = "https://script.google.com/macros/s/AKfycbwBcyoG5B_csvUQMJiN5dnNfUtZaZsNzydV01NtDU8QHfTxm16hz05cOpPOv4DA7pzc5w/exec";

const API_URL_KEY = "soumu_api_url";
const API_TOKEN_KEY = "soumu_api_token";
const SYNC_OFF = "off"; // この端末だけで使う、と明示的に選んだ状態

function getSyncConfig() {
  try {
    const saved = (window.localStorage.getItem(API_URL_KEY) || "").trim();
    if (saved === SYNC_OFF) return { url: "", token: "" };
    return {
      url: saved || DEFAULT_API_URL,
      token: (window.localStorage.getItem(API_TOKEN_KEY) || "").trim(),
    };
  } catch (e) {
    return { url: DEFAULT_API_URL, token: "" };
  }
}
function setSyncConfig(url, token) {
  try {
    const u = (url || "").trim();
    // 空で保存＝共有解除。既定URLがある場合は明示的にOFF印を残す
    window.localStorage.setItem(API_URL_KEY, u || (DEFAULT_API_URL ? SYNC_OFF : ""));
    window.localStorage.setItem(API_TOKEN_KEY, (token || "").trim());
  } catch (e) {
    console.error("共有設定の保存に失敗しました", e);
  }
}
function isSyncOn() {
  return !!getSyncConfig().url;
}

// 同期の状態（モジュール内で保持）。base は3-wayマージの基準になる「最後に同期した内容」。
const sync = { version: 0, base: null, lastAt: "", ok: false };

// token は任意（GAS側で合言葉を設定していない場合は不要）
async function apiGet(cfg) {
  const { url, token } = cfg || getSyncConfig();
  const q = token ? `token=${encodeURIComponent(token)}&` : "";
  const r = await fetch(`${url}?${q}t=${Date.now()}`);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j; // { version, updatedAt, data }
}
// GAS はプリフライト(OPTIONS)を扱えないため text/plain で送る
async function apiPost(body, cfg) {
  const { url, token } = cfg || getSyncConfig();
  const r = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ ...body, token }),
  });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}

async function loadState() {
  if (isSyncOn()) {
    try {
      const res = await apiGet();
      sync.version = res.version || 0;
      sync.lastAt = res.updatedAt || "";
      sync.ok = true;
      if (res.data) {
        sync.base = structuredClone(res.data);
        try {
          window.localStorage.setItem(STORAGE_KEY, JSON.stringify(res.data));
        } catch (e) {}
        return res.data;
      }
      // サーバーがまだ空 → この端末のデータを初期投入する
      sync.base = null;
    } catch (e) {
      sync.ok = false; // オフライン等。ローカルのデータで起動する
    }
  }
  try {
    const raw = window.localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {
    // キーが無い/壊れている場合などは初期値で開始
  }
  return null;
}

// 戻り値: { mode: "local"|"synced"|"offline", merged: マージで内容が変わった場合の最新データ }
async function saveState(state) {
  try {
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.error("保存に失敗しました", e);
  }
  if (!isSyncOn()) return { mode: "local" };
  try {
    let res = await apiPost({ baseVersion: sync.version, data: state });
    let saved = state;
    let merged = null;
    if (res.conflict) {
      // 他の人が先に保存していた → 3-wayマージしてから送り直す
      saved = mergeState(sync.base, state, res.data);
      merged = saved;
      res = await apiPost({ baseVersion: res.version, data: saved });
      if (res.conflict) return { mode: "offline" }; // 続けて競合。次回の保存で再試行
    }
    sync.version = res.version || sync.version;
    sync.lastAt = res.updatedAt || "";
    sync.base = structuredClone(saved);
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
    } catch (e) {}
    return { mode: "synced", merged };
  } catch (e) {
    return { mode: "offline" };
  }
}

/* ---------- 3-wayマージ ----------
   base=最後に同期した内容 / mine=自分の変更 / theirs=サーバー最新。
   キー単位で「どちらが変えたか」を見て、両方が同じ所を変えたときだけ自分優先にする。 */
function jsonEq(a, b) {
  return JSON.stringify(a ?? null) === JSON.stringify(b ?? null);
}
// 氏名リストなどの配列: 追加は両方活かし、どちらかの削除は反映。順序は自分優先。
function mergeList(base, mine, theirs) {
  const B = new Set(base || []);
  const M = mine || [];
  const T = theirs || [];
  const ms = new Set(M);
  const ts = new Set(T);
  const removed = (x) => B.has(x) && (!ms.has(x) || !ts.has(x));
  const res = [];
  for (const x of M) if (!removed(x) && !res.includes(x)) res.push(x);
  for (const x of T) if (!removed(x) && !res.includes(x)) res.push(x);
  return res;
}
// [{id,...}] を id 単位で統合（同じidは自分の内容を優先／どちらかが消したら削除）
function mergeByIdList(base, mine, theirs) {
  const B = base || [], M = mine || [], T = theirs || [];
  const bIds = new Set(B.map((x) => x && x.id));
  const mIds = new Set(M.map((x) => x && x.id));
  const tIds = new Set(T.map((x) => x && x.id));
  const removed = (id) => bIds.has(id) && (!mIds.has(id) || !tIds.has(id));
  const res = [];
  const seen = new Set();
  for (const x of M) {
    if (!x || removed(x.id)) continue;
    res.push(x); seen.add(x.id);
  }
  for (const x of T) {
    if (!x || seen.has(x.id) || removed(x.id)) continue;
    res.push(x);
  }
  return res;
}
// { 日付: [{id,...}] } を日付ごとに id 単位で統合
function mergeByIdMap(base, mine, theirs) {
  const B = base || {}, M = mine || {}, T = theirs || {};
  const out = {};
  for (const k of new Set([...Object.keys(M), ...Object.keys(T)])) {
    const list = mergeByIdList(B[k], M[k], T[k]);
    if (list.length) out[k] = list;
  }
  return out;
}
// events のような { 氏名: { 日付: 値 } } を、日付単位で3-wayマージ
function mergeNested2(base, mine, theirs) {
  const B = base || {}, M = mine || {}, T = theirs || {};
  const out = {};
  for (const k of new Set([...Object.keys(M), ...Object.keys(T)])) {
    const bk = B[k] || {}, mk = M[k] || {}, tk = T[k] || {};
    const sub = {};
    for (const s of new Set([...Object.keys(mk), ...Object.keys(tk)])) {
      const mineChanged = !jsonEq(mk[s], bk[s]);
      // 自分が変えていれば自分、そうでなければ相手（＝相手だけが変えた分を取り込む）
      const v = mineChanged ? mk[s] : tk[s];
      if (v !== undefined) sub[s] = v;
    }
    if (Object.keys(sub).length) out[k] = sub;
  }
  return out;
}
function mergeState(base, mine, theirs) {
  const b = base || {};
  const m = mine || {};
  const t = theirs || {};
  const out = { ...t };
  // 設定系は「変更した側」を採用（両方変えていれば自分優先）
  for (const key of [
    "alertsEnabled", "pairsEnabled", "partConfig",
    "autoRules", "pairsNG", "dismissedAlerts",
  ]) {
    out[key] = !jsonEq(m[key], b[key]) ? m[key] : t[key];
  }
  out.slotMode = m.slotMode; // 表示モードは各自の手元の状態を維持
  out.members = mergeList(b.members, m.members, t.members);
  out.orderMembers = mergeList(b.orderMembers, m.orderMembers, t.orderMembers);
  out.events = mergeNested2(b.events, m.events, t.events);
  out.todos = mergeByIdMap(b.todos, m.todos, t.todos);
  out.officeEvents = mergeByIdMap(b.officeEvents, m.officeEvents, t.officeEvents);
  out.handovers = mergeByIdList(b.handovers, m.handovers, t.handovers);
  return out;
}

/* ---------- バックアップ（JSON書き出し／読み込み） ---------- */
function downloadBackup(state) {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  const name = `soumu_schedule_backup_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.json`;
  const blob = new Blob([JSON.stringify(state, null, 2)], {
    type: "application/json",
  });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function readBackupFile(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => {
      try {
        resolve(JSON.parse(fr.result));
      } catch (e) {
        reject(new Error("JSONとして読み取れませんでした"));
      }
    };
    fr.onerror = () => reject(new Error("ファイルを読み込めませんでした"));
    fr.readAsText(file);
  });
}

/* 旧データ（tel1/tel2 等 / AM・PM 単一オブジェクト）を現区分・配列形式へ移行 */
function migrateEvents(events) {
  const next = structuredClone(events);
  for (const m of Object.keys(next)) {
    for (const ds of Object.keys(next[m] || {})) {
      const day = next[m][ds];
      for (const slot of ["AM", "PM"]) {
        const v = day[slot];
        if (v == null) continue;
        if (Array.isArray(v)) {
          day[slot] = v
            .filter((e) => e && e.cat)
            .map((e) => ({ cat: normCat(e.cat), text: e.text || "", ...(e.part ? { part: true } : {}), ...(e.allDay ? { allDay: true } : {}) }));
          if (day[slot].length === 0) delete day[slot];
        } else if (v.cat) {
          day[slot] = [{ cat: normCat(v.cat), text: v.text || "", ...(v.part ? { part: true } : {}), ...(v.allDay ? { allDay: true } : {}) }];
        } else {
          delete day[slot];
        }
      }
      if (Array.isArray(day.timed)) {
        day.timed = day.timed.map((it) => ({ ...it, cat: normCat(it.cat) }));
      }
    }
  }
  return next;
}

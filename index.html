/* ============================================================
   引継ぎ（申し送りログ）モーダル
   ============================================================ */
function fmtHandoverTime(ms) {
  const d = new Date(ms);
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
// 申し送り一覧 → チャット貼り付け用の整形テキスト
// 形式: 区切り線 → 日付 → カテゴリ別（引き継ぎ→共有→不都合→不便）に「・本文」で列挙。
// 引き継ぎは常に見出しを出し、共有/不都合/不便は該当があるときだけ記載。
function buildHandoverSummary(items) {
  const now = new Date();
  const dateLabel = `${now.getFullYear()}/${now.getMonth() + 1}/${now.getDate()}（${WEEKDAYS_JP[now.getDay()]}）`;
  // 1件を「・先頭行 + 続き行（記号なし）」に整形
  const fmtEntry = (h) => {
    const lines = String(h.text || "").split(/\r?\n/);
    const first = "・" + (lines[0] || "");
    const rest = lines.slice(1);
    return rest.length ? first + "\n" + rest.join("\n") : first;
  };
  const sections = [];
  for (const key of HANDOVER_CAT_KEYS) {
    const entries = items.filter((h) => normHandoverCat(h.category) === key);
    // 共有/不都合/不便は該当が無ければ省略（引き継ぎは常に記載）
    if (key !== "hikitsugi" && entries.length === 0) continue;
    const body = entries.length ? entries.map(fmtEntry).join("\n") : "・";
    sections.push(`${HANDOVER_CATS[key].label}\n${body}`);
  }
  return `-------------------\n${dateLabel}\n${sections.join("\n\n")}`;
}
// クリップボードへコピー（navigator.clipboard 優先、file:// 等のフォールバック付き）
async function copyToClipboard(textStr) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(textStr);
      return true;
    }
  } catch (e) {
    /* フォールバックへ */
  }
  try {
    const ta = document.createElement("textarea");
    ta.value = textStr;
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (e) {
    return false;
  }
}
/* 最終同期時刻の表示（HH:MM） */
function fmtSyncAt(iso) {
  try {
    const d = new Date(iso);
    if (isNaN(d)) return "";
    const p = (n) => String(n).padStart(2, "0");
    return `${p(d.getHours())}:${p(d.getMinutes())}`;
  } catch (e) {
    return "";
  }
}

/* ============================================================
   共有設定モーダル（GAS WebアプリのURL＋合言葉）
   ============================================================ */
function SyncConfigModal({ onApply, onClose }) {
  const cur = getSyncConfig();
  const [url, setUrl] = useState(cur.url);
  const [token, setToken] = useState(cur.token);
  const [testing, setTesting] = useState(false);
  const [result, setResult] = useState(null); // {ok:boolean, msg:string}

  const test = async () => {
    if (!url.trim()) {
      setResult({ ok: false, msg: "URLを入力してください" });
      return;
    }
    setTesting(true);
    setResult(null);
    try {
      const res = await apiGet({ url: url.trim(), token: token.trim() });
      setResult({
        ok: true,
        msg: res.data
          ? `接続できました（保存済みデータあり・版 ${res.version}）`
          : "接続できました（サーバーはまだ空です。この端末のデータが初期データになります）",
      });
    } catch (e) {
      setResult({
        ok: false,
        msg: `接続できませんでした: ${e.message}／URLと、デプロイの「アクセスできるユーザー＝全員」をご確認ください`,
      });
    }
    setTesting(false);
  };

  const save = () => {
    onApply(url, token);
    alert("共有設定を保存しました。ページを再読み込みして共有データに接続します。");
    location.reload();
  };
  const turnOff = () => {
    if (!confirm("共有を解除して、この端末だけで使う状態に戻しますか？\n（サーバー上のデータは消えません）")) return;
    onApply("", "");
    location.reload();
  };

  return (
    <Modal onClose={onClose}>
      <button className="modal-close" onClick={onClose} aria-label="閉じる" title="閉じる">×</button>
      <h3>🔗 共有設定（メンバー全員でデータを共有）</h3>
      {DEFAULT_API_URL ? (
        <p className="order-note">
          このアプリには共有先が<b>あらかじめ設定済み</b>です。通常はこの画面で何もする必要はありません
          （開くだけで全員と共有されます）。別の共有先に変えたいときだけ変更してください。
        </p>
      ) : (
        <p className="order-note">
          Google Apps Script で作ったWebアプリの <b>URL</b> を入れると、
          データがサーバーに保存され<b>全員で同じ予定表</b>を見られるようになります。
          未設定のままなら、これまでどおりこの端末だけで動きます。
        </p>
      )}

      <p className="m-label">WebアプリのURL</p>
      <input
        className="m-input"
        value={url}
        placeholder="https://script.google.com/macros/s/.../exec"
        onChange={(e) => setUrl(e.target.value)}
      />
      <p className="m-label">合言葉（通常は空でOK）</p>
      <input
        className="m-input"
        value={token}
        placeholder="GAS側でTOKENを設定した場合のみ入力"
        onChange={(e) => setToken(e.target.value)}
      />

      <div className="sync-actions">
        <button className="ghost" onClick={test} disabled={testing}>
          {testing ? "接続を確認中…" : "接続テスト"}
        </button>
        {result && (
          <span className={`sync-result ${result.ok ? "ok" : "ng"}`}>
            {result.ok ? "✅" : "⚠"} {result.msg}
          </span>
        )}
      </div>

      <div className="sync-help">
        <b>初めて設定する場合の手順</b>
        <ol>
          <li>Googleドライブ →「新規」→「その他」→「Google Apps Script」</li>
          <li>配布した <code>セットアップ手順.txt</code> のコードを貼り付ける</li>
          <li>「デプロイ」→「新しいデプロイ」→ 種類「ウェブアプリ」</li>
          <li>次のユーザーとして実行 = <b>自分</b>／アクセスできるユーザー = <b>全員</b></li>
          <li>発行された <code>.../exec</code> のURLを上に貼り付け</li>
        </ol>
        ※ 2人目以降のメンバーは、同じURLを入れるだけで共有に参加できます。
      </div>

      <div className="m-actions">
        {cur.url && (
          <button className="ghost" onClick={turnOff}>共有を解除</button>
        )}
        <div className="spacer" />
        <button className="ghost" onClick={onClose}>キャンセル</button>
        <button className="primary" onClick={save} disabled={!url.trim()}>
          保存して接続
        </button>
      </div>
    </Modal>
  );
}

function HandoverModal({ handovers, onAdd, onUpdate, onDelete, onApplyTodos, onGotoDate, onClose }) {
  const [text, setText] = useState("");
  const [author, setAuthor] = useState("");
  const [category, setCategory] = useState("hikitsugi");
  const [filter, setFilter] = useState("all");
  // 編集中の申し送りID（null=新規投稿モード）
  const [editId, setEditId] = useState(null);
  // TODO抽出の確認用ドラフト（null=非表示 / 配列=確認テーブル表示）
  const [draft, setDraft] = useState(null);
  const [noHit, setNoHit] = useState(false);
  const [copied, setCopied] = useState(false);
  // TODO追加後の結果（どの日付に入ったかの案内）
  const [added, setAdded] = useState(null);

  const extract = (src) => {
    const cands = parseHandoverTodos(src, new Date()).map((c) => ({ ...c, checked: true }));
    setNoHit(cands.length === 0);
    setAdded(null);
    setDraft(cands.length ? cands : null);
  };
  const canPost = text.trim() && author.trim();
  const post = () => {
    if (!canPost) return;
    if (editId != null) {
      onUpdate(editId, { text, author, category });
      setEditId(null);
    } else {
      onAdd(text, author, category);
    }
    setText("");
  };
  // 既存の申し送りをフォームに読み込んで編集開始
  const startEditHv = (h) => {
    setEditId(h.id);
    setText(h.text || "");
    setAuthor(h.author || "");
    setCategory(normHandoverCat(h.category));
  };
  const cancelEditHv = () => {
    setEditId(null);
    setText("");
  };
  const applyDraft = () => {
    const picks = (draft || []).filter((d) => d.checked);
    if (picks.length) {
      onApplyTodos(picks);
      const dates = [...new Set(picks.map((p) => p.dateStr))].sort();
      setAdded({ count: picks.length, dates });
    }
    setDraft(null);
  };
  const toggleDraft = (id) =>
    setDraft((prev) => prev.map((d) => (d.id === id ? { ...d, checked: !d.checked } : d)));

  // 引継ぎは日毎リセット：当日分だけを対象にする（日付跨ぎでも当日のみ表示）
  const todayStr = ymd(new Date());
  const todays = handovers.filter(
    (h) => (h.date || ymd(new Date(h.createdAt))) === todayStr
  );
  const list = todays.filter((h) => filter === "all" || h.category === filter);
  const pickedCount = (draft || []).filter((d) => d.checked).length;

  // 一覧をチャット用テキストにしてコピー（当日分をカテゴリ別にまとめる）
  const copySummary = async () => {
    if (todays.length === 0) return;
    const ok = await copyToClipboard(buildHandoverSummary(todays));
    if (ok) {
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } else {
      alert("コピーに失敗しました。お手数ですが手動でコピーしてください。");
    }
  };

  return (
    <Modal wide onClose={onClose}>
      <button className="modal-close" onClick={onClose} aria-label="閉じる" title="閉じる">×</button>
      <h3>📋 引継ぎ（申し送り）</h3>
      <p className="order-note">
        当日の申し送りを記録して共有します（<b>日付が変わると自動でリセット</b>されます）。
        本文中の日付（例: 7/10・明日・来週月曜）から<b>TODOを自動抽出</b>できます。
        引き継ぎ前に「💬 チャット用にコピー」で共有しておくと安心です。
      </p>

      {/* 投稿エリア（入力者 → カテゴリ → 詳細 の順） */}
      <div className={`hv-compose ${editId != null ? "hv-editing" : ""}`}>
        {editId != null && (
          <div className="edit-banner">
            <span>申し送りを編集中（内容を変えて「更新」で確定）</span>
            <button className="mini" onClick={cancelEditHv}>やめる</button>
          </div>
        )}
        <div className="hv-meta-row">
          <input
            className={`hv-author ${!author.trim() ? "req-empty" : ""}`}
            value={author}
            placeholder="投稿者（必須）"
            onChange={(e) => setAuthor(e.target.value)}
          />
          <div className="hv-cat-pick">
            {HANDOVER_CAT_KEYS.map((k) => (
              <button
                key={k}
                type="button"
                className={`hv-cat-btn ${category === k ? "on" : ""}`}
                style={
                  category === k
                    ? { background: HANDOVER_CATS[k].bg, color: HANDOVER_CATS[k].fg, borderColor: HANDOVER_CATS[k].dot }
                    : undefined
                }
                onClick={() => setCategory(k)}
              >
                <i style={{ background: HANDOVER_CATS[k].dot }} />
                {HANDOVER_CATS[k].label}
              </button>
            ))}
          </div>
        </div>
        <textarea
          className="hv-text"
          value={text}
          placeholder={"申し送りを入力（改行で複数行）。\n例）7/10 資料提出\n　　明日 銀行へ入金\n　　来週月曜 会議準備"}
          onChange={(e) => setText(e.target.value)}
        />
        <div className="hv-compose-actions">
          <button className="ghost" onClick={() => extract(text)} title="入力中の本文から日付付きTODOを抽出">
            🗓 TODOを抽出
          </button>
          <div className="spacer" />
          <button className="primary" onClick={post} disabled={!canPost} title={!author.trim() ? "投稿者は必須です" : undefined}>
            {editId != null ? "更新" : "投稿"}
          </button>
        </div>
      </div>

      {/* 確認テーブル */}
      {draft && (
        <div className="hv-draft si-result">
          <div className="si-summary">
            抽出した候補 <b>{draft.length}件</b> のうち、チェックした {pickedCount} 件をTODOに追加します。
          </div>
          <div className="si-table-wrap">
            <table className="si-table">
              <thead>
                <tr><th style={{ width: 40 }}></th><th style={{ width: 120 }}>日付</th><th>TODO内容</th><th style={{ width: 90 }}>元表現</th></tr>
              </thead>
              <tbody>
                {draft.map((c) => {
                  const d = parseYmd(c.dateStr);
                  return (
                    <tr key={c.id} className={c.checked ? "" : "si-skip"}>
                      <td><input type="checkbox" checked={c.checked} onChange={() => toggleDraft(c.id)} /></td>
                      <td>{d.getMonth() + 1}/{d.getDate()}（{WEEKDAYS_JP[d.getDay()]}）</td>
                      <td className="si-text">{c.text}</td>
                      <td><span className="hv-label">{c.label}</span></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          <div className="m-actions">
            <button className="ghost" onClick={() => setDraft(null)}>キャンセル</button>
            <div className="spacer" />
            <button className="primary" disabled={pickedCount === 0} onClick={applyDraft}>
              選択した {pickedCount} 件をTODOに追加
            </button>
          </div>
        </div>
      )}
      {noHit && !draft && (
        <p className="hv-nohit">日付として認識できる表現が見つかりませんでした（例: 7/10・明日・来週月曜）。</p>
      )}
      {added && !draft && (
        <div className="hv-added">
          <div className="hv-added-msg">✓ {added.count}件のTODOを追加しました。</div>
          <div className="hv-added-sub">
            日付をクリックするとその週の表を開いて確認できます（別の週の日付はその週に移動すると表示されます）:
          </div>
          <div className="hv-added-dates">
            {added.dates.map((ds) => {
              const d = parseYmd(ds);
              return (
                <button key={ds} className="hv-added-date" onClick={() => onGotoDate(ds)}>
                  {d.getMonth() + 1}/{d.getDate()}（{WEEKDAYS_JP[d.getDay()]}）→ 表示
                </button>
              );
            })}
          </div>
        </div>
      )}

      {/* 本日の申し送り一覧（日毎にリセット） */}
      <div className="hv-log-head">
        <span>本日の申し送り（{todays.length}件）</span>
        {todays.length > 0 && (
          <button
            className={`hv-copy ${copied ? "done" : ""}`}
            onClick={copySummary}
            title="本日の申し送りをカテゴリ別にまとめたテキストをコピーします（チャット貼り付け用）"
          >
            {copied ? "✓ コピーしました" : "💬 チャット用にコピー"}
          </button>
        )}
      </div>

      {/* 絞り込み */}
      <div className="hv-filter">
        <button className={filter === "all" ? "on" : ""} onClick={() => setFilter("all")}>すべて</button>
        {HANDOVER_CAT_KEYS.map((k) => (
          <button key={k} className={filter === k ? "on" : ""} onClick={() => setFilter(k)}>
            {HANDOVER_CATS[k].label}
          </button>
        ))}
      </div>

      {/* ログ一覧 */}
      {list.length === 0 ? (
        <p className="todo-empty">本日の申し送りはまだありません</p>
      ) : (
        <ul className="hv-list">
          {list.map((h) => {
            const c = HANDOVER_CATS[normHandoverCat(h.category)];
            return (
              <li key={h.id} className={`hv-item ${editId === h.id ? "hv-item-editing" : ""}`}>
                <div className="hv-item-head">
                  <span className="hv-badge" style={{ background: c.bg, color: c.fg }}>
                    <i style={{ background: c.dot }} />{c.label}
                  </span>
                  <span className="hv-meta">
                    {fmtHandoverTime(h.createdAt)}{h.author ? ` ・ ${h.author}` : ""}
                  </span>
                  <div className="spacer" />
                  <button className="hv-extract" title="この申し送りからTODOを抽出" onClick={() => extract(h.text)}>
                    🗓 TODO抽出
                  </button>
                  <button className="hv-edit" title="この申し送りを編集（上のフォームに読み込み）" onClick={() => startEditHv(h)}>
                    ✎ 編集
                  </button>
                  <button
                    className="hv-del"
                    title="削除"
                    onClick={() => { onDelete(h.id); if (editId === h.id) cancelEditHv(); }}
                  >
                    ×
                  </button>
                </div>
                <div className="hv-body">{h.text}</div>
              </li>
            );
          })}
        </ul>
      )}

      <div className="m-actions">
        <div className="spacer" />
        <button className="ghost" onClick={onClose}>閉じる</button>
      </div>
    </Modal>
  );
}

/* ---- 週グリッド ---- */
.grid-wrap {

.grid { border-collapse: collapse; width: 100%; min-width: 820px; table-layout: fixed; }
/* 罫線はニュートラルなグレー系（区分色「その他」等のタン系と被らないように） */

.grid tbody tr.row-even td.cell,

.cell { padding: 4px; vertical-align: top; position: relative; }

/* ---- 日表示 ---- */
.day-wrap {

.cal-scroll { overflow-x: auto; }
.cal {
  display: grid; position: relative;
  border: 1px solid #e8e3d6; border-radius: 10px; overflow: hidden;

.cal-corner, .cal-head {
  background: #1f2a44; color: #fff; padding: 10px 4px;

  font-size: 9.5px; color: #6b6657; padding: 2px 3px 0; font-weight: 700;
  border-top: 1px solid #d8d2c4; text-align: right;

/* ---- 日表示・時間軸の AM/PM 帯 ---- */
.cal-band-corner {
  background: #efece4; color: #6b6657;
  font-size: 10px; font-weight: 700; text-align: center;
  display: grid; place-items: center;
  border-bottom: 2px solid #d8d2c4;
  position: sticky; top: 0; z-index: 3;
}
.cal-band-cell {
  background: #f7f4ec; border-left: 1px solid #e8e3d6;
  border-bottom: 2px solid #d8d2c4;

  position: sticky; top: 0; z-index: 2;

  display: flex; align-items: center; flex-wrap: wrap; gap: 4px;

.band-chip {

.band-fullday {

.cal-col { position: relative; border-right: 1px solid #e8e3d6; }
.cal-slot-bg { border-top: 1px solid #e3ddcf; }
.cal-slot-bg:hover { background: #fbf7e8; }
.cal-event {

/* ---- モーダル ---- */
.overlay {
  position: fixed; inset: 0; background: rgba(20,24,38,.55);
  display: grid; place-items: center; z-index: 50; padding: 20px;
}
.modal {
  background: #fff; border-radius: 16px; padding: 24px;
  width: 100%; max-width: 440px;
  box-shadow: 0 24px 60px rgba(0,0,0,.3);
  position: relative;
  max-height: calc(100vh - 40px); overflow-y: auto;
}
.modal h3 {
  font-family: 'Zen Maru Gothic'; font-size: 17px;
  color: #1f2a44; margin-bottom: 16px;
  padding-right: 40px;
}
.modal-close {
  position: absolute; top: 12px; right: 12px;
  width: 32px; height: 32px; border-radius: 50%;
  border: none; background: #efece4; color: #5a5547;
  font-size: 20px; font-weight: 700; line-height: 1;
  cursor: pointer; display: grid; place-items: center;
  transition: background .12s, color .12s, transform .08s;
}
.modal-close:hover { background: #1f2a44; color: #fff; transform: scale(1.05); }
.m-label { font-size: 12px; color: #8a8472; margin: 14px 0 8px; font-weight: 700; }
.cat-grid {
  display: grid; grid-template-columns: repeat(3,1fr); gap: 7px;
}
.cat-btn {
  border: 2px solid transparent; border-radius: 8px;
  padding: 10px 4px; cursor: pointer; font-family: inherit;
  font-size: 12.5px; font-weight: 700;
}
.cat-btn.sel { border-color: #1f2a44; }
.cat-sub { display: flex; gap: 7px; margin-top: 7px; }
.cat-mini {
  border: 2px solid transparent; border-radius: 7px;
  padding: 6px 14px; cursor: pointer; font-family: inherit;
  font-size: 11.5px; font-weight: 700; opacity: .85;
}
.cat-mini.sel { border-color: #1f2a44; opacity: 1; }
.m-input, .time-row input {
  width: 100%; border: 1px solid #d8d2c4; border-radius: 8px;
  padding: 10px 12px; font-family: inherit; font-size: 14px;
  margin-top: 6px;
}
.time-row {
  display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
}
.time-row input { width: auto; flex: 1; margin-top: 0; }
.m-actions {
  display: flex; align-items: center; gap: 8px; margin-top: 22px;
}
.m-actions .spacer { flex: 1; }
.m-actions button {
  border: none; cursor: pointer; padding: 10px 18px;
  border-radius: 8px; font-family: inherit; font-size: 13px; font-weight: 700;
}
.m-actions .primary { background: #1f2a44; color: #fff; }
.m-actions .ghost { background: #efece4; color: #5a5547; }
.m-actions .del { background: #fdecea; color: #d9534f; }

.ev-list {
  background: #faf8f1; border-radius: 10px; padding: 8px;
  margin-bottom: 8px; display: flex; flex-direction: column; gap: 6px;
}
.ev-row {
  display: flex; align-items: center; gap: 8px; font-size: 13px;
  background: #fff; border-radius: 7px; padding: 7px 9px;
}
.ev-color { width: 12px; height: 12px; border-radius: 3px; }
.ev-txt { flex: 1; color: #5a5547; }
.ev-row .mini {
  border: none; background: #fdecea; color: #d9534f;
  cursor: pointer; font-size: 11px; padding: 4px 9px; border-radius: 6px;
  font-family: inherit;
}
.ev-row .mini.edit { background: #e6effb; color: #2563eb; }
.ev-row.ev-row-editing {
  outline: 2px solid #2563eb; outline-offset: -1px;
}
.edit-banner {
  display: flex; align-items: center; gap: 8px;
  background: #e6effb; border: 1px solid #bcd3f5; border-radius: 8px;
  padding: 8px 10px; margin: 12px 0 4px;
  font-size: 12px; color: #1e3a5f; font-weight: 700;
}
.edit-banner span { flex: 1; }
.edit-banner .mini {
  border: none; background: #fff; color: #2563eb;
  cursor: pointer; font-size: 11px; padding: 4px 10px; border-radius: 6px;
  font-family: inherit; font-weight: 700;
}

.todo-panel {
  background: #fff; border-radius: 14px;
  margin-top: 16px; padding: 18px 20px;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
}
.todo-panel.event-panel .todo-head h3 { color: #7c4a17; }
.todo-panel.event-panel .todo-add { background: #7c4a17; }
.todo-panel.event-panel .todo-add:hover { background: #96591d; }
.todo-panel.event-panel .todo-input input:focus { outline-color: #7c4a17; }
.todo-text-nocheck { flex: 1; font-size: 14px; color: #2a2a2a; line-height: 1.4; word-break: break-word; }
.todo-panel.compact { padding: 14px 16px; }
.todo-panel.compact .todo-head h3 { font-size: 14px; }
.todo-panel.compact .todo-count { font-size: 11px; }
.todo-panel.compact .todo-input input { padding: 8px 10px; font-size: 13px; }
.todo-panel.compact .todo-add { padding: 8px 14px; font-size: 12px; }
.todo-panel.compact .todo-list li { padding: 8px 10px; font-size: 13px; }
.todo-head {
  display: flex; align-items: baseline; justify-content: space-between;
  flex-wrap: wrap; gap: 8px; margin-bottom: 14px;
  border-bottom: 2px solid #f0ece1; padding-bottom: 10px;
}
.todo-head h3 {
  font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700;
  font-size: 16px; color: #1f2a44;
}
.todo-count { font-size: 12px; color: #8a8472; font-weight: 700; }
.todo-input { display: flex; gap: 8px; margin-bottom: 14px; }
.todo-input input {
  flex: 1; border: 1px solid #d8d2c4; border-radius: 8px;
  padding: 10px 12px; font-family: inherit; font-size: 14px;
}
.todo-input input:focus { outline: 2px solid #1f2a44; border-color: transparent; }
.todo-add {
  border: none; background: #1f2a44; color: #fff; cursor: pointer;
  padding: 10px 20px; border-radius: 8px; font-family: inherit;
  font-size: 13px; font-weight: 700;
}
.todo-add:hover { background: #2c3a5c; }
.todo-empty { color: #b5af9e; font-size: 13px; padding: 8px 2px; }
.todo-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
.todo-list li {
  display: flex; align-items: center; gap: 10px;
  background: #faf8f1; border-radius: 9px; padding: 10px 12px;
}
.todo-list li.done { background: #f1f5ef; }
.todo-check {
  flex: 1; display: flex; align-items: center; gap: 10px;
  cursor: pointer; font-size: 14px;
}
.todo-check input { width: 17px; height: 17px; cursor: pointer; accent-color: #1f2a44; }
.todo-text { color: #2a2a2a; }
.todo-list li.done .todo-text {
  text-decoration: line-through; color: #a8a294;
}
.todo-del {
  border: none; background: transparent; color: #c5bfae;
  cursor: pointer; font-size: 18px; line-height: 1; padding: 2px 6px;
}
.todo-del:hover { color: #d9534f; }

.foot {
  text-align: center; font-size: 11px; color: #a59f8d;
  margin-top: 16px;
}

@media (max-width: 640px) {
  .app { padding: 10px; }
  .nav { margin-left: 0; width: 100%; flex-wrap: wrap; }
  .day-row { grid-template-columns: 70px 1fr 1fr; }
}

/* ---- ドラッグハンドル ---- */
.drag-handle {
  display: inline-block; cursor: grab; color: #b5af9e;
  font-size: 14px; margin-right: 3px; vertical-align: middle;
  user-select: none; line-height: 1;
}
.drag-handle:active { cursor: grabbing; }

/* ---- インライン名前編集 ---- */
.member-name-label {
  cursor: pointer;
  border-bottom: 1px dashed transparent; transition: border-color .15s;
}
.member-name-label:hover { border-bottom-color: #9b9484; }
.name-label-cal { color: inherit; }
.name-label-cal:hover { border-bottom-color: rgba(255,255,255,.6); }

.name-edit {
  width: 70px; border: 1px solid #1f2a44; border-radius: 4px;
  padding: 2px 5px; font-family: inherit; font-size: 13px; font-weight: 700;
  background: #fff; color: #1f2a44; vertical-align: middle;
}
.name-edit-cal {
  background: rgba(255,255,255,.2); color: #fff;
  border-color: #f4c542; width: 80px;
}

/* ---- ドラッグ中の視覚フィードバック ---- */
.row-dragging { opacity: 0.35; }
.col-dragging { opacity: 0.35; }
.grid tr.drag-over > td,
.grid tr.drag-over > th { box-shadow: inset 0 3px 0 #1f2a44; }
.day-row.drag-over-row {
  outline: 2px dashed #1f2a44; outline-offset: -2px; border-radius: 8px;
}
.cal-head.drag-over-col { box-shadow: inset -3px 0 0 #f4c542; }

/* .day-name を flex に変更してハンドル・名前を横並びに */
.day-name {
  display: flex; align-items: center; justify-content: center;
  flex-wrap: wrap; gap: 2px; padding: 4px;
}

/* ---- AM/PM スロット 複数エントリ・派生エントリ ---- */
.slot {
  display: flex; flex-direction: column; gap: 4px;
  border: 1px dashed #ddd6c6; background: #fff;
  border-radius: 7px; padding: 6px; min-height: 38px;
  cursor: pointer; font-family: inherit; font-size: 12.5px;
  text-align: left; color: #3a3a3a; transition: transform .08s;
  width: 100%;
}
.slot:hover { transform: translateY(-1px); border-style: solid; }
.slot-entries { display: flex; flex-direction: column; gap: 3px; }
.slot-entry {
  font-size: 11.5px; font-weight: 600; border-radius: 4px;
  padding: 3px 6px; line-height: 1.35;
}
.slot-entry-derived {
  border: 1px solid rgba(0,0,0,.08);
  border-left: 3px solid #94a3b8;     /* inline で区分色に上書き */
  border-radius: 5px; padding: 4px 6px;
  opacity: 1; font-weight: 500;
  display: flex; flex-direction: column; gap: 2px;
}
.se-time {
  align-self: flex-start;
  font-size: 9.5px; font-weight: 700; color: #44403a;
  background: rgba(0,0,0,.07); border-radius: 3px; padding: 1px 5px;
  letter-spacing: .2px; font-variant-numeric: tabular-nums;
}
.se-text {
  font-size: 11.5px; font-weight: 600; color: #2b2b2b;
  line-height: 1.3; word-break: break-word;
}
.slot-empty { color: #bdb6a4; font-size: 12px; padding: 2px; }

/* 有給/公休（全日）は AM/PM を結合し、セル全体（縦いっぱい）を埋める */
.ampm-merged {
  display: flex; flex-direction: column; gap: 4px;
  width: 100%; height: 100%; min-height: 84px;
  border: 2px solid currentColor; border-radius: 8px;
  padding: 8px; font-family: inherit; transition: transform .08s;
}
.ampm-merged:hover { transform: translateY(-1px); }
.fd-main {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; border: none; background: transparent; color: inherit;
  cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 700;
  text-align: center;
}
.ampm-merged em {
  font-style: normal; font-size: 10px; font-weight: 700;
  background: rgba(0,0,0,.12); padding: 2px 7px; border-radius: 4px;
}
.fd-label { font-size: 15px; font-weight: 700; }
.fd-derived { display: flex; flex-direction: column; gap: 3px; }
.fd-derived .slot-entry {
  cursor: pointer; text-align: left; font-family: inherit; width: 100%;
}
/* td セルを縦に伸ばして結合マスがぴったり埋まるようにする */
.cell:has(.ampm-merged) { height: 1px; }

/* 日表示の AmpmCell（横並び 2 マス） */
.ampm-day { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; grid-column: 2 / -1; }
.ampm-day .slot { min-height: 80px; padding: 10px 12px; font-size: 14px; }
.ampm-day .slot-tag {
  font-style: normal; font-size: 11px; font-weight: 700;
  background: rgba(0,0,0,.08); padding: 2px 6px; border-radius: 4px;
  align-self: flex-start;
}
.ampm-merged-day {
  grid-column: 2 / -1; min-height: 80px; font-size: 16px;
}
.ampm-merged-day .fd-label { font-size: 16px; }

/* 週表示の timed セル：AM/PM 由来の合成イベント */
.tev-synth {
  border: 1px dashed currentColor;
  background: rgba(255,255,255,.5) !important;
  opacity: .85;
}

.ampm-hint {
  font-size: 11.5px; color: #8a6a1a;
  background: #fff6e3; border: 1px solid #f0d9a8;
  border-radius: 8px; padding: 8px 10px; margin: 10px 0 0;
  line-height: 1.5;
}
.ampm-hint b { color: #8a5a00; }
.ampm-steps {
  font-size: 12px; color: #3f6ad8; background: #eef3ff;
  border: 1px solid #cdddfb; border-radius: 8px;
  padding: 7px 10px; margin: 2px 0 8px; line-height: 1.5;
}
.ev-fd-badge {
  font-size: 10px; font-weight: 700; color: #4a3785;
  background: #efe8ff; border: 1px solid #cbb8ef;
  border-radius: 4px; padding: 1px 6px; white-space: nowrap;
}

/* メモだけ追加（区分・時間なし） */
.memo-row { display: flex; gap: 8px; align-items: stretch; }
.memo-row .m-input { flex: 1; margin-top: 6px; }
.memo-add {
  margin-top: 6px; flex-shrink: 0;
  border: none; background: #1f2a44; color: #fff; cursor: pointer;
  padding: 0 16px; border-radius: 8px; font-family: inherit;
  font-size: 13px; font-weight: 700;
}
.memo-add:hover { background: #2c3a5c; }
.memo-add:disabled { opacity: .4; cursor: not-allowed; }

/* 時間指定トグル */
.time-toggle {
  display: flex; align-items: center; gap: 8px;
  margin: 14px 0 6px; font-size: 13px; color: #3a3a3a;
  cursor: pointer; user-select: none;
}
.time-toggle input[type="checkbox"] {
  width: 16px; height: 16px; accent-color: #1f2a44; cursor: pointer;
}
.time-row-inline {
  margin: 4px 0 4px; padding: 10px 12px;
  background: #f0f4fa; border: 1px solid #d6e0ef; border-radius: 8px;
  display: flex; flex-direction: column; gap: 8px;
}
.time-inputs { display: flex; align-items: center; gap: 10px; }
.time-inputs input[type="time"] {
  flex: 1; min-width: 0;
  border: 1px solid #d8d2c4; border-radius: 6px; padding: 8px 10px;
  font-family: inherit; font-size: 14px;
}
.time-inputs span { font-weight: 700; color: #1f2a44; }
.time-add {
  width: 100%; border: none; background: #1f2a44; color: #fff;
  cursor: pointer; padding: 10px 14px; border-radius: 6px;
  font-family: inherit; font-size: 13.5px; font-weight: 700;
  transition: background .12s;
}
.time-add:hover { background: #2c3a5c; }

/* 編集モーダルの予定行で、時間軸の予定だけ少し別表示 */
.ev-row-timed { background: #f0f4fa !important; border: 1px dashed #b6c5df; }
.ev-time {
  font-family: 'Courier New', monospace; font-weight: 700;
  color: #1f2a44; font-size: 12.5px;
  background: #fff; border-radius: 4px; padding: 1px 5px;
}

/* ---- 週表示・時間軸モード（全メンバー混在） ---- */
.wcal-scroll {
  background: #fff; padding: 4px; overflow-x: auto;
}
.wcal {
  display: grid; position: relative;
  border: 1px solid #e8e3d6;
  border-radius: 10px 10px 0 0;
  /* overflow:hidden は時刻列の横スティッキーを壊すため付けない */
}
.wcal-corner, .wcal-head {
  background: #1f2a44; color: #fff; padding: 8px 6px;
  font-size: 12px; font-weight: 700; text-align: center;
  position: sticky; top: 0; z-index: 3;
}
.wcal-head { border-right: 2px solid #3a496e; }
.wcal-head:last-child { border-right: none; }
.wcal-head.today { background: #b9802a; box-shadow: inset 0 -3px 0 #f4c542; }
.wcal-head.sat { background: #324b75; }
.wcal-head.clickable { cursor: pointer; }
.wcal-head.clickable:hover { filter: brightness(1.12); }
.wcal-head.selected { background: #2563eb; box-shadow: inset 0 -3px 0 #93c5fd; }
.wcal-corner { z-index: 7; left: 0; }
.wch-date { font-weight: 700; font-size: 13px; }
.wch-wd { font-size: 11px; opacity: .85; margin-top: 1px; }
/* 時刻列は横スクロールしても左に固定 */
.wcal-time-col {
  background: #faf8f1; border-right: 1px solid #d8d2c4;
  position: sticky; left: 0; z-index: 6;
}
.wcal-hour {
  font-size: 10.5px; color: #6b6657; padding: 2px 6px 0; font-weight: 700;
  border-top: 1px solid #d8d2c4; text-align: right;
}
.wcal-col { position: relative; border-right: 1px solid #b9b1a0; }
.wcal-col:last-child { border-right: none; }
.wcal-col.today {
  background: #fff7e6;
  box-shadow: inset 3px 0 0 #f4c542, inset -3px 0 0 #f4c542;
}
.wcal-slot-bg { border-top: 1px solid #e3ddcf; }
.wcal-event {
  position: absolute;
  border-radius: 5px; padding: 1px 2px 1px 4px;
  background: #fff;
  font-size: 10.5px; line-height: 1.2;
  overflow: hidden; cursor: pointer;
  box-shadow: 0 1px 2px rgba(0,0,0,.10);
  transition: box-shadow .12s;
}
.wcal-event:hover { z-index: 10 !important; box-shadow: 0 4px 12px rgba(0,0,0,.25); }
.wce-head {
  display: flex; align-items: center; gap: 4px;
}
.wcal-event .wce-member {
  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: 4px;
  font-size: 12.5px; font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.wce-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  display: inline-block;
}
/* 役割(区分)バッジ — 名前の下の行に表示 */
.wce-role {
  display: inline-block; align-self: flex-start;
  margin-top: 3px;
  font-size: 10.5px; font-weight: 700; line-height: 1;
  padding: 2px 7px; border-radius: 999px;
  white-space: nowrap; max-width: 100%;
  overflow: hidden; text-overflow: ellipsis;
  box-shadow: 0 1px 2px rgba(0,0,0,.18);
}
.wcal-event .wce-text {
  display: block; font-size: 10.5px; opacity: .85;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-top: 2px;
}
/* 結合ブロック: 氏名＋共通時間帯を1回、主役は背景色、その他はドットリスト */
.wce-body {
  display: flex; flex-direction: column; gap: 1px;
  height: 100%; min-width: 0; overflow: hidden;
}
.wce-cl-head {
  display: flex; align-items: baseline; gap: 4px;
  min-width: 0;
}
.wce-name {
  font-size: 10px; font-weight: 700;
  line-height: 1.1; flex-shrink: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.wce-cl-head .wce-time2 {
  font-size: 8.5px; opacity: .8; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.wce-lead {
  font-size: 10.5px; font-weight: 700; line-height: 1.15;
  cursor: pointer;
  white-space: normal; word-break: break-word; overflow: hidden;
}
.wce-dotlist {
  display: flex; flex-direction: column; gap: 1px; min-height: 0;
}
.wce-dotrow {
  display: flex; align-items: center; gap: 3px;
  font-size: 9.5px; line-height: 1.15; cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.wce-dotrow:hover { text-decoration: underline; }
.wce-dot2 {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
  display: inline-block;
}
.wce-dotlabel { overflow: hidden; text-overflow: ellipsis; }
/* 単一表示・日パネル用に旧バッジ系も残す */
.wce-role2 {
  align-self: flex-start; max-width: 100%;
  font-size: 10px; font-weight: 700; line-height: 1.1;
  padding: 2px 5px; border-radius: 8px;
  white-space: normal; word-break: break-word; overflow: hidden;
  box-shadow: 0 1px 2px rgba(0,0,0,.18);
}
.wce-time2 {
  font-size: 9.5px; opacity: .85;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* 本日の予定ブロックを強調 */
.wcal-event.wce-today {
  box-shadow: 0 2px 8px rgba(0,0,0,.22);
  outline: 2px solid rgba(0,0,0,.10);
}

/* ===== 日詳細（全幅モーダル） ===== */
.modal.modal-wide { max-width: min(96vw, 1200px); width: 96vw; }
.day-detail { display: flex; flex-direction: column; gap: 8px; }
.day-detail.day-alert { box-shadow: 0 0 0 2px #f0b24a inset; border-radius: 8px; }
.day-side-head {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.dsh-title { font-weight: 700; font-size: 15px; color: #1f2a44; flex: 1; }
.order-cfg.sm { padding: 4px 8px; font-size: 12px; }
.day-side-close {
  width: 28px; height: 28px; flex-shrink: 0;
  border: 1px solid #e0dccf; background: #fff; border-radius: 50%;
  font-size: 17px; line-height: 1; color: #6b6657; cursor: pointer;
}
.day-side-close:hover { background: #f0ece0; }
.day-detail-scroll { max-height: 72vh; overflow: auto; }
.cal-fullday {
  position: absolute; top: 2px; left: 2px; right: 2px;
  z-index: 4; border-radius: 5px; padding: 3px 5px;
  font-size: 10.5px; font-weight: 700; text-align: center;
  cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.15);
}
/* 時間軸のヘッダーに出す「休み」の人チップ */

.auto-warn {

.hv-author {
  border: 1px solid #d8d2c4; border-radius: 8px; padding: 7px 10px;
  font-family: inherit; font-size: 13px; width: 150px;
}
.hv-author.req-empty { border-color: #e0a3a3; background: #fdf6f6; }
.hv-nohit { color: #a06b2a; font-size: 13px; margin: 6px 2px 12px; }

.hv-added {
  border: 1px solid #86c9a4; background: #eefaf2; border-radius: 10px;
  padding: 11px 13px; margin: 6px 0 14px;
}
.hv-added-msg { font-size: 13.5px; font-weight: 700; color: #1f7a45; }
.hv-added-sub { font-size: 12px; color: #4b6b58; margin: 3px 0 8px; }
.hv-added-dates { display: flex; flex-wrap: wrap; gap: 6px; }
.hv-added-date {
  border: 1px solid #2f855a; background: #fff; color: #22643c;
  border-radius: 999px; padding: 4px 12px; font-size: 12.5px;
  font-family: inherit; font-weight: 700; cursor: pointer; white-space: nowrap;
}
.hv-added-date:hover { background: #d7f5e2; }

.hv-log-head {
  display: flex; align-items: center; gap: 10px;
  font-size: 13px; font-weight: 700; color: #1f2a44;
  margin: 16px 0 8px; padding-top: 12px; border-top: 1px solid #ece5d4;
}
.hv-copy {
  margin-left: auto;
  border: 1px solid #2f855a; background: #f0fff4; color: #22643c;
  border-radius: 8px; padding: 5px 12px; font-size: 12.5px;
  font-family: inherit; font-weight: 700; cursor: pointer; white-space: nowrap;
}
.hv-copy:hover { background: #d7f5e2; }
.hv-copy.done { background: #22643c; border-color: #22643c; color: #fff; }

.hv-draft { margin: 4px 0 16px; }
.hv-label {
  display: inline-block; background: #eef3fb; color: #33507d;
  border-radius: 6px; padding: 1px 7px; font-size: 11.5px; font-weight: 700;
}

.hv-filter { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
.hv-filter button {
  border: 1px solid #d8d2c4; background: #fff; color: #6b6453;
  border-radius: 999px; padding: 4px 12px; font-size: 12.5px;
  font-family: inherit; font-weight: 700; cursor: pointer;
}
.hv-filter button.on { background: #33507d; border-color: #33507d; color: #fff; }

.hv-list { list-style: none; display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; }
.hv-item { border: 1px solid #e6ddca; border-radius: 10px; padding: 9px 12px; background: #fffdf8; }
.hv-item-head { display: flex; align-items: center; gap: 8px; }
.hv-badge {
  display: inline-flex; align-items: center; gap: 5px;
  border-radius: 999px; padding: 2px 9px; font-size: 11.5px; font-weight: 700;
}
.hv-badge i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.hv-meta { font-size: 12px; color: #8a8472; }
.hv-extract {
  border: 1px solid #c7b8e8; background: #efe7fb; color: #5b3da6;
  border-radius: 7px; padding: 3px 9px; font-size: 12px; font-weight: 700;
  font-family: inherit; cursor: pointer;
}
.hv-extract:hover { background: #e5d8f8; }
.hv-edit {
  border: 1px solid #a8c3e8; background: #eaf1fb; color: #2d5590;
  border-radius: 7px; padding: 3px 9px; font-size: 12px; font-weight: 700;
  font-family: inherit; cursor: pointer;
}
.hv-edit:hover { background: #dbe8f8; }
.hv-item-editing { border-color: #7ba3dd; box-shadow: 0 0 0 2px rgba(123,163,221,.25); }
.hv-compose.hv-editing { border-color: #7ba3dd; }
.hv-del {
  border: none; background: #f1ece0; color: #8a8472; cursor: pointer;
  width: 24px; height: 24px; border-radius: 6px; font-size: 15px; line-height: 1;
}
.hv-del:hover { background: #e7dfce; color: #b0392f; }
.hv-body { margin-top: 6px; font-size: 13.5px; color: #3a3527; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
`;
